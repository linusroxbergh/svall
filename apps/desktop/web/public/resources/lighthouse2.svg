  <title id="lighthouse-a-title">Lighthouse</title>
  <desc id="lighthouse-a-desc">A tin toy lighthouse: a tapered tower in red and cream bands with a porthole and an arched slate door, a slate gallery with a railing, a lamp room glowing yellow behind slate mullions, and a red dome cap with a yellow finial, on a slate plinth.</desc>
