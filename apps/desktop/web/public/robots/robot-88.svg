@keyframes r88-glow{0%,100%{fill:#f6c354}32%,62%{fill:#f9d27b}}
@keyframes r88-raise{0%,100%{transform:none}20%,76%{transform:rotate(-16deg)}90%{transform:rotate(2deg)}}
@keyframes r88-wave{0%,100%{transform:rotate(0deg) scaleY(1)}22%{transform:rotate(-4deg) scaleY(-1)}34%{transform:rotate(-20deg) scaleY(-1)}46%{transform:rotate(5deg) scaleY(-1)}58%{transform:rotate(-16deg) scaleY(-1)}70%{transform:rotate(2deg) scaleY(-1)}88%{transform:rotate(1.5deg) scaleY(1)}}
@keyframes r88-wave-w{0%,100%{transform:rotate(0deg) translate(0,0)}22%{transform:rotate(-4deg) translate(0,-132px)}34%{transform:rotate(-20deg) translate(0,-132px)}46%{transform:rotate(5deg) translate(0,-132px)}58%{transform:rotate(-16deg) translate(0,-132px)}70%{transform:rotate(2deg) translate(0,-132px)}88%{transform:rotate(1.5deg) translate(0,0)}}
@keyframes r88-wave-a{0%,100%{transform:none}24%,70%{transform:rotate(10deg)}}
@keyframes r88-wave-b{0%,100%{transform:none}24%,70%{transform:rotate(-10deg)}}
@keyframes r88-cock{0%,100%{transform:none}24%,72%{transform:rotate(4deg)}88%{transform:rotate(-1deg)}}
@keyframes r88-ant-cock{0%,100%{transform:none}30%{transform:rotate(-12deg)}46%{transform:rotate(6deg)}62%{transform:rotate(-4deg)}80%{transform:rotate(8deg)}92%{transform:rotate(-2deg)}}
@keyframes r88-bounce{0%,100%{transform:none}14%{transform:translate(0,5px)}32%{transform:translate(0,-3px)}44%{transform:translate(0,3px)}58%{transform:translate(0,-3px)}76%{transform:translate(0,3px)}88%{transform:translate(0,-1px)}}
@keyframes r88-spring{0%,100%{transform:none}14%{transform:scaleY(.9398)}32%{transform:scaleY(1.0361)}44%{transform:scaleY(.9639)}58%{transform:scaleY(1.0361)}76%{transform:scaleY(.9639)}88%{transform:scaleY(1.012)}}
@keyframes r88-creep{0%,100%{transform:none}20%{transform:translate(0,4px)}40%{transform:translate(0,-4px)}60%{transform:translate(0,3px)}80%{transform:translate(0,-1.5px)}}
