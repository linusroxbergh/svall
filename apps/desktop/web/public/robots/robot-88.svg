<svg width="344" height="452" viewBox="84 24 344 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hoop-title hoop-desc" class="r88" data-idle="blink blink shrug wave peek" data-work="cheer cheer wave peek shrug blink"><style>
.r88[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r88-blink .4s ease-in-out}
.r88[data-act=shrug] .arm-l{animation:r88-lift-l 1.5s ease-in-out}
.r88[data-act=shrug] .arm-r{animation:r88-lift-r 1.5s ease-in-out}
.r88[data-act=shrug] .fore-l,.r88[data-act=shrug] .wr-l{animation:r88-out-l 1.5s ease-in-out}
.r88[data-act=shrug] .fore-r,.r88[data-act=shrug] .wr-r{animation:r88-out-r 1.5s ease-in-out}
.r88[data-act=shrug] .pa{animation:r88-open-a 1.5s ease-in-out}
.r88[data-act=shrug] .pb{animation:r88-open-b 1.5s ease-in-out}
.r88[data-act=shrug] .head{animation:r88-duck 1.5s ease-in-out}
.r88[data-act=shrug] .ant{animation:r88-ant-duck 1.5s ease-in-out}
.r88[data-act=peek] .head{animation:r88-look 1.8s ease-in-out}
.r88[data-act=peek] .eyes{animation:r88-down 1.8s ease-in-out}
.r88[data-act=peek] .arm-l{animation:r88-tuck-l 1.8s ease-in-out}
.r88[data-act=peek] .arm-r{animation:r88-tuck-r 1.8s ease-in-out}
.r88[data-act=peek] .fore-l,.r88[data-act=peek] .wr-l{animation:r88-fold-l 1.8s ease-in-out}
.r88[data-act=peek] .fore-r,.r88[data-act=peek] .wr-r{animation:r88-fold-r 1.8s ease-in-out}
.r88[data-act=peek] .pa{animation:r88-tink-a 1.8s ease-in-out}
.r88[data-act=peek] .pb{animation:r88-tink-b 1.8s ease-in-out}
.r88[data-act=peek] .dome{animation:r88-glow 1.8s ease-in-out}
.r88[data-act=wave] .arm-r{animation:r88-raise 2.2s ease-in-out}
.r88[data-act=wave] .fore-r{animation:r88-wave 2.2s ease-in-out}
.r88[data-act=wave] .wr-r{animation:r88-wave-w 2.2s ease-in-out}
.r88[data-act=wave] .arm-r .pa{animation:r88-wave-a 2.2s ease-in-out}
.r88[data-act=wave] .arm-r .pb{animation:r88-wave-b 2.2s ease-in-out}
.r88[data-act=wave] .head{animation:r88-cock 2.2s ease-in-out}
.r88[data-act=wave] .ant{animation:r88-ant-cock 2.2s ease-in-out}
.r88[data-act=cheer] .ub{animation:r88-bounce 2s ease-in-out}
.r88[data-act=cheer] .hoop{animation:r88-spring 2s ease-in-out}
.r88[data-act=cheer] .tread{animation:r88-creep 2s ease-in-out}
.r88[data-act=cheer] .arm-l{animation:r88-pump-l 2s ease-in-out}
.r88[data-act=cheer] .arm-r{animation:r88-pump-r 2s ease-in-out}
.r88[data-act=cheer] .fore-l{animation:r88-up-l 2s ease-in-out}
.r88[data-act=cheer] .wr-l{animation:r88-up-wl 2s ease-in-out}
.r88[data-act=cheer] .fore-r{animation:r88-up-r 2s ease-in-out}
.r88[data-act=cheer] .wr-r{animation:r88-up-wr 2s ease-in-out}
.r88[data-act=cheer] .pa{animation:r88-snap-a 2s ease-in-out}
.r88[data-act=cheer] .pb{animation:r88-snap-b 2s ease-in-out}
.r88[data-act=cheer] .head{animation:r88-bob 2s ease-in-out}
.r88[data-act=cheer] .ant{animation:r88-ant-bob 2s ease-in-out}
/* a forearm swings up toward the viewer as scaleY runs 1 → −1; its wrist ball follows by translateY(66 × (s − 1)) */
/* the upper body sinks d units while the hoop squashes to 1 − d/83, so the neck stays seated on its top */
@keyframes r88-blink{0%,100%{transform:none}40%,55%{transform:scaleY(.1)}}
@keyframes r88-lift-l{0%,100%{transform:none}30%,52%{transform:translate(0,-7px) rotate(-4deg)}74%{transform:translate(0,1.5px) rotate(1deg)}88%{transform:translate(0,-.4px) rotate(-.3deg)}}
