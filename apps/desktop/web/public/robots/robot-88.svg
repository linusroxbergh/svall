@keyframes r88-up-r{0%,100%{transform:rotate(0deg) scaleY(1)}14%{transform:rotate(6deg) scaleY(1)}32%{transform:rotate(16deg) scaleY(-1)}44%{transform:rotate(4deg) scaleY(-.8)}58%{transform:rotate(18deg) scaleY(-1)}76%{transform:rotate(6deg) scaleY(.6)}88%{transform:rotate(-3deg) scaleY(1)}}
@keyframes r88-up-wr{0%,100%{transform:rotate(0deg) translate(0,0)}14%{transform:rotate(6deg) translate(0,0)}32%{transform:rotate(16deg) translate(0,-132px)}44%{transform:rotate(4deg) translate(0,-118.8px)}58%{transform:rotate(18deg) translate(0,-132px)}76%{transform:rotate(6deg) translate(0,-26.4px)}88%{transform:rotate(-3deg) translate(0,0)}}
