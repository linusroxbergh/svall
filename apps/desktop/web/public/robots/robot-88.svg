<svg width="344" height="452" viewBox="84 24 344 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hoop-title hoop-desc">
  <title id="hoop-title">Hoop — ring wheel robot</title>
  <desc id="hoop-desc">A cyan tin toy robot with a short round topped head, two wide pill eyes and an antenna knob, a boxy torso with a yellow half dome window in a cream rim, dark round shoulder caps, arms that arc up and out over slate ball joints to two prong claws, and a neck block down into a two tone arc over a single tall tread wheel on a slate axle.</desc>
