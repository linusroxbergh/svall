@keyframes r88-ant-duck{0%,100%{transform:none}36%{transform:rotate(10deg)}56%{transform:rotate(-6deg)}78%{transform:rotate(3deg)}}
@keyframes r88-look{0%,100%{transform:none}26%,62%{transform:translate(0,3px) rotate(2deg)}80%{transform:translate(0,-1px) rotate(-.6deg)}}
@keyframes r88-down{0%,100%{transform:none}22%,66%{transform:translate(0,3px)}}
@keyframes r88-tuck-l{0%,100%{transform:none}30%,60%{transform:rotate(-5deg)}80%{transform:rotate(.8deg)}}
@keyframes r88-tuck-r{0%,100%{transform:none}30%,60%{transform:rotate(5deg)}80%{transform:rotate(-.8deg)}}
@keyframes r88-fold-l{0%,100%{transform:none}32%,60%{transform:rotate(-22deg)}80%{transform:rotate(3deg)}92%{transform:rotate(-1deg)}}
