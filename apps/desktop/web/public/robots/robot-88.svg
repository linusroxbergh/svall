@keyframes r88-pump-r{0%,100%{transform:none}14%{transform:rotate(5deg)}32%{transform:rotate(-18deg)}44%{transform:rotate(-8deg)}58%{transform:rotate(-20deg)}76%{transform:rotate(-2deg)}88%{transform:rotate(3deg)}}
@keyframes r88-up-l{0%,100%{transform:rotate(0deg) scaleY(1)}14%{transform:rotate(-6deg) scaleY(1)}32%{transform:rotate(-16deg) scaleY(-1)}44%{transform:rotate(-4deg) scaleY(-.8)}58%{transform:rotate(-18deg) scaleY(-1)}76%{transform:rotate(-6deg) scaleY(.6)}88%{transform:rotate(1.5deg) scaleY(1)}}
