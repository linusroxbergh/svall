  <title id="strut-title">Strut — reverse knee walker</title>
  <desc id="strut-desc">An indigo walker with a rounded cockpit hull, a mismatched pair of eyes behind a wide visor, a whip aerial, tiny arms, and backward-bending bird legs on three-toed feet.</desc>
