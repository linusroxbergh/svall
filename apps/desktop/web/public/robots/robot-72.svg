<svg width="264" height="424" viewBox="124 54 264 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="beam-title beam-desc">
  <title id="beam-title">Beam — searchlight robot</title>
  <desc id="beam-desc">A plum robot whose head is a big round searchlight in a slate yoke, with a thick rim, ringed pale glass and two eyes on a band across the lens, a sturdy boxy body with a power lever and vents, ring jointed arms with pincers, and legs with ring knees on flat feet.</desc>
