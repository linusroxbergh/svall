<svg width="280" height="424" viewBox="116 54 280 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="beam-title beam-desc" class="r72" data-idle="blink blink dip dip switch beacon" data-work="snip snip switch switch beacon blink"><style>
.r72[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r72-blink .4s ease-in-out}
.r72[data-act=beacon] .up{animation:r72-lean 2s ease-in-out}
.r72[data-act=beacon] .lens{animation:r72-skyward 2s ease-in-out}
.r72[data-act=beacon] .glass{animation:r72-lit 2s ease-in-out}
.r72[data-act=beacon] .eyes{animation:r72-up 2s ease-in-out}
.r72[data-act=beacon] .arm-r{animation:r72-raise 2s ease-in-out}
.r72[data-act=beacon] .fore-r{animation:r72-point 2s ease-in-out}
.r72[data-act=beacon] .arm-l{animation:r72-ballast 2s ease-in-out}
.r72[data-act=beacon] .fore-l{animation:r72-ballast-fore 2s ease-in-out}
.r72[data-act=dip] .up{animation:r72-sink 1.6s ease-in-out}
.r72[data-act=dip] .lens{animation:r72-down 1.6s ease-in-out}
.r72[data-act=dip] .eyes{animation:r72-down-eyes 1.6s ease-in-out}
.r72[data-act=dip] .fore-l{animation:r72-hang-l 1.6s ease-in-out}
.r72[data-act=dip] .fore-r{animation:r72-hang-r 1.6s ease-in-out}
.r72[data-act=switch] .up{animation:r72-lean-in 1.8s ease-in-out}
.r72[data-act=switch] .arm-l{animation:r72-tuck 1.8s ease-in-out}
.r72[data-act=switch] .fore-l{animation:r72-grab 1.8s ease-in-out}
.r72[data-act=switch] .fore-l .nip-l{animation:r72-jaw-l 1.8s ease-in-out}
.r72[data-act=switch] .fore-l .nip-r{animation:r72-jaw-r 1.8s ease-in-out}
.r72[data-act=switch] .knob{animation:r72-pull 1.8s ease-in-out}
.r72[data-act=switch] .stick{animation:r72-stick 1.8s ease-in-out}
.r72[data-act=switch] .lens{animation:r72-watch 1.8s ease-in-out}
.r72[data-act=switch] .eyes{animation:r72-watch-eyes 1.8s ease-in-out}
.r72[data-act=snip] .arm-l{animation:r72-elbow-l 1.6s ease-in-out}
.r72[data-act=snip] .arm-r{animation:r72-elbow-r 1.6s ease-in-out}
.r72[data-act=snip] .fore-l{animation:r72-fold-l 1.6s ease-in-out}
.r72[data-act=snip] .fore-r{animation:r72-fold-r 1.6s ease-in-out}
.r72[data-act=snip] .nip-l{animation:r72-snap-l 1.6s ease-in-out}
.r72[data-act=snip] .nip-r{animation:r72-snap-r 1.6s ease-in-out}
.r72[data-act=snip] .up{animation:r72-bob 1.6s ease-in-out}
/* the upper body leans over the hips and sinks 41 units x angle so the legs stay under it */
@keyframes r72-blink{0%,100%{transform:none}45%,55%{transform:scaleY(.1)}}
@keyframes r72-lean{0%,100%{transform:none}10%{transform:translate(0,1px)}36%,56%{transform:translate(0,.5px) rotate(-1.2deg)}78%{transform:rotate(.35deg)}90%{transform:rotate(-.1deg)}}
@keyframes r72-skyward{0%,100%{transform:none}10%{transform:translateY(1.7px) scaleY(.97)}36%,58%{transform:translateY(-10px) scaleY(.86)}76%{transform:translateY(2px) scaleY(.98)}90%{transform:translateY(-.5px) scaleY(.995)}}
@keyframes r72-lit{0%,30%,74%,100%{fill:#fff8de}44%,58%{fill:#ffeea0}}
@keyframes r72-up{0%,24%,100%{transform:none}36%,60%{transform:translateY(-2.6px)}78%{transform:none}}
@keyframes r72-raise{0%,100%{transform:none}10%{transform:rotate(5deg)}36%,52%{transform:rotate(-110deg)}58%{transform:rotate(-106deg)}80%{transform:rotate(6deg)}92%{transform:rotate(-2deg)}}
@keyframes r72-point{0%,12%,100%{transform:none}38%,54%{transform:rotate(-70deg)}60%{transform:rotate(-66deg)}84%{transform:rotate(9deg)}94%{transform:rotate(-2.5deg)}}
@keyframes r72-ballast{0%,100%{transform:none}36%,56%{transform:rotate(9deg)}78%{transform:rotate(-3deg)}90%{transform:rotate(1deg)}}
@keyframes r72-ballast-fore{0%,100%{transform:none}40%,58%{transform:rotate(10deg)}82%{transform:rotate(-4deg)}94%{transform:rotate(1.2deg)}}
@keyframes r72-sink{0%,100%{transform:none}30%,56%{transform:translateY(2px)}76%{transform:translateY(-.5px)}}
@keyframes r72-down{0%,100%{transform:none}28%,62%{transform:translateY(7px) scaleY(.91)}80%{transform:translateY(-1.3px) scaleY(.99)}}
@keyframes r72-down-eyes{0%,100%{transform:none}24%,66%{transform:translateY(2.6px)}}
@keyframes r72-hang-l{0%,100%{transform:none}34%{transform:rotate(-6deg)}58%{transform:rotate(4deg)}80%{transform:rotate(-1.5deg)}}
@keyframes r72-hang-r{0%,100%{transform:none}38%{transform:rotate(6deg)}62%{transform:rotate(-4deg)}84%{transform:rotate(1.5deg)}}
@keyframes r72-lean-in{0%,100%{transform:none}30%,64%{transform:translate(0,.7px) rotate(-1deg)}84%{transform:translate(0,.2px) rotate(.3deg)}}
@keyframes r72-tuck{0%,100%{transform:none}6%{transform:rotate(4deg)}30%,38%{transform:rotate(-20deg)}56%,64%{transform:rotate(-12deg)}84%{transform:rotate(3deg)}94%{transform:rotate(-1deg)}}
@keyframes r72-grab{0%,6%,100%{transform:none}30%,38%{transform:rotate(-104deg)}56%,64%{transform:rotate(-90deg)}84%{transform:rotate(8deg)}94%{transform:rotate(-2deg)}}
@keyframes r72-jaw-l{0%,14%,100%{transform:none}26%{transform:rotate(18deg)}34%,64%{transform:rotate(-2deg)}72%{transform:rotate(14deg)}86%{transform:none}}
@keyframes r72-jaw-r{0%,14%,100%{transform:none}26%{transform:rotate(-18deg)}34%,64%{transform:rotate(2deg)}72%{transform:rotate(-14deg)}86%{transform:none}}
@keyframes r72-pull{0%,38%,100%{transform:none}56%,64%{transform:translateY(20px)}76%{transform:translateY(-3px)}86%{transform:translateY(1px)}}
@keyframes r72-stick{0%,38%,100%{transform:none}56%,64%{transform:scaleY(.333)}76%{transform:scaleY(1.1)}86%{transform:scaleY(.97)}}
@keyframes r72-watch{0%,100%{transform:none}28%,66%{transform:translateY(4.3px) scaleY(.95)}84%{transform:none}}
@keyframes r72-watch-eyes{0%,100%{transform:none}24%,68%{transform:translate(-5px,2.6px)}86%{transform:none}}
@keyframes r72-elbow-l{0%,100%{transform:none}26%,72%{transform:rotate(8deg)}88%{transform:rotate(-2deg)}}
@keyframes r72-elbow-r{0%,100%{transform:none}30%,74%{transform:rotate(-8deg)}90%{transform:rotate(2deg)}}
@keyframes r72-fold-l{0%,100%{transform:none}26%,72%{transform:rotate(-70deg)}86%{transform:rotate(6deg)}95%{transform:rotate(-1.5deg)}}
@keyframes r72-fold-r{0%,100%{transform:none}30%,74%{transform:rotate(70deg)}88%{transform:rotate(-6deg)}96%{transform:rotate(1.5deg)}}
@keyframes r72-snap-l{0%,18%,100%{transform:none}30%{transform:rotate(20deg)}40%{transform:rotate(-2deg)}52%{transform:rotate(20deg)}62%,74%{transform:rotate(-2deg)}84%{transform:none}}
@keyframes r72-snap-r{0%,18%,100%{transform:none}30%{transform:rotate(-20deg)}40%{transform:rotate(2deg)}52%{transform:rotate(-20deg)}62%,74%{transform:rotate(2deg)}84%{transform:none}}
@keyframes r72-bob{0%,100%{transform:none}40%{transform:translateY(2px)}50%{transform:translateY(.5px)}62%{transform:translateY(2px)}80%{transform:none}}
</style>
  <title id="beam-title">Beam — searchlight robot</title>
  <desc id="beam-desc">A plum robot whose head is a round searchlight in a slate yoke, with a thick rim, ringed pale glass and two eyes on a band across the lens, a sturdy boxy body with a power lever and vents, ring jointed arms with pincers, and legs with ring knees on flat feet.</desc>
