  <g class="jaw-b" style="transform-origin:404px 214px"><path d="M416.8 184.1l9.2 25.3l-19.6 13.8" fill="none" stroke="#3d4853" stroke-width="9" stroke-linejoin="round"/></g>
  <circle cx="404" cy="214" r="16" fill="#2e7a8a"/>
  </g></g>
  </g></g>
</svg>
