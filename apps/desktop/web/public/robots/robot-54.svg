<svg width="184" height="414" viewBox="164 64 184 414" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="radar-title radar-desc" class="r54" data-idle="blink blink scan rock wave" data-work="scan scan tune tune rock blink"><style>.r54[data-act=blink] .iris{animation:r54-blink .4s ease-in-out}
.r54[data-act=scan] .head{animation:r54-sweep 2s ease-in-out}
.r54[data-act=scan] .lens{animation:r54-seek 2s ease-in-out}
.r54[data-act=scan] .iris{animation:r54-focus 2s ease-in-out}
.r54[data-act=scan] .lamp{animation:r54-lock 2s ease-in-out}
.r54[data-act=scan] .body{animation:r54-lean 2s ease-in-out}
.r54[data-act=scan] .arm-r{animation:r54-counter 2s ease-in-out}
.r54[data-act=scan] .fore-r{animation:r54-counter-lag 2s ease-in-out}
.r54[data-act=scan] .arm-l{animation:r54-hang 2s ease-in-out}
.r54[data-act=rock] .rock-l{animation:r54-tip-l 1.4s}
.r54[data-act=rock] .rock-r{animation:r54-tip-r 1.4s}
.r54[data-act=rock] .arm-l{animation:r54-dangle-l 1.4s ease-in-out}
.r54[data-act=rock] .arm-r{animation:r54-dangle-r 1.4s ease-in-out}
.r54[data-act=rock] .head{animation:r54-lag 1.4s ease-in-out}
.r54[data-act=tune] .arm-r{animation:r54-reach 2s ease-in-out}
.r54[data-act=tune] .fore-r{animation:r54-reach-fore 2s ease-in-out}
.r54[data-act=tune] .head{animation:r54-nudge 2s ease-in-out}
.r54[data-act=tune] .iris{animation:r54-refocus 2s ease-in-out}
.r54[data-act=tune] .body{animation:r54-lean-r 2s ease-in-out}
.r54[data-act=wave] .arm-l{animation:r54-raise 2s ease-in-out}
.r54[data-act=wave] .fore-l{animation:r54-wave 2s ease-in-out}
.r54[data-act=wave] .head{animation:r54-cock 2s ease-in-out}
.r54[data-act=wave] .body{animation:r54-lean-r 2s ease-in-out}
