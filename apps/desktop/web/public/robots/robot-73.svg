  <title id="clerk-title">Clerk — pedestal robot</title>
  <desc id="clerk-desc">A cyan tin-toy robot with a square head, two ringed eyes and an antenna knob, a boxy torso with a chest dial and a row of switches, ring jointed arms with pincers, standing on a single column with a ring joint over a heavy domed base.</desc>
