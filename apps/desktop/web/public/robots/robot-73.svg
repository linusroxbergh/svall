<svg width="236" height="452" viewBox="138 24 236 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clerk-title clerk-desc" class="r73" data-idle="blink blink lean shrug tap" data-work="stamp stamp tap lean blink"><style>
.r73[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r73-blink .4s ease-in-out}
.r73[data-act=lean] .body{animation:r73-lean 1.8s ease-in-out}
