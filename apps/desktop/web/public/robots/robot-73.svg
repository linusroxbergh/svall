.r73[data-act=lean] .ant{animation:r73-ant-lean 1.8s ease-in-out}
.r73[data-act=shrug] .body{animation:r73-lift 1.6s ease-in-out}
.r73[data-act=shrug] .head{animation:r73-sink 1.6s ease-in-out}
.r73[data-act=shrug] .arm-l{animation:r73-shrug-l 1.6s ease-in-out}
.r73[data-act=shrug] .arm-r{animation:r73-shrug-r 1.6s ease-in-out}
.r73[data-act=shrug] .fore-l{animation:r73-open-l 1.6s ease-in-out}
.r73[data-act=shrug] .fore-r{animation:r73-open-r 1.6s ease-in-out}
.r73[data-act=shrug] .ant{animation:r73-ant-shrug 1.6s ease-in-out}
.r73[data-act=tap] .body{animation:r73-bend 2s ease-in-out}
.r73[data-act=tap] .head{animation:r73-look 2s ease-in-out}
