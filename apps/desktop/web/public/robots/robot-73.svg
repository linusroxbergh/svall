.r73[data-act=tap] .fore-l{animation:r73-tap 2s ease-in-out}
.r73[data-act=tap] .needle{animation:r73-jolt 2s ease-in-out}
.r73[data-act=tap] .ant{animation:r73-ant-tap 2s ease-in-out}
.r73[data-act=stamp] .body{animation:r73-dip 2s ease-in-out}
.r73[data-act=stamp] .head{animation:r73-nod 2s ease-in-out}
.r73[data-act=stamp] .arm-r{animation:r73-stamp 2s ease-in-out}
