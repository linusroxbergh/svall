  <title id="welder-title">Welder — welding robot</title>
  <desc id="welder-desc">A safety orange robot with a dome head wearing a single round welding goggle over its one eye on a strap, two gas cylinders with valve caps on its back, a leather apron, a welding torch arm with a small flame fed by a hose and a flat jawed clamp arm, standing on two legs with short tank tread feet.</desc>
