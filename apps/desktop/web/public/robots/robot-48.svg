  <rect x="244" y="358" width="24" height="72" fill="#f0e7ce"/>
  <path d="M214 376h18m-18 12h12" stroke="#9c795c" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g class="arm-l" style="transform-origin:204px 296px"><rect x="186" y="364" width="24" height="32" rx="6" fill="#3d4853"/></g>
  <g class="arm-r" style="transform-origin:308px 296px"><rect x="302" y="364" width="24" height="32" rx="6" fill="#3d4853"/></g>
  <circle cx="204" cy="296" r="16" fill="#3d4853"/>
  <circle cx="308" cy="296" r="16" fill="#3d4853"/>
  <circle cx="204" cy="296" r="7" fill="#92a1b2"/>
  <circle cx="308" cy="296" r="7" fill="#92a1b2"/>
  </g>
  <!-- Downwash -->
  <g class="wash" style="transform-origin:256px 459px"><path d="M206 450h30m40 0h30m-78 18h50" stroke="#92a1b2" stroke-width="6" stroke-linecap="round"/></g>
  <g class="drone" style="transform-origin:256px 200px">
  <!-- Ear lights -->
  <rect x="132" y="176" width="28" height="60" rx="10" fill="#3d4853"/>
  <rect x="352" y="176" width="28" height="60" rx="10" fill="#3d4853"/>
  <circle class="lamp" cx="146" cy="206" r="7" fill="#f6c354"/>
  <circle class="lamp" cx="366" cy="206" r="7" fill="#f6c354"/>
  <!-- Round silver body -->
  <circle cx="256" cy="200" r="104" fill="#d3dbe3"/>
  <path d="M192 118a104 104 0 0 1 132-6 94 94 0 0 0-132 6Z" fill="#eef2f6"/>
  <path d="M312 113a104 104 0 0 1 0 174 118 118 0 0 0 0-174Z" fill="#a7b4c1"/>
  <path d="M157.6 233H354.4A104 104 0 0 1 342.3 258H169.7A104 104 0 0 1 157.6 233Z" fill="#f6c354"/>
  <path d="M332 233h22.4a104 104 0 0 1-12.1 25H318Z" fill="#bc943d"/>
  <path d="M180 270h152" stroke="#a7b4c1" stroke-width="4" stroke-linecap="round"/>
  <g class="face">
  <rect x="180" y="148" width="152" height="64" rx="32" fill="#3d4853"/>
  <g class="eyes">
  <circle cx="226" cy="180" r="15" fill="#79d6eb"/>
  <circle cx="286" cy="180" r="15" fill="#79d6eb"/>
  <path d="M236 168a15 15 0 0 1-12 26 15 15 0 0 0 12-26Zm60 0a15 15 0 0 1-12 26 15 15 0 0 0 12-26Z" fill="#4fb0c5"/>
  <circle cx="231" cy="174" r="5" fill="#fffae0"/>
  <circle cx="291" cy="174" r="5" fill="#fffae0"/>
  </g>
  </g>
