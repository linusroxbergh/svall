<svg width="316" height="452" viewBox="100 24 316 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slots-title slots-desc">
  <title id="slots-title">Slots — slot machine robot</title>
  <desc id="slots-desc">A violet one-armed bandit robot with an arched marquee and a yellow lamp on top, a reel window whose two reel strips each show one eye near the payline, the right reel stopped a notch low, between cut-off symbol tiles, a tapering cabinet body with a yellow diamond panel, a pull lever with a yellow ball knob for a right arm, a ring jointed claw arm on the left, and short legs on flat feet.</desc>
