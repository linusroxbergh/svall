@keyframes r82-shrug-l{0%,100%{transform:none}25%,55%{transform:translate(0,-4px) rotate(6deg)}76%{transform:translate(0,1px) rotate(-2deg)}}
@keyframes r82-palm-l{0%,100%{transform:none}30%,55%{transform:rotate(14deg)}78%{transform:rotate(-4deg)}}
@keyframes r82-shrug-r{0%,100%{transform:none}25%,55%{transform:translate(0,-4px) rotate(-6deg)}76%{transform:translate(0,1px) rotate(2deg)}}
@keyframes r82-palm-r{0%,100%{transform:none}30%,55%{transform:rotate(-14deg)}78%{transform:rotate(4deg)}}
@keyframes r82-reach{0%,100%{transform:none}22%,70%{transform:rotate(-8deg)}86%{transform:rotate(1.5deg)}}
@keyframes r82-tap{0%,100%{transform:none}22%{transform:rotate(68deg)}30%{transform:rotate(75deg)}36%{transform:rotate(68deg)}44%{transform:rotate(75deg)}50%{transform:rotate(68deg)}58%{transform:rotate(75deg)}64%,70%{transform:rotate(68deg)}87%{transform:rotate(-5deg)}}
@keyframes r82-watch{0%,100%{transform:none}18%,72%{transform:translate(3px,3px)}}
@keyframes r82-lean-in{0%,100%{transform:none}24%,70%{transform:rotate(.6deg)}86%{transform:rotate(-.2deg)}}
@keyframes r82-carriage{0%,6%{transform:none}10%,16%{transform:translate(-11px)}20%,26%{transform:translate(-22px)}30%,36%{transform:translate(-33px)}44%{transform:translate(-36px)}55%{transform:translate(10px)}67%{transform:translate(-4px)}79%{transform:translate(1.4px)}90%{transform:translate(-.4px)}100%{transform:none}}
@keyframes r82-flutter{0%,48%,100%{transform:none}57%{transform:rotate(-4deg)}69%{transform:rotate(2.5deg)}81%{transform:rotate(-1deg)}92%{transform:rotate(.3deg)}}
@keyframes r82-pull{0%,32%,100%{transform:none}43%{transform:rotate(26deg)}54%{transform:rotate(-4deg)}66%{transform:rotate(2deg)}80%{transform:rotate(-.6deg)}}
@keyframes r82-pull-lag{0%,34%,100%{transform:none}43%{transform:rotate(-7deg)}52%{transform:rotate(12deg)}64%{transform:rotate(-4deg)}78%{transform:rotate(1.2deg)}}
@keyframes r82-jolt{0%,48%,100%{transform:none}58%{transform:rotate(-4deg)}72%{transform:rotate(2deg)}86%{transform:rotate(-.6deg)}}
@keyframes r82-brace{0%,34%,100%{transform:none}44%{transform:rotate(-1.8deg)}56%{transform:rotate(1.6deg)}70%{transform:rotate(-.6deg)}84%{transform:rotate(.2deg)}}
@keyframes r82-key{0%,100%{fill:#fff8de}35%,65%{fill:#92a1b2}}
</style>
  <title id="typist-title">Typist — typewriter robot</title>
  <desc id="typist-desc">An olive typewriter robot whose head is the carriage: a black platen roller with knobs at each end, a typed sheet of paper rising above it, and two ribbon spools as the eyes. A tall torso carries a nameplate and a bank of round keys with a space bar; the left arm is the long carriage return lever with a flat paddle, the right a jointed claw, on two legs with olive shoes.</desc>
