<svg width="252" height="452" viewBox="122 24 252 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="typist-title typist-desc" class="r82" data-idle="blink blink tilt shrug return" data-work="type type return return tilt"><style>
.r82[data-act=blink] .spool{animation:r82-blink .4s ease-in-out}
.r82[data-act=tilt] .head{animation:r82-tilt 1.6s ease-in-out}
.r82[data-act=tilt] .spool{animation:r82-look 1.6s ease-in-out}
.r82[data-act=tilt] .ub{animation:r82-lean 1.6s ease-in-out}
.r82[data-act=tilt] .lever,.r82[data-act=tilt] .claw{animation:r82-hang 1.6s ease-in-out}
.r82[data-act=shrug] .ub{animation:r82-lift 1.6s ease-in-out}
.r82[data-act=shrug] .head{animation:r82-sink 1.6s ease-in-out}
.r82[data-act=shrug] .lever{animation:r82-shrug-l 1.6s ease-in-out}
.r82[data-act=shrug] .lfore{animation:r82-palm-l 1.6s ease-in-out}
.r82[data-act=shrug] .claw{animation:r82-shrug-r 1.6s ease-in-out}
.r82[data-act=shrug] .cfore{animation:r82-palm-r 1.6s ease-in-out}
.r82[data-act=type] .claw{animation:r82-reach 1.8s ease-in-out}
.r82[data-act=type] .cfore{animation:r82-tap 1.8s ease-in-out}
.r82[data-act=type] .spool{animation:r82-watch 1.8s ease-in-out}
.r82[data-act=type] .ub{animation:r82-lean-in 1.8s ease-in-out}
.r82[data-act=return] .head{animation:r82-carriage 2s ease-in-out}
.r82[data-act=return] .paper{animation:r82-flutter 2s ease-in-out}
.r82[data-act=return] .lever{animation:r82-pull 2s ease-in-out}
.r82[data-act=return] .lfore{animation:r82-pull-lag 2s ease-in-out}
.r82[data-act=return] .claw{animation:r82-jolt 2s ease-in-out}
.r82[data-act=return] .ub{animation:r82-brace 2s ease-in-out}
.r82[data-act=return] .key{animation:r82-key .3s ease-in-out .1s}
.r82[data-act=return] .k2{animation-delay:.3s}
.r82[data-act=return] .k3{animation-delay:.5s}
@keyframes r82-blink{0%,100%{transform:none}40%,60%{transform:scaleY(.1)}}
@keyframes r82-tilt{0%,100%{transform:none}25%,55%{transform:rotate(4.5deg)}78%{transform:rotate(-1deg)}90%{transform:rotate(.3deg)}}
@keyframes r82-look{0%,100%{transform:none}20%,62%{transform:translate(4px,1px)}}
@keyframes r82-lean{0%,100%{transform:none}25%,55%{transform:rotate(.6deg)}80%{transform:rotate(-.25deg)}}
