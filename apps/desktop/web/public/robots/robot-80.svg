<svg width="320" height="450" viewBox="106 26 320 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="register-title register-desc" class="r80" data-idle="blink blink shift snip" data-work="ching ching crank crank snip blink"><style>
.r80[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r80-blink .4s ease-in-out}
.r80[data-act=snip] .arm-l{animation:r80-lift 2s ease-in-out}
.r80[data-act=snip] .fore-l{animation:r80-hang 2s ease-in-out}
.r80[data-act=snip] .claw{animation:r80-snip 2s ease-in-out}
.r80[data-act=snip] .head{animation:r80-peer 2s ease-in-out}
.r80[data-act=snip] .eyes{animation:r80-look-l 2s ease-in-out}
.r80[data-act=snip] .flag{animation:r80-flag-snip 2s ease-in-out}
.r80[data-act=crank] .handle{animation:r80-wind 2s cubic-bezier(.4,0,.3,1)}
.r80[data-act=crank] .fore-r{animation:r80-pump 2s ease-in-out}
.r80[data-act=crank] .arm-r{animation:r80-heave 2s ease-in-out}
.r80[data-act=crank] .up{animation:r80-strain 2s ease-in-out}
.r80[data-act=crank] .head{animation:r80-watch 2s ease-in-out}
.r80[data-act=crank] .eyes{animation:r80-look-r 2s ease-in-out}
.r80[data-act=crank] .flag{animation:r80-flag-crank 2s ease-in-out}
.r80[data-act=shift] .tip-r{animation:r80-onto-r 2.6s ease-in-out}
.r80[data-act=shift] .tip-l{animation:r80-onto-l 2.6s ease-in-out}
.r80[data-act=shift] .up{animation:r80-thud 2.6s ease-in-out}
.r80[data-act=shift] .arm-l,.r80[data-act=shift] .arm-r{animation:r80-dangle 2.6s ease-in-out}
.r80[data-act=shift] .fore-l,.r80[data-act=shift] .fore-r{animation:r80-dangle-fore 2.6s ease-in-out}
.r80[data-act=shift] .flag{animation:r80-flag-shift 2.6s ease-in-out}
.r80[data-act=ching] .handle{animation:r80-turn 2s ease-in-out}
.r80[data-act=ching] .fore-r{animation:r80-yank 2s ease-in-out}
.r80[data-act=ching] .arm-r{animation:r80-brace 2s ease-in-out}
.r80[data-act=ching] .up{animation:r80-squat 2s ease-in-out}
.r80[data-act=ching] .tip-l{animation:r80-jolt 2s ease-in-out}
.r80[data-act=ching] .arm-l{animation:r80-fling 2s ease-in-out}
.r80[data-act=ching] .drawer{animation:r80-drawer 2s ease-in-out}
.r80[data-act=ching] .tab{animation:r80-pop 1s ease-in-out .76s}
.r80[data-act=ching] .stem{animation:r80-pop1 1s ease-in-out .76s}
.r80[data-act=ching] .t2,.r80[data-act=ching] .s2{animation-delay:.81s}
.r80[data-act=ching] .s2{animation-name:r80-pop2}
.r80[data-act=ching] .t3,.r80[data-act=ching] .s3{animation-delay:.86s}
.r80[data-act=ching] .s3{animation-name:r80-pop3}
.r80[data-act=ching] .t4,.r80[data-act=ching] .s4{animation-delay:.91s}
.r80[data-act=ching] .s4{animation-name:r80-pop4}
.r80[data-act=ching] .t5,.r80[data-act=ching] .s5{animation-delay:.96s}
.r80[data-act=ching] .s5{animation-name:r80-pop5}
