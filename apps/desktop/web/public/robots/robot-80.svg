  <title id="register-title">Register — cash register robot</title>
  <desc id="register-desc">A burgundy cash register robot with brass trim, its rounded square eyes in the amount window of its display head under a row of pop-up tab flags, a sloped bank of round keys on its chest, a cash drawer with a brass knob, a jointed pincer arm, a crank handle for its other arm, and short stout legs.</desc>
