<svg width="232" height="420" viewBox="140 58 232 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mic-title mic-desc" class="r68" data-idle="blink blink tune tune bow croon" data-work="croon croon buzz buzz bow blink"><style>
.r68[data-act=croon] .body{animation:r68-sway 2s ease-in-out}
.r68[data-act=croon] .head{animation:r68-lean 2s ease-in-out}
.r68[data-act=croon] .cap{animation:r68-cant 2s ease-in-out}
