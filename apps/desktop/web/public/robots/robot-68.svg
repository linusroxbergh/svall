  <title id="mic-title">Mic — microphone robot</title>
  <desc id="mic-desc">A chrome robot whose head is a vintage capsule microphone, an upright oval slotted grille held in a ring yoke with two eyes on a slate band, a rounded body with an on air lamp, a dial and knobs, ring jointed arms with three finger hands, and legs on round feet.</desc>
