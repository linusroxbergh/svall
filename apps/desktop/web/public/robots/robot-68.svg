<svg width="262" height="420" viewBox="125 58 262 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mic-title mic-desc" class="r68" data-idle="blink blink blink blink tune tune bow croon" data-work="croon croon buzz buzz bow blink blink"><style>
