.r68[data-act=bow] .arm-r{animation:r68-open-r 1.8s ease-in-out}
.r68[data-act=bow] .fore-l{animation:r68-lag-l 1.8s ease-in-out}
.r68[data-act=bow] .fore-r{animation:r68-lag-r 1.8s ease-in-out}
.r68[data-act=buzz] .body{animation:r68-start 1.4s ease-in-out}
.r68[data-act=buzz] .head{animation:r68-jolt 1.4s ease-in-out}
.r68[data-act=buzz] .cap{animation:r68-shiver 1.4s ease-in-out}
.r68[data-act=buzz] .eyes{animation:r68-wince 1.4s ease-in-out}
.r68[data-act=buzz] .arm-l{animation:r68-flinch-l 1.4s ease-in-out}
.r68[data-act=buzz] .arm-r{animation:r68-flinch-r 1.4s ease-in-out}
.r68[data-act=buzz] .needle{animation:r68-peak-needle 1.4s ease-in-out}
.r68[data-act=tune] .body{animation:r68-lean-in 1.8s ease-in-out}
.r68[data-act=tune] .head{animation:r68-peer 1.8s ease-in-out}
.r68[data-act=tune] .cap{animation:r68-cock 1.8s ease-in-out}
.r68[data-act=tune] .eyes{animation:r68-down 1.8s ease-in-out}
.r68[data-act=tune] .fore-r{animation:r68-knob 1.8s ease-in-out}
.r68[data-act=tune] .needle{animation:r68-level 1.8s ease-in-out}
.r68[data-act=blink] .eyes{animation:r68-blink .4s ease-in-out}
