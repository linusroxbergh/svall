  <title id="sputnik-title">Sputnik — satellite robot</title>
  <desc id="sputnik-desc">A cyan robot with a round ball head trailing four long antenna rods, two eyes on a slate band, a barrel body with a chest dial, ring jointed arms with pincers, and short legs on round feet.</desc>
