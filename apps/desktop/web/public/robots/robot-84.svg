@keyframes r84-shrug-r{0%,100%{transform:none}28%,48%{transform:translate(0,-9px) rotate(-4deg)}68%{transform:translate(0,2px) rotate(1.5deg)}84%{transform:translate(0,-.6px) rotate(-.4deg)}}
@keyframes r84-flick-l{0%,12%,100%{transform:none}34%,50%{transform:rotate(5deg)}72%{transform:rotate(-2deg)}88%{transform:rotate(.5deg)}}
@keyframes r84-flick-r{0%,12%,100%{transform:none}34%,50%{transform:rotate(-5deg)}72%{transform:rotate(2deg)}88%{transform:rotate(-.5deg)}}
@keyframes r84-sink{0%,100%{transform:none}28%,48%{transform:translate(0,5px) rotate(-3deg)}68%{transform:translate(0,-1px) rotate(1deg)}84%{transform:translate(0,.4px) rotate(-.3deg)}}
@keyframes r84-crank{0%,100%{transform:none}10%{transform:rotate(-3deg)}26%{transform:rotate(12deg)}36%{transform:rotate(3deg)}52%{transform:rotate(12deg)}62%{transform:rotate(3deg)}78%{transform:rotate(11deg)}90%{transform:rotate(-2deg)}}
@keyframes r84-pull{0%,100%{transform:none}12%{transform:rotate(-1deg)}26%,52%,78%{transform:rotate(2.5deg)}36%,62%{transform:rotate(.6deg)}90%{transform:rotate(-.6deg)}}
@keyframes r84-brace{0%,100%{transform:none}14%{transform:translate(0,4px) rotate(.9deg)}26%,52%,78%{transform:translate(0,4px) rotate(1.6deg)}36%,62%{transform:translate(0,4px) rotate(.9deg)}92%{transform:translate(0,-.5px) rotate(-.3deg)}}
@keyframes r84-watch{0%,100%{transform:none}14%,82%{transform:rotate(-4deg)}92%{transform:rotate(1deg)}}
@keyframes r84-down{0%,100%{transform:none}12%,84%{transform:translate(-6px,3px)}}
</style>
  <title id="fitter-title">Fitter — plumbing robot</title>
  <desc id="fitter-desc">A steel blue robot built from pipe fittings: a square bolted flange for a head with a pipe running through it, two tall oval eyes behind a round sight glass and a capped vent on top, a pipe cross for a torso with flanged ends and a yellow valve handwheel on the chest, pipe arms with elbow joints ending in a pipe wrench jaw and a two finger grip, and pipe legs with union nut knees standing on floor flanges.</desc>
