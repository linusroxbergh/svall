<svg width="332" height="452" viewBox="92 24 332 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fitter-title fitter-desc" class="r84" data-idle="blink blink tilt tilt shift shrug" data-work="ratchet ratchet shift shrug tilt blink"><style>
.r84[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r84-blink .4s ease-in-out}
.r84[data-act=tilt] .head{animation:r84-cock 1.8s ease-in-out}
.r84[data-act=tilt] .eyes{animation:r84-look 1.8s ease-in-out}
.r84[data-act=tilt] .upper{animation:r84-lean 1.8s ease-in-out}
.r84[data-act=tilt] .arm-l,.r84[data-act=tilt] .arm-r{animation:r84-hang 1.8s ease-in-out}
.r84[data-act=shift] .tip-r{animation:r84-tip-r 2s ease-in-out}
.r84[data-act=shift] .tip-l{animation:r84-tip-l 2s ease-in-out}
.r84[data-act=shift] .arm-l,.r84[data-act=shift] .arm-r{animation:r84-counter 2s ease-in-out}
.r84[data-act=shift] .fore-l,.r84[data-act=shift] .fore-r{animation:r84-lag 2s ease-in-out}
.r84[data-act=shift] .head{animation:r84-bob 2s ease-in-out}
.r84[data-act=shrug] .arm-l{animation:r84-shrug-l 1.7s ease-in-out}
.r84[data-act=shrug] .arm-r{animation:r84-shrug-r 1.7s ease-in-out}
.r84[data-act=shrug] .fore-l{animation:r84-flick-l 1.7s ease-in-out}
.r84[data-act=shrug] .fore-r{animation:r84-flick-r 1.7s ease-in-out}
.r84[data-act=shrug] .head{animation:r84-sink 1.7s ease-in-out}
.r84[data-act=ratchet] .fore-l{animation:r84-crank 2.2s ease-in-out}
.r84[data-act=ratchet] .arm-l{animation:r84-pull 2.2s ease-in-out}
.r84[data-act=ratchet] .upper{animation:r84-brace 2.2s ease-in-out}
.r84[data-act=ratchet] .head{animation:r84-watch 2.2s ease-in-out}
.r84[data-act=ratchet] .eyes{animation:r84-down 2.2s ease-in-out}
