<svg width="320" height="356" viewBox="96 122 320 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="brute-title brute-desc" class="r52" data-idle="look look rock shrug" data-work="heave heave flex flex shrug"><style>
