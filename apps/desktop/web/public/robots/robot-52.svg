  <title id="brute-title">Brute — heavy lifting robot</title>
  <desc id="brute-desc">A broad teal lifting robot with a small head sunk between big shoulder housings, a single visor slit, exhaust stacks, a chest grille over a hazard striped waist, long arms ending in heavy three finger claws, and short stout legs.</desc>
  <g class="body" style="transform-origin:256px 340px">
  <!-- Exhaust stacks -->
  <rect class="pipe" style="transform-origin:184px 172px" x="176" y="128" width="16" height="44" fill="#3d4853"/>
  <rect class="pipe" style="transform-origin:328px 172px" x="320" y="128" width="16" height="44" fill="#3d4853"/>
  <rect class="cap" x="172" y="122" width="24" height="10" rx="3" fill="#697785"/>
  <rect class="cap" x="316" y="122" width="24" height="10" rx="3" fill="#697785"/>
  <!-- Long arms with heavy claws -->
  <g class="sh">
  <g class="arm-l" style="transform-origin:156px 206px"><path d="m150 226-18 76" stroke="#697785" stroke-width="28"/></g>
  <g class="arm-r" style="transform-origin:356px 206px"><path d="m362 226 18 76" stroke="#697785" stroke-width="28"/></g>
  </g>
  </g>
  <!-- Stout legs -->
  <path d="m212 340-6 56m94-56 6 56" stroke="#697785" stroke-width="26"/>
