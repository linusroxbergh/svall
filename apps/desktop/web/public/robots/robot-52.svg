.r52[data-act=flex] .fore-l{animation:r52-flex-fore-l 1.6s ease-in-out}
.r52[data-act=flex] .fore-r{animation:r52-flex-fore-r 1.6s ease-in-out}
.r52[data-act=flex] .fl{animation:r52-flex-fl 1.6s ease-in-out}
.r52[data-act=flex] .fr{animation:r52-flex-fr 1.6s ease-in-out}
.r52[data-act=flex] .rc{animation-delay:.15s}
.r52[data-act=shrug] .sh{animation:r52-shrug-sh 1.6s ease-in-out}
.r52[data-act=shrug] .head{animation:r52-shrug-head 1.6s ease-in-out}
.r52[data-act=shrug] .fore-l{animation:r52-shrug-fore-l 1.6s ease-in-out}
.r52[data-act=shrug] .fore-r{animation:r52-shrug-fore-r 1.6s ease-in-out}
