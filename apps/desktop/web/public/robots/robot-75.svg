<svg width="232" height="454" viewBox="140 22 232 454" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stack-title stack-desc" class="r75" data-idle="blink blink dial settle ripple" data-work="claw claw settle ripple dial blink"><style>.r75[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r75-blink .4s ease-in-out}
.r75[data-act=dial] .needle{animation:r75-needle 1.8s ease-in-out}
.r75[data-act=dial] .head{animation:r75-nod 1.8s ease-in-out}
.r75[data-act=dial] .eyes{animation:r75-down 1.8s ease-in-out}
.r75[data-act=claw] .arm-l{animation:r75-raise-l 1.6s ease-in-out}
.r75[data-act=claw] .fore-l{animation:r75-level-l 1.6s ease-in-out}
.r75[data-act=claw] .arm-r{animation:r75-raise-r 1.6s ease-in-out}
.r75[data-act=claw] .fore-r{animation:r75-level-r 1.6s ease-in-out}
.r75[data-act=claw] .jaw{animation:r75-snap 1.6s ease-in-out}
.r75[data-act=settle] .chest{animation:r75-sink 1.5s ease-in-out}
.r75[data-act=settle] .head{animation:r75-sink-head 1.5s ease-in-out}
.r75[data-act=settle] .ant{animation:r75-jolt 1.5s ease-in-out}
.r75[data-act=settle] .arm-l{animation:r75-flap-l 1.5s ease-in-out}
.r75[data-act=settle] .arm-r{animation:r75-flap-r 1.5s ease-in-out}
.r75[data-act=ripple] .chest{animation:r75-chest 2s ease-in-out}
.r75[data-act=ripple] .head{animation:r75-head 2s ease-in-out}
.r75[data-act=ripple] .ant{animation:r75-ant 2s ease-in-out}
.r75[data-act=ripple] .arm-l,.r75[data-act=ripple] .arm-r{animation:r75-hang 2s ease-in-out}
@keyframes r75-blink{0%,100%{transform:none}45%,55%{transform:scaleY(.1)}}
@keyframes r75-needle{0%,100%{transform:none}30%,55%{transform:rotate(-80deg)}78%{transform:rotate(8deg)}}
@keyframes r75-nod{0%,100%{transform:none}20%,70%{transform:translateY(5px) rotate(-4deg)}}
@keyframes r75-down{0%,100%{transform:none}15%,75%{transform:translateY(3px)}}
@keyframes r75-raise-l{0%,100%{transform:none}22%,62%{transform:rotate(24deg)}82%{transform:rotate(-3deg)}}
@keyframes r75-level-l{0%,4%,100%{transform:none}26%,62%{transform:rotate(-21deg)}84%{transform:rotate(3deg)}}
@keyframes r75-raise-r{0%,6%,100%{transform:none}28%,66%{transform:rotate(-24deg)}86%{transform:rotate(3deg)}}
@keyframes r75-level-r{0%,10%,100%{transform:none}32%,66%{transform:rotate(21deg)}90%{transform:rotate(-3deg)}}
@keyframes r75-snap{0%,28%,42%,58%,100%{transform:none}35%,50%{transform:scaleX(1.3)}}
@keyframes r75-sink{0%,100%{transform:none}24%{transform:translateY(5px)}48%{transform:translateY(-1.5px)}70%{transform:translateY(.5px)}}
@keyframes r75-sink-head{0%,100%{transform:none}14%{transform:translateY(-1.5px)}36%{transform:translateY(4px)}60%{transform:translateY(-1.5px)}82%{transform:translateY(.5px)}}
@keyframes r75-jolt{0%,100%{transform:none}30%{transform:rotate(8deg)}52%{transform:rotate(-5deg)}74%{transform:rotate(2deg)}}
@keyframes r75-flap-l{0%,100%{transform:none}28%{transform:rotate(5deg)}54%{transform:rotate(-2.5deg)}78%{transform:rotate(1deg)}}
@keyframes r75-flap-r{0%,100%{transform:none}28%{transform:rotate(-5deg)}54%{transform:rotate(2.5deg)}78%{transform:rotate(-1deg)}}
@keyframes r75-chest{0%,100%{transform:none}18%{transform:rotate(4deg)}42%{transform:rotate(-2.6deg)}64%{transform:rotate(1.2deg)}84%{transform:rotate(-.4deg)}}
@keyframes r75-head{0%,100%{transform:none}13%{transform:rotate(-2.6deg)}34.5%{transform:rotate(5.1deg)}58%{transform:rotate(-3.2deg)}78.5%{transform:rotate(1.45deg)}94%{transform:rotate(-.26deg)}}
@keyframes r75-ant{0%,100%{transform:none}17.5%{transform:rotate(-1.5deg)}41%{transform:rotate(11deg)}63.5%{transform:rotate(-6.5deg)}82.5%{transform:rotate(3deg)}96.5%{transform:rotate(-.8deg)}}
@keyframes r75-hang{0%,100%{transform:none}16%{transform:rotate(-3.45deg)}38%{transform:rotate(4deg)}61%{transform:rotate(-2.5deg)}82.5%{transform:rotate(1.1deg)}}
</style>
  <title id="stack-title">Stack — stacked drum robot</title>
  <desc id="stack-desc">A terracotta tin toy robot built from three stacked drums that widen toward the ground, with two eyes on a slate band and an antenna knob on the head drum, a dial on the chest drum, ring jointed arms with pincers, slate neck rings, and a wide riveted base drum on a slate rim.</desc>
