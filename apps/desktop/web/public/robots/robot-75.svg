    </g>
    <circle cx="354" cy="226" r="10" fill="#3d4853"/>
    <circle cx="354" cy="226" r="4.5" fill="#92a1b2"/>
  </g>
  <rect x="222" y="282" width="68" height="20" fill="#3d4853"/>
  <path d="M222 290h68" stroke="#697785" stroke-width="4"/>
  </g>
