  <!-- Ring jointed arms with pincers -->
  <g class="arm-l" style="transform-origin:192px 196px">
    <path d="M192 196l-34 30" fill="none" stroke="#697785" stroke-width="12"/>
    <g class="fore-l" style="transform-origin:158px 226px">
      <path d="M158 226v40" fill="none" stroke="#697785" stroke-width="12"/>
      <rect x="146" y="262" width="24" height="16" rx="4" fill="#b45a3a"/>
      <g class="jaw" style="transform-origin:159px 280px"><path d="M150 280q-10 16 2 28m16-28q10 16-2 28" fill="none" stroke="#3d4853" stroke-width="7" stroke-linecap="round"/></g>
    </g>
    <circle cx="158" cy="226" r="10" fill="#3d4853"/>
    <circle cx="158" cy="226" r="4.5" fill="#92a1b2"/>
  </g>
  <g class="arm-r" style="transform-origin:320px 196px">
    <path d="M320 196l34 30" fill="none" stroke="#697785" stroke-width="12"/>
    <g class="fore-r" style="transform-origin:354px 226px">
