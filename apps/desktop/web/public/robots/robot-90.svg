<svg width="336" height="452" viewBox="88 24 336 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="belly-title belly-desc" class="r90" data-idle="blink blink peer peer shift draft" data-work="clack clack draft shift peer blink"><style>
.r90[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r90-blink .4s ease-in-out}
.r90[data-act=peer] .belly{animation:r90-lean 1.8s ease-in-out}
.r90[data-act=peer] .head{animation:r90-tilt 1.8s ease-in-out}
.r90[data-act=peer] .eyes{animation:r90-look 1.8s ease-in-out}
.r90[data-act=peer] .pipe{animation:r90-lag 1.8s ease-in-out}
.r90[data-act=shift] .bot{animation:r90-shift 1.8s ease-in-out}
.r90[data-act=shift] .arm-l,.r90[data-act=shift] .arm-r{animation:r90-counter 1.8s ease-in-out}
.r90[data-act=draft] .draft{animation:r90-spin 2s ease-in-out}
.r90[data-act=draft] .vent{animation:r90-glow 2s ease-in-out}
.r90[data-act=draft] .belly{animation:r90-puff 2s ease-in-out}
.r90[data-act=draft] .pipe{animation:r90-chuff 2s ease-in-out}
.r90[data-act=draft] .arm-l{animation:r90-nudge 2s ease-in-out}
.r90[data-act=draft] .head{animation:r90-nod 2s ease-in-out}
.r90[data-act=draft] .eyes{animation:r90-down 2s ease-in-out}
.r90[data-act=clack] .arm-r{animation:r90-lift 1.6s ease-in-out}
.r90[data-act=clack] .jaw-a{animation:r90-jaw-a 1.6s ease-in-out}
.r90[data-act=clack] .jaw-b{animation:r90-jaw-b 1.6s ease-in-out}
.r90[data-act=clack] .arm-l{animation:r90-brace 1.6s ease-in-out}
.r90[data-act=clack] .belly{animation:r90-lean-r 1.6s ease-in-out}
.r90[data-act=clack] .head{animation:r90-cock 1.6s ease-in-out}
.r90[data-act=clack] .eyes{animation:r90-side 1.6s ease-in-out}
/* the whole stove rocks on one foot's outer edge or the other: translate(±110px) moves the pivot there */
@keyframes r90-blink{0%,100%{transform:none}45%,55%{transform:scaleY(.1)}}
@keyframes r90-lean{0%,100%{transform:none}18%,40%{transform:rotate(-1.2deg)}58%,78%{transform:rotate(1deg)}91%{transform:rotate(-.3deg)}}
@keyframes r90-tilt{0%,100%{transform:none}18%,40%{transform:rotate(-3deg)}58%,78%{transform:rotate(2.6deg)}91%{transform:rotate(-.6deg)}}
@keyframes r90-look{0%,100%{transform:none}14%,40%{transform:translate(-6px,1px)}54%,78%{transform:translate(6px,1px)}}
@keyframes r90-lag{0%,100%{transform:none}22%{transform:rotate(4deg)}40%{transform:rotate(-1.5deg)}62%{transform:rotate(-4deg)}80%{transform:rotate(1.5deg)}93%{transform:rotate(-.5deg)}}
@keyframes r90-shift{0%,100%{transform:translate(0) rotate(0) translate(0)}24%{transform:translate(-110px) rotate(-1.4deg) translate(110px)}54%{transform:translate(110px) rotate(1.1deg) translate(-110px)}80%{transform:translate(-110px) rotate(-.4deg) translate(110px)}}
@keyframes r90-counter{0%,100%{transform:none}30%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}85%{transform:rotate(1.2deg)}}
@keyframes r90-spin{0%{transform:none}14%{transform:rotate(-24deg)}70%{transform:rotate(372deg)}83%{transform:rotate(356deg)}92%{transform:rotate(361deg)}100%{transform:rotate(360deg)}}
@keyframes r90-glow{0%,22%,82%,100%{fill:#3d4853}44%,62%{fill:#d39a45}}
@keyframes r90-puff{0%,100%{transform:none}14%{transform:scale(.995,1.01)}40%,56%{transform:scale(1.022,.982)}70%{transform:scale(.992,1.008)}84%{transform:scale(1.004,.997)}}
@keyframes r90-chuff{0%,38%,100%{transform:none}46%{transform:scale(1.04,1.14)}55%{transform:scale(.98,.93)}65%{transform:scale(1.01,1.04)}76%{transform:none}}
@keyframes r90-nudge{0%,100%{transform:none}10%{transform:rotate(-3deg)}26%{transform:rotate(-9deg)}40%{transform:rotate(2deg)}52%{transform:rotate(-1deg)}62%{transform:none}}
@keyframes r90-nod{0%,100%{transform:none}20%,70%{transform:translateY(2px)}}
@keyframes r90-down{0%,100%{transform:none}18%,72%{transform:translateY(4px)}}
@keyframes r90-lift{0%,100%{transform:none}22%{transform:rotate(-13deg)}36%,64%{transform:rotate(-11deg)}80%{transform:rotate(3deg)}92%{transform:rotate(-1deg)}}
@keyframes r90-jaw-a{0%,24%,40%,56%,100%{transform:none}32%,48%{transform:rotate(-12deg)}}
@keyframes r90-jaw-b{0%,24%,40%,56%,100%{transform:none}32%,48%{transform:rotate(12deg)}}
@keyframes r90-brace{0%,100%{transform:none}30%{transform:rotate(3deg)}70%{transform:rotate(-1deg)}}
@keyframes r90-lean-r{0%,100%{transform:none}24%,66%{transform:rotate(1deg)}84%{transform:rotate(-.3deg)}}
@keyframes r90-cock{0%,100%{transform:none}20%,66%{transform:rotate(2.5deg)}84%{transform:rotate(-.5deg)}}
@keyframes r90-side{0%,100%{transform:none}16%,70%{transform:translate(6px,2px)}}
</style>
  <title id="belly-title">Belly — pot-belly stove robot</title>
  <desc id="belly-desc">A chubby jade enamel pot-belly stove robot with two eyes behind the arched mica windows of its feed door, a domed lid and a short flue pipe with a damper on top, a draft wheel on its round belly, stove-pipe arms ending in a poker and a pair of tongs, on splayed cast legs with round feet.</desc>
