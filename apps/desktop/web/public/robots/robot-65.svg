<svg width="236" height="446" viewBox="138 32 236 446" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scope-title scope-desc">
  <title id="scope-title">Scope — television robot</title>
  <desc id="scope-desc">A lavender robot with a rounded television head and rabbit ear antennas, a cyan sine wave on its screen for a face, two knobs, a boxy body with a dial and vent slats, ring jointed arms with three finger hands, rolling on two side by side wheels.</desc>
