<svg width="346" height="420" viewBox="82 56 346 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dial-title dial-desc" class="r92" data-idle="blink blink peer peer shift dial ring" data-work="dial dial ring ring shift blink"><style>
.r92[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r92-blink .4s ease-in-out}
.r92[data-act=peer] .head{animation:r92-tilt 1.8s ease-in-out}
.r92[data-act=peer] .eyes{animation:r92-look 1.8s ease-in-out}
.r92[data-act=peer] .handset{animation:r92-lag 1.8s ease-in-out}
.r92[data-act=shift] .bot{animation:r92-shift 1.8s ease-in-out}
.r92[data-act=shift] .arm-l,.r92[data-act=shift] .arm-r{animation:r92-counter 1.8s ease-in-out}
.r92[data-act=dial] .arm-r{animation:r92-reach 2s ease-in-out}
.r92[data-act=dial] .wheel{animation:r92-wind 2s ease-in-out}
.r92[data-act=dial] .eyes{animation:r92-watch 2s ease-in-out}
.r92[data-act=dial] .head{animation:r92-nod 2s ease-in-out}
.r92[data-act=ring] .handset{animation:r92-hop 2s ease-in-out}
.r92[data-act=ring] .clapper{animation:r92-clap 2s linear}
.r92[data-act=ring] .arm-l{animation:r92-jig 2s ease-in-out}
.r92[data-act=ring] .shell{animation:r92-shimmy 2s ease-in-out}
/* the head rocks on one neck corner or the other: translate(±22px) moves the pivot from the neck's centre to that corner */
@keyframes r92-blink{0%,100%{transform:none}45%,55%{transform:scaleY(.1)}}
@keyframes r92-tilt{0%,100%{transform:translate(0) rotate(0) translate(0)}18%,40%{transform:translate(22px) rotate(4.5deg) translate(-22px)}58%,78%{transform:translate(-22px) rotate(-4deg) translate(22px)}91%{transform:translate(22px) rotate(.8deg) translate(-22px)}}
@keyframes r92-look{0%,100%{transform:none}14%,40%{transform:translate(6px,1px)}54%,78%{transform:translate(-6px,1px)}}
@keyframes r92-lag{0%,100%{transform:none}24%{transform:rotate(-2deg)}46%{transform:rotate(1deg)}64%{transform:rotate(2deg)}84%{transform:rotate(-.8deg)}}
@keyframes r92-shift{0%,100%{transform:translate(0) rotate(0) translate(0)}24%{transform:translate(-76px) rotate(-1.4deg) translate(76px)}54%{transform:translate(76px) rotate(1.1deg) translate(-76px)}80%{transform:translate(-76px) rotate(-.4deg) translate(76px)}}
@keyframes r92-counter{0%,100%{transform:none}30%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}85%{transform:rotate(1.2deg)}}
@keyframes r92-reach{0%,100%{transform:none}10%{transform:rotate(-4deg)}26%,60%{transform:rotate(38deg)}74%{transform:rotate(-5deg)}86%{transform:rotate(2deg)}}
@keyframes r92-wind{0%,28%,100%{transform:none}52%,60%{transform:rotate(150deg)}84%{transform:rotate(-5deg)}92%{transform:rotate(1.5deg)}}
@keyframes r92-watch{0%,100%{transform:none}16%,70%{transform:translate(5px,5px)}}
@keyframes r92-nod{0%,100%{transform:none}20%,68%{transform:translateY(4px)}}
@keyframes r92-hop{0%,32%,52%,72%,100%{transform:none}4%{transform:translateY(-14px) rotate(-4deg)}8%,16%,24%,60%,68%{transform:translateY(0) rotate(0)}12%{transform:translateY(-12px) rotate(3.5deg)}20%{transform:translateY(-13px) rotate(-3deg)}28%{transform:translateY(-8px) rotate(2deg)}56%{transform:translateY(-14px) rotate(4deg)}64%{transform:translateY(-11px) rotate(-3deg)}}
@keyframes r92-clap{0%,34%,52%,72%,100%{transform:none}2%,8%,14%,20%,26%,55%,61%,67%{transform:rotate(24deg)}5%,11%,17%,23%,29%,58%,64%,70%{transform:rotate(-24deg)}}
@keyframes r92-jig{0%,36%,52%,72%,100%{transform:none}6%,22%,58%{transform:rotate(3deg)}14%,66%{transform:rotate(-2.5deg)}30%{transform:rotate(-2deg)}}
@keyframes r92-shimmy{0%,36%,52%,72%,100%{transform:none}4%,16%,56%{transform:rotate(1deg)}10%,22%,62%{transform:rotate(-1deg)}28%,68%{transform:rotate(.6deg)}33%{transform:rotate(-.3deg)}}
</style>
  <title id="dial-title">Dial — rotary telephone robot</title>
  <desc id="dial-desc">A chubby plum robot shaped like a domed desk telephone, with a big rotary dial on its belly, its handset resting in a cradle on top of its head, two eyes in a slate window, coiled cord arms ending in a pair of ringer bells and a dialling finger, on stubby legs and round feet.</desc>
