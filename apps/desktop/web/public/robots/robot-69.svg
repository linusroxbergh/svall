<svg width="272" height="426" viewBox="120 52 272 426" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mainframe-title mainframe-desc" class="r69" data-idle="blink blink peer peer sigh" data-work="compute compute knock knock peer blink"><style>
