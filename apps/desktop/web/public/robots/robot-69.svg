  <title id="mainframe-title">Mainframe — computer cabinet robot</title>
  <desc id="mainframe-desc">A steel blue robot whose body is a tall 1960s computer cabinet with two tape reels behind a window and a panel of yellow and cyan lights, a small square head with two round eyes and a short antenna, ring jointed arms with three finger hands, and short legs on flat feet.</desc>
