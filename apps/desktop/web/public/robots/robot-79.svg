<svg width="276" height="448" viewBox="122 28 276 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="viewer-title viewer-desc">
  <title id="viewer-title">Viewer — stereo viewer robot</title>
  <desc id="viewer-desc">A brown bakelite robot whose head is a stereo slide viewer, its eyes looking out through two round eyepieces, with a slide reel standing upright in the slot on top and an advance lever on its side, a rounded torso with a pocket of spare reels, jointed arms with pincers and jointed legs on flat feet.</desc>
