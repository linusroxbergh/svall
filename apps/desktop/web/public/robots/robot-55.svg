<svg width="326" height="392" viewBox="98 86 326 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bore-title bore-desc" class="r55" data-idle="blink blink scan scan thud" data-work="drill drill drill heft heft thud blink"><style>.r55[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r55-blink .4s ease-in-out}
.r55[data-act=drill] .body{animation:r55-brace 2s ease-in-out}
.r55[data-act=drill] .arm-l{animation:r55-thrust 2s ease-in-out}
.r55[data-act=drill] .fore-l{animation:r55-aim 2s ease-in-out}
.r55[data-act=drill] .grooves{animation:r55-bore 2s ease-in-out}
.r55[data-act=drill] .head{animation:r55-watch 2s ease-in-out}
.r55[data-act=drill] .eyes{animation:r55-watch-eyes 2s ease-in-out}
.r55[data-act=heft] .arm-r{animation:r55-heft 1.7s ease-in-out}
.r55[data-act=heft] .fore-r{animation:r55-heft-fore 1.7s ease-in-out}
.r55[data-act=heft] .claw{animation:r55-twist 1.7s ease-in-out}
.r55[data-act=heft] .head{animation:r55-cock 1.7s ease-in-out}
.r55[data-act=heft] .eyes{animation:r55-peek 1.7s ease-in-out}
.r55[data-act=scan] .head{animation:r55-look 2s ease-in-out}
.r55[data-act=scan] .eyes{animation:r55-glance 2s ease-in-out}
.r55[data-act=scan] .lamp{animation:r55-glow 2s ease-in-out}
.r55[data-act=thud] .body{animation:r55-land 1.6s ease-in-out}
.r55[data-act=thud] .arm-l{animation:r55-flare-l 1.6s ease-in-out}
.r55[data-act=thud] .arm-r{animation:r55-flare-r 1.6s ease-in-out}
.r55[data-act=thud] .head{animation:r55-bob 1.6s ease-in-out}
/* a drill jab moves the arm d units along the bit: translate(-d sin a, d cos a) after the upper arm's rotate, a = the forearm's angle */
@keyframes r55-blink{0%,100%{transform:none}40%,60%{transform:scaleY(.1)}}
@keyframes r55-brace{0%,100%{transform:none}12%{transform:translate(0,.4px) rotate(-.2deg)}24%,62%{transform:translate(0,1px) rotate(-.45deg)}78%{transform:translate(0,-.3px) rotate(.15deg)}90%{transform:none}}
@keyframes r55-thrust{0%,100%{transform:none}12%{transform:rotate(6deg) translate(.8px,-2.9px)}24%{transform:rotate(6deg) translate(-1.9px,8.8px)}32%{transform:rotate(6deg) translate(-.6px,2.9px)}40%{transform:rotate(6deg) translate(-1.5px,6.8px)}48%{transform:rotate(6deg) translate(-.5px,2.4px)}56%{transform:rotate(6deg) translate(-1px,4.9px)}64%{transform:rotate(5deg) translate(-.3px,1.5px)}78%{transform:rotate(-2deg) translate(0,0)}90%{transform:rotate(.8deg) translate(0,0)}}
@keyframes r55-aim{0%,100%{transform:none}12%{transform:rotate(15deg)}24%{transform:rotate(12deg)}32%{transform:rotate(13.5deg)}40%{transform:rotate(11.5deg)}48%{transform:rotate(13deg)}56%{transform:rotate(12deg)}64%{transform:rotate(11deg)}80%{transform:rotate(-3deg)}92%{transform:rotate(1.2deg)}}
@keyframes r55-bore{0%,20%,28%,36%,44%,52%,60%,100%{transform:none}24%,32%,40%{transform:translateY(-5px)}48%{transform:translateY(-4px)}56%{transform:translateY(-3px)}}
@keyframes r55-watch{0%,100%{transform:none}18%,64%{transform:rotate(-2deg)}80%{transform:rotate(.6deg)}}
@keyframes r55-watch-eyes{0%,100%{transform:none}14%,66%{transform:translate(-4px,2px)}}
@keyframes r55-heft{0%,100%{transform:none}12%{transform:rotate(1.2deg)}36%{transform:rotate(-3.5deg)}56%{transform:rotate(-2.7deg)}76%{transform:rotate(1.2deg)}90%{transform:rotate(-.5deg)}}
@keyframes r55-heft-fore{0%,100%{transform:none}16%{transform:rotate(2deg)}40%{transform:rotate(-6.5deg)}58%{transform:rotate(-5deg)}80%{transform:rotate(2deg)}92%{transform:rotate(-.7deg)}}
@keyframes r55-twist{0%,10%,100%{transform:none}26%{transform:rotate(6deg)}46%{transform:rotate(-7deg)}64%{transform:rotate(4.5deg)}80%{transform:rotate(-1.8deg)}92%{transform:rotate(.6deg)}}
@keyframes r55-cock{0%,100%{transform:none}24%,62%{transform:rotate(1.5deg)}82%{transform:rotate(-.5deg)}}
@keyframes r55-peek{0%,100%{transform:none}20%,64%{transform:translate(4px,2px)}}
@keyframes r55-look{0%,100%{transform:none}22%,34%{transform:rotate(-5deg)}56%,68%{transform:rotate(4.5deg)}84%{transform:rotate(-1.1deg)}}
@keyframes r55-glance{0%,100%{transform:none}18%,36%{transform:translateX(-5px)}52%,70%{transform:translateX(5px)}}
@keyframes r55-glow{0%,100%{fill:#f6c354}22%,70%{fill:#fde7a0}}
@keyframes r55-land{0%,100%{transform:none}26%{transform:translate(0,-1px)}36%{transform:translate(0,-1px);animation-timing-function:ease-in}46%{transform:translate(0,1.7px)}62%{transform:translate(0,-.4px)}78%{transform:translate(0,.2px)}90%{transform:none}}
@keyframes r55-flare-l{0%,100%{transform:none}30%{transform:rotate(-.6deg)}50%{transform:rotate(1.6deg)}66%{transform:rotate(-.8deg)}82%{transform:rotate(.4deg)}}
@keyframes r55-flare-r{0%,4%,100%{transform:none}34%{transform:rotate(.6deg)}54%{transform:rotate(-1.6deg)}70%{transform:rotate(.8deg)}86%{transform:rotate(-.4deg)}}
@keyframes r55-bob{0%,40%,100%{transform:none}52%{transform:translate(0,2px)}68%{transform:translate(0,-.6px)}84%{transform:translate(0,.2px)}}</style>
  <title id="bore-title">Bore — mining robot</title>
  <desc id="bore-desc">A stout yellow mining robot with a domed helmet and headlamp over a visored head, one arm ending in a grooved conical drill, the other in a heavy two jaw claw, and sturdy legs on slate boots.</desc>
