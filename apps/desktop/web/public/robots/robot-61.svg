<svg width="296" height="388" viewBox="108 90 296 388" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="spin-title spin-desc" class="r61" data-idle="blink blink shrug shrug door" data-work="churn churn churn roll door blink"><style>
.r61[data-act=churn] .rig{animation:r61-rattle 2.4s ease-in-out}
.r61[data-act=churn] .head{animation:r61-jiggle 2.4s ease-in-out}
.r61[data-act=churn] .arm-l{animation:r61-brace-l 2.4s ease-in-out}
.r61[data-act=churn] .arm-r{animation:r61-brace-r 2.4s ease-in-out}
.r61[data-act=churn] .fore-l{animation:r61-hang-l 2.4s ease-in-out}
.r61[data-act=churn] .fore-r{animation:r61-hang-r 2.4s ease-in-out}
.r61[data-act=churn] .swirl{animation:r61-swirl 2.4s cubic-bezier(.45,0,.3,1)}
.r61[data-act=churn] .water{animation:r61-slosh 2.4s ease-in-out}
.r61[data-act=churn] .diode{animation:r61-glow 2.4s ease-in-out}
.r61[data-act=shrug] .arm-l{animation:r61-shrug-l 1.6s ease-in-out}
.r61[data-act=shrug] .arm-r{animation:r61-shrug-r 1.6s ease-in-out}
.r61[data-act=shrug] .fore-l{animation:r61-flop-l 1.6s ease-in-out}
.r61[data-act=shrug] .fore-r{animation:r61-flop-r 1.6s ease-in-out}
.r61[data-act=shrug] .head{animation:r61-duck 1.6s ease-in-out}
.r61[data-act=door] .door{animation:r61-door 2s ease-in-out}
.r61[data-act=door] .head{animation:r61-peek 2s ease-in-out}
.r61[data-act=door] .eyes{animation:r61-look 2s ease-in-out}
.r61[data-act=door] .rig{animation:r61-jolt 2s ease-in-out}
.r61[data-act=roll] .rig{animation:r61-roll 2s ease-in-out}
.r61[data-act=roll] .head{animation:r61-lag 2s ease-in-out}
.r61[data-act=roll] .arm-l,.r61[data-act=roll] .arm-r{animation:r61-swing 2s ease-in-out}
.r61[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r61-blink .4s ease-in-out}
/* the rig tips on a front wheel: it lifts 72 units x sin(angle) so that wheel stays on the floor */
@keyframes r61-rattle{0%,100%{transform:none}7%{transform:translateY(-.5px) rotate(.4deg)}14%{transform:translateY(-.75px) rotate(-.6deg)}21%{transform:translateY(-1.13px) rotate(.9deg)}28%{transform:translateY(-1.32px) rotate(-1.05deg)}35%{transform:translateY(-1.51px) rotate(1.2deg)}42%{transform:translateY(-1.51px) rotate(-1.2deg)}50%{transform:translateY(-1.32px) rotate(1.05deg)}58%{transform:translateY(-1.13px) rotate(-.9deg)}66%{transform:translateY(-.88px) rotate(.7deg)}75%{transform:translateY(-.57px) rotate(-.45deg)}85%{transform:translateY(-.31px) rotate(.25deg)}}
@keyframes r61-jiggle{0%,100%{transform:none}10.5%{transform:rotate(-.8deg)}17.5%{transform:rotate(1.4deg)}24.5%{transform:rotate(-2deg)}31.5%{transform:rotate(2.4deg)}38.5%{transform:rotate(-2.7deg)}45.5%{transform:rotate(2.7deg)}53.5%{transform:rotate(-2.4deg)}61.5%{transform:rotate(2deg)}69.5%{transform:rotate(-1.5deg)}79%{transform:rotate(1deg)}89%{transform:rotate(-.5deg)}}
@keyframes r61-brace-l{0%,100%{transform:none}14%{transform:rotate(9deg)}21%{transform:rotate(12deg)}28%{transform:rotate(9.5deg)}35%{transform:rotate(12.5deg)}42%{transform:rotate(9.5deg)}50%{transform:rotate(12deg)}58%{transform:rotate(10deg)}68%{transform:rotate(6deg)}80%{transform:rotate(-2deg)}91%{transform:rotate(.8deg)}}
@keyframes r61-brace-r{0%,100%{transform:none}14%{transform:rotate(-9deg)}21%{transform:rotate(-12deg)}28%{transform:rotate(-9.5deg)}35%{transform:rotate(-12.5deg)}42%{transform:rotate(-9.5deg)}50%{transform:rotate(-12deg)}58%{transform:rotate(-10deg)}68%{transform:rotate(-6deg)}80%{transform:rotate(2deg)}91%{transform:rotate(-.8deg)}}
@keyframes r61-hang-l{0%,6%,100%{transform:none}20%{transform:rotate(-7deg)}30%{transform:rotate(-4deg)}40%{transform:rotate(-7deg)}50%{transform:rotate(-4deg)}60%{transform:rotate(-6deg)}72%{transform:rotate(-3deg)}84%{transform:rotate(4deg)}94%{transform:rotate(-1deg)}}
@keyframes r61-hang-r{0%,6%,100%{transform:none}20%{transform:rotate(7deg)}30%{transform:rotate(4deg)}40%{transform:rotate(7deg)}50%{transform:rotate(4deg)}60%{transform:rotate(6deg)}72%{transform:rotate(3deg)}84%{transform:rotate(-4deg)}94%{transform:rotate(1deg)}}
@keyframes r61-swirl{0%{transform:rotate(0)}100%{transform:rotate(1080deg)}}
@keyframes r61-slosh{0%,100%{transform:none}25%,60%{transform:rotate(8deg)}80%{transform:rotate(-3deg)}92%{transform:rotate(1deg)}}
@keyframes r61-glow{0%,100%{fill:#f6c354}15%,80%{fill:#fadb98}}
@keyframes r61-shrug-l{0%,100%{transform:none}28%,52%{transform:rotate(18deg)}72%{transform:rotate(-4deg)}88%{transform:rotate(1.5deg)}}
@keyframes r61-shrug-r{0%,100%{transform:none}28%,52%{transform:rotate(-18deg)}72%{transform:rotate(4deg)}88%{transform:rotate(-1.5deg)}}
@keyframes r61-flop-l{0%,10%,100%{transform:none}34%{transform:rotate(-12deg)}54%{transform:rotate(-8deg)}76%{transform:rotate(9deg)}92%{transform:rotate(-2.5deg)}}
@keyframes r61-flop-r{0%,10%,100%{transform:none}34%{transform:rotate(12deg)}54%{transform:rotate(8deg)}76%{transform:rotate(-9deg)}92%{transform:rotate(2.5deg)}}
@keyframes r61-duck{0%,100%{transform:none}26%,54%{transform:translateY(6px) rotate(-3deg)}74%{transform:translateY(-1.5px) rotate(1deg)}}
@keyframes r61-door{0%,76%,90%,100%{transform:none}30%,60%{transform:scaleX(.78)}83%{transform:scaleX(.96)}}
@keyframes r61-peek{0%,100%{transform:none}28%,64%{transform:rotate(7deg)}82%{transform:rotate(-1.5deg)}}
@keyframes r61-look{0%,100%{transform:none}24%,68%{transform:translate(3px,4px)}}
@keyframes r61-jolt{0%,77%,100%{transform:none}81%{transform:translateY(-.75px) rotate(-.6deg)}87%{transform:translateY(-.5px) rotate(.4deg)}94%{transform:translateY(-.2px) rotate(-.15deg)}}
@keyframes r61-roll{0%,100%{transform:none}12%{transform:translate(1px,0)}42%{transform:translate(-3px,-.63px) rotate(.5deg)}58%{transform:translate(-3px,-.31px) rotate(-.25deg)}84%{transform:translate(.4px,-.31px) rotate(.25deg)}}
@keyframes r61-lag{0%,100%{transform:none}20%{transform:rotate(-1deg)}46%{transform:rotate(2.5deg)}62%{transform:rotate(-2.5deg)}80%{transform:rotate(1.5deg)}92%{transform:rotate(-.6deg)}}
@keyframes r61-swing{0%,100%{transform:none}40%{transform:rotate(-4deg)}62%{transform:rotate(3.5deg)}84%{transform:rotate(-1.5deg)}}
@keyframes r61-blink{0%,100%{transform:none}45%,55%{transform:scaleY(.1)}}
</style>
  <title id="spin-title">Spin — washing machine robot</title>
  <desc id="spin-desc">A powder blue robot whose body is a front loading washer, with a control strip of knobs, a dial and a small display, a big porthole door with a swirl of water behind the glass, a small square head with two round eyes, ring jointed arms with pincers, and four caster wheels.</desc>
