<svg width="340" height="420" viewBox="86 56 340 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vault-title vault-desc" class="r93" data-idle="blink blink peer peer shift listen crack" data-work="listen listen crack crack shift blink"><style>
.r93[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r93-blink .4s ease-in-out}
.r93[data-act=peer] .head{animation:r93-tilt 1.8s ease-in-out}
.r93[data-act=peer] .eyes{animation:r93-look 1.8s ease-in-out}
.r93[data-act=shift] .bot{animation:r93-shift 2s ease-in-out}
.r93[data-act=shift] .arm-l,.r93[data-act=shift] .arm-r{animation:r93-counter 2s ease-in-out}
.r93[data-act=shift] .fore-l,.r93[data-act=shift] .fore-r{animation:r93-counter 2s ease-in-out .12s}
.r93[data-act=listen] .arm-r{animation:r93-reach 2s ease-in-out}
.r93[data-act=listen] .fore-r{animation:r93-bend 2s ease-in-out}
.r93[data-act=listen] .combo{animation:r93-turn 2s ease-in-out}
.r93[data-act=listen] .head{animation:r93-lean 2s ease-in-out}
.r93[data-act=listen] .eyes{animation:r93-down 2s ease-in-out}
.r93[data-act=crack] .wheel{animation:r93-spin 2s ease-in-out}
.r93[data-act=crack] .door{animation:r93-door 2s ease-in-out}
.r93[data-act=crack] .eyes{animation:r93-peek 2s ease-in-out}
.r93[data-act=crack] .head{animation:r93-bob 2s ease-in-out}
/* the head rocks on one neck corner or the other: translate(±34px) moves the pivot from the neck's centre to that corner; the door swings on its hinge edge */
@keyframes r93-blink{0%,100%{transform:none}45%,55%{transform:scaleY(.1)}}
@keyframes r93-tilt{0%,100%{transform:translate(0) rotate(0) translate(0)}18%,40%{transform:translate(34px) rotate(5deg) translate(-34px)}58%,78%{transform:translate(-34px) rotate(-4.5deg) translate(34px)}91%{transform:translate(34px) rotate(.9deg) translate(-34px)}}
@keyframes r93-look{0%,100%{transform:none}14%,40%{transform:translate(3px,.5px)}54%,78%{transform:translate(-3px,.5px)}}
@keyframes r93-shift{0%,100%{transform:translate(0) rotate(0) translate(0)}24%{transform:translate(-88px) rotate(-1deg) translate(88px)}54%{transform:translate(88px) rotate(.8deg) translate(-88px)}80%{transform:translate(-88px) rotate(-.3deg) translate(88px)}}
@keyframes r93-counter{0%,100%{transform:none}30%{transform:rotate(3.5deg)}60%{transform:rotate(-2.5deg)}85%{transform:rotate(1deg)}}
@keyframes r93-reach{0%,100%{transform:none}10%{transform:rotate(-4deg)}28%,70%{transform:rotate(48deg)}82%{transform:rotate(-4deg)}92%{transform:rotate(1.5deg)}}
@keyframes r93-bend{0%,100%{transform:none}12%{transform:rotate(-3deg)}32%,68%{transform:rotate(46deg)}84%{transform:rotate(-5deg)}94%{transform:rotate(1.5deg)}}
@keyframes r93-turn{0%,32%,74%,100%{transform:none}44%{transform:rotate(80deg)}56%{transform:rotate(-40deg)}66%{transform:rotate(30deg)}}
@keyframes r93-lean{0%,100%{transform:translate(0) rotate(0) translate(0)}24%,70%{transform:translate(34px) rotate(5deg) translate(-34px)}86%{transform:translate(34px) rotate(-.8deg) translate(-34px)}}
@keyframes r93-down{0%,100%{transform:none}20%,72%{transform:translate(2px,2px)}}
@keyframes r93-spin{0%,100%{transform:none}26%,76%{transform:rotate(-144deg)}92%{transform:rotate(5deg)}}
@keyframes r93-door{0%,30%,68%,76%,100%{transform:none}44%,60%{transform:scaleX(.78)}72%{transform:scaleX(.97)}}
@keyframes r93-peek{0%,100%{transform:none}40%,62%{transform:translate(3px,1px)}}
@keyframes r93-bob{0%,64%,84%,100%{transform:none}69%{transform:translateY(3px)}76%{transform:translateY(-1px)}}
</style>
  <title id="vault-title">Vault — bank safe robot</title>
  <desc id="vault-desc">A chubby navy teal robot shaped like an old bank safe, its door trimmed with a gold pinstripe and fitted with a combination dial and a spoked wheel handle, two eyes behind brass peep lenses in a short head under a cornice, heavy slate arms ending in a clamp and a stethoscope disc, on stubby legs and block feet.</desc>
