<svg width="272" height="398" viewBox="134 80 272 398" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lumen-title lumen-desc" class="r47" data-idle="blink blink tilt tilt shift peck" data-work="peck peck tap tap tilt blink"><style>.r47[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r47-blink .4s ease-in-out}
.r47[data-act=tilt] .hd{animation:r47-cock 1.6s ease-in-out}
.r47[data-act=tilt] .up{animation:r47-lift 1.6s ease-in-out}
.r47[data-act=tilt] .eyes{animation:r47-look 1.6s ease-in-out}
.r47[data-act=peck] .lo{animation:r47-peck-lo 2s ease-in-out}
.r47[data-act=peck] .up{animation:r47-peck-up 2s ease-in-out}
.r47[data-act=peck] .hd{animation:r47-peck-hd 2s ease-in-out}
.r47[data-act=peck] .spr-lo{animation:r47-spring 2s ease-in-out .06s}
.r47[data-act=peck] .spr-up{animation:r47-spring 2s ease-in-out .12s}
.r47[data-act=peck] .bulb{animation:r47-glow 2s ease-in-out}
.r47[data-act=shift] .all{animation:r47-shift 1.8s ease-in-out}
.r47[data-act=shift] .lo{animation:r47-balance 1.8s ease-in-out}
.r47[data-act=shift] .hd{animation:r47-lag 1.8s ease-in-out}
.r47[data-act=shift] .arm-l{animation:r47-hang-l 1.8s ease-in-out}
.r47[data-act=shift] .arm-r{animation:r47-hang-r 1.8s ease-in-out}
.r47[data-act=tap] .arm-l{animation:r47-tap-l 1.6s ease-in-out}
.r47[data-act=tap] .arm-r{animation:r47-tap-r 1.6s ease-in-out}
.r47[data-act=tap] .up{animation:r47-bob 1.6s ease-in-out}
/* shift rocks on the right sole's outer corner, 68 units from the origin: translate (68(1-cos), -68 sin) */
@keyframes r47-blink{0%,100%{transform:none}45%,55%{transform:scaleY(.1)}}
@keyframes r47-cock{0%,100%{transform:none}24%{transform:rotate(-8deg)}52%{transform:rotate(3.5deg)}76%{transform:rotate(-1.2deg)}}
@keyframes r47-lift{0%,100%{transform:none}22%,40%{transform:rotate(-3deg)}64%{transform:rotate(1deg)}}
@keyframes r47-look{0%,100%{transform:none}18%,40%{transform:translateX(6px)}58%,74%{transform:translateX(-4px)}}
@keyframes r47-peck-lo{0%,100%{transform:none}6%{transform:rotate(1deg)}19%{transform:rotate(-3deg)}31%{transform:rotate(-1deg)}43%{transform:rotate(-4deg)}61%{transform:rotate(2deg)}77%{transform:rotate(-.8deg)}}
@keyframes r47-peck-up{0%,100%{transform:none}8%{transform:rotate(-3deg)}22%{transform:rotate(18deg)}33%{transform:rotate(7deg)}46%{transform:rotate(20deg)}64%{transform:rotate(-7deg)}80%{transform:rotate(3deg)}92%{transform:rotate(-1deg)}}
@keyframes r47-peck-hd{0%,100%{transform:none}10%{transform:rotate(2deg)}25%{transform:rotate(-8deg)}36%{transform:rotate(-3deg)}50%{transform:rotate(-10deg)}68%{transform:rotate(5deg)}84%{transform:rotate(-2deg)}}
@keyframes r47-spring{0%,100%{transform:none}24%{transform:scaleX(.9)}35%{transform:scaleX(.97)}48%{transform:scaleX(.88)}66%{transform:scaleX(1.08)}82%{transform:scaleX(.97)}}
@keyframes r47-glow{0%,100%{fill:#f6c354}40%,58%{fill:#ffdc84}}
@keyframes r47-shift{0%,100%{transform:none}30%,56%{transform:translate(.01px,-1.42px) rotate(1.2deg)}}
@keyframes r47-balance{0%,100%{transform:none}34%,56%{transform:rotate(-2deg)}80%{transform:rotate(1deg)}92%{transform:rotate(-.4deg)}}
@keyframes r47-lag{0%,100%{transform:none}38%{transform:rotate(-5deg)}62%{transform:rotate(-2deg)}84%{transform:rotate(2.5deg)}}
@keyframes r47-hang-l{0%,100%{transform:none}34%{transform:rotate(-6deg)}60%{transform:rotate(-1deg)}82%{transform:rotate(3deg)}}
@keyframes r47-hang-r{0%,100%{transform:none}38%{transform:rotate(-4deg)}64%{transform:rotate(-1deg)}86%{transform:rotate(2deg)}}
@keyframes r47-tap-l{0%,100%{transform:none}14%{transform:rotate(12deg)}28%{transform:none}42%{transform:rotate(10.5deg)}56%{transform:rotate(-1.5deg)}68%{transform:none}}
@keyframes r47-tap-r{0%,8%,100%{transform:none}22%{transform:rotate(-12deg)}36%{transform:none}50%{transform:rotate(-10.5deg)}64%{transform:rotate(1.5deg)}76%{transform:none}}
@keyframes r47-bob{0%,100%{transform:none}30%{transform:rotate(3deg)}58%{transform:rotate(3.5deg)}82%{transform:rotate(-1deg)}}</style>
  <title id="lumen-title">Lumen — desk lamp robot</title>
  <desc id="lumen-desc">A mint robot whose head is a bell lamp shade on a sprung, jointed neck, tilted to one side with a lit bulb, a rocker switch on its chest and short arms with pincers.</desc>
