<svg width="344" height="374" viewBox="84 104 344 374" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bubble-title bubble-desc" class="r46" data-idle="blink blink peer peer shift vent" data-work="vent vent shift shift peer blink"><style>
.r46[data-act=vent] .boiler{animation:r46-swell 2s ease-in-out}
.r46[data-act=vent] .dome{animation:r46-rattle 2s ease-in-out}
.r46[data-act=vent] .needle{animation:r46-needle 2s ease-in-out}
.r46[data-act=vent] .lamp{animation:r46-glow 2s ease-in-out}
.r46[data-act=vent] .arm-l{animation:r46-fling-l 2s ease-in-out}
.r46[data-act=vent] .arm-r{animation:r46-fling-r 2s ease-in-out .1s}
.r46[data-act=vent] .hose-l{animation:r46-spring 2s ease-in-out}
.r46[data-act=vent] .hose-r{animation:r46-spring 2s ease-in-out .1s}
.r46[data-act=vent] .hand-l{animation:r46-hand 2s ease-in-out}
.r46[data-act=vent] .hand-r{animation:r46-hand 2s ease-in-out .1s}
.r46[data-act=shift] .bot{animation:r46-shift 1.8s ease-in-out}
.r46[data-act=shift] .arm-l,.r46[data-act=shift] .arm-r{animation:r46-counter 1.8s ease-in-out}
.r46[data-act=peer] .dome{animation:r46-tilt 1.8s ease-in-out}
.r46[data-act=peer] .eyes{animation:r46-look 1.8s ease-in-out}
.r46[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r46-blink .4s ease-in-out}
/* the dome rocks on one rim corner or the other: translate(±78px) moves the pivot from its centre to that corner */
@keyframes r46-swell{0%,100%{transform:none}14%{transform:scale(1.008,.985)}40%{transform:scale(1.02,.979)}48%{transform:scale(1.026,.975)}58%{transform:scale(.988,1.016)}70%{transform:scale(1.01,.993)}81%{transform:scale(.997,1.003)}}
@keyframes r46-rattle{0%,100%{transform:translate(0) rotate(0) translate(0)}16%{transform:translate(-78px) rotate(2deg) translate(78px)}22%{transform:translate(78px) rotate(-2deg) translate(-78px)}28%{transform:translate(-78px) rotate(2.5deg) translate(78px)}34%{transform:translate(78px) rotate(-2.5deg) translate(-78px)}40%{transform:translate(-78px) rotate(2.5deg) translate(78px)}46%{transform:translate(78px) rotate(-2deg) translate(-78px)}62%{transform:translate(-78px) rotate(2.5deg) translate(78px)}74%{transform:translate(78px) rotate(-1.6deg) translate(-78px)}86%{transform:translate(-78px) rotate(.8deg) translate(78px)}}
@keyframes r46-needle{0%,100%{transform:none}14%{transform:rotate(8deg)}24%{transform:rotate(14deg)}29%{transform:rotate(11deg)}37%{transform:rotate(20deg)}41%{transform:rotate(17deg)}48%{transform:rotate(24deg)}58%{transform:rotate(-50deg)}72%{transform:rotate(10deg)}86%{transform:rotate(-4deg)}}
@keyframes r46-glow{0%,22%,62%,100%{fill:#f6c354}38%,50%{fill:#fbe2ab}}
@keyframes r46-fling-l{0%,48%,100%{transform:none}60%{transform:rotate(7deg)}71%{transform:rotate(-3.5deg)}83%{transform:rotate(1.2deg)}}
@keyframes r46-fling-r{0%,48%,100%{transform:none}60%{transform:rotate(-7deg)}71%{transform:rotate(3.5deg)}83%{transform:rotate(-1.2deg)}}
@keyframes r46-spring{0%,100%{transform:none}40%,48%{transform:scaleY(.94)}60%{transform:scaleY(1.06)}71%{transform:scaleY(.96)}83%{transform:scaleY(1.02)}}
@keyframes r46-hand{0%,100%{transform:none}40%,48%{transform:translateY(-5.4px)}60%{transform:translateY(5.4px)}71%{transform:translateY(-3.6px)}83%{transform:translateY(1.8px)}}
@keyframes r46-shift{0%,100%{transform:translate(0) rotate(0) translate(0)}24%{transform:translate(-80px) rotate(-1.2deg) translate(80px)}54%{transform:translate(80px) rotate(.9deg) translate(-80px)}80%{transform:translate(-80px) rotate(-.35deg) translate(80px)}}
@keyframes r46-counter{0%,100%{transform:none}30%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}85%{transform:rotate(1.2deg)}}
@keyframes r46-tilt{0%,100%{transform:translate(0) rotate(0) translate(0)}18%,40%{transform:translate(78px) rotate(-4.5deg) translate(-78px)}58%,78%{transform:translate(-78px) rotate(4deg) translate(78px)}91%{transform:translate(78px) rotate(-.8deg) translate(-78px)}}
@keyframes r46-look{0%,100%{transform:none}14%,40%{transform:translate(-9px,1px)}54%,78%{transform:translate(9px,1px)}}
@keyframes r46-blink{0%,100%{transform:none}45%,55%{transform:scaleY(.1)}}
</style>
  <title id="bubble-title">Bubble — glass dome robot</title>
  <desc id="bubble-desc">A squat terracotta robot with a little face inside a glass dome, a gauge on its chest, ribbed hose arms with pincers and stubby legs on round feet.</desc>
