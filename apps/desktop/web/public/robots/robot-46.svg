  </g>
  <circle cx="352" cy="244" r="22" fill="#3d4853"/>
  <circle cx="352" cy="244" r="10" fill="#92a1b2"/>
  </g>
  <!-- Stubby legs and round feet -->
  <rect x="196" y="364" width="40" height="76" fill="#3d4853"/>
  <rect x="276" y="364" width="40" height="76" fill="#3d4853"/>
  <path d="M196 392h40v12h-40Zm80 0h40v12h-40Z" fill="#697785"/>
