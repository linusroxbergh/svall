<svg width="324" height="452" viewBox="94 24 324 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bellows-title bellows-desc" class="r76" data-idle="blink blink tilt dial squeeze" data-work="squeeze squeeze teeter teeter dial blink"><style>
.r76[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r76-blink .4s ease-in-out}
.r76[data-act=tilt] .body{animation:r76-lean 1.4s ease-in-out}
.r76[data-act=tilt] .head{animation:r76-tilt 1.4s ease-in-out}
.r76[data-act=tilt] .ant{animation:r76-ant 1.4s ease-in-out}
.r76[data-act=tilt] .eyes{animation:r76-glance 1.4s ease-in-out}
.r76[data-act=dial] .needle{animation:r76-needle 1.6s ease-in-out}
.r76[data-act=dial] .body{animation:r76-sink 1.6s ease-in-out}
.r76[data-act=dial] .head{animation:r76-nod 1.6s ease-in-out}
.r76[data-act=dial] .eyes{animation:r76-down 1.6s ease-in-out}
.r76[data-act=teeter] .all{animation:r76-teeter 1.8s ease-in-out}
.r76[data-act=teeter] .arm-l{animation:r76-lag-l 1.8s ease-in-out}
.r76[data-act=teeter] .arm-r{animation:r76-lag-r 1.8s ease-in-out}
.r76[data-act=teeter] .tread{animation:r76-tread 1.8s ease-in-out}
.r76[data-act=squeeze] .body{animation:r76-bob 2s ease-in-out}
.r76[data-act=squeeze] .arm-l{animation:r76-hug-l 2s ease-in-out}
.r76[data-act=squeeze] .arm-r{animation:r76-hug-r 2s ease-in-out}
.r76[data-act=squeeze] .pl-l{animation:r76-curl-l 2s ease-in-out}
.r76[data-act=squeeze] .pl-r{animation:r76-curl-r 2s ease-in-out}
.r76[data-act=squeeze] .needle{animation:r76-gauge 2s ease-in-out}
@keyframes r76-blink{0%,100%{transform:none}45%,55%{transform:scaleY(.1)}}
@keyframes r76-lean{0%,100%{transform:none}18%,56%{transform:rotate(-1.5deg)}80%{transform:rotate(.5deg)}}
@keyframes r76-tilt{0%,100%{transform:none}22%,52%{transform:rotate(-5deg)}78%{transform:rotate(1.2deg)}}
