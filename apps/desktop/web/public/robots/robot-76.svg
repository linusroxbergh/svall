  <title id="bellows-title">Bellows — accordion arm robot</title>
  <desc id="bellows-desc">A sage tin toy robot with a square head, two eyes on a slate band and an antenna knob, a boxy torso with a chest dial, two lights and a vent, pleated accordion bellows arms curving out from the shoulders to round slate mitten hands, rolling on a single tread wheel held in a two tone fork.</desc>
