@keyframes r76-hug-l{0%,100%{transform:none}12%{transform:translate(.5px) rotate(2deg)}42%,52%{transform:rotate(-3deg)}70%{transform:translate(.5px) rotate(2deg)}86%{transform:rotate(-.6deg)}}
