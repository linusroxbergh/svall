  <title id="cycle-title">Cycle — single wheel robot</title>
  <desc id="cycle-desc">A mustard tin-toy robot riding one big spoked wheel, with a rounded head, two eyes on a slate band and an antenna knob, a torso with a chest dial, ring jointed arms with three finger hands held out for balance, and a slate fork down to the wheel hub.</desc>
