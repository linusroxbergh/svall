<svg width="284" height="452" viewBox="114 24 284 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cycle-title cycle-desc" class="r74" data-idle="blink blink blink blink wobble wobble dial" data-work="roll roll spin dial wobble blink blink"><style>
.r74[data-act=roll] .wheel{animation:r74-roll 1.8s ease-in-out}
.r74[data-act=roll] .body{animation:r74-rock 1.8s ease-in-out}
.r74[data-act=roll] .arm-l,.r74[data-act=roll] .arm-r{animation:r74-counter 1.8s ease-in-out}
.r74[data-act=spin] .wheel{animation:r74-spin 1.6s ease-in-out}
.r74[data-act=spin] .body{animation:r74-brace 1.6s ease-in-out}
.r74[data-act=spin] .arm-l{animation:r74-fling-l 1.6s ease-in-out}
.r74[data-act=spin] .arm-r{animation:r74-fling-r 1.6s ease-in-out}
.r74[data-act=wobble] .head{animation:r74-tilt 1.4s ease-in-out}
.r74[data-act=wobble] .ant{animation:r74-ant 1.4s ease-in-out}
.r74[data-act=dial] .needle{animation:r74-needle 1.6s ease-in-out}
.r74[data-act=dial] .head{animation:r74-nod 1.6s ease-in-out}
.r74[data-act=dial] .eyes{animation:r74-down 1.6s ease-in-out}
.r74[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r74-blink .4s ease-in-out}
@keyframes r74-roll{0%,100%{transform:none}35%{transform:rotate(40deg)}70%{transform:rotate(-12deg)}}
@keyframes r74-rock{0%,100%{transform:none}25%{transform:rotate(3deg)}55%{transform:rotate(-2deg)}80%{transform:rotate(.8deg)}}
@keyframes r74-counter{0%,100%{transform:none}30%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}85%{transform:rotate(-1.5deg)}}
@keyframes r74-spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes r74-brace{0%,100%{transform:none}30%{transform:rotate(-3deg)}68%{transform:rotate(2.5deg)}86%{transform:rotate(-.8deg)}}
@keyframes r74-fling-l{0%,100%{transform:none}30%,58%{transform:rotate(8deg)}82%{transform:rotate(-2deg)}}
@keyframes r74-fling-r{0%,100%{transform:none}30%,58%{transform:rotate(-8deg)}82%{transform:rotate(2deg)}}
@keyframes r74-tilt{0%,100%{transform:none}22%,52%{transform:rotate(-5.5deg)}78%{transform:rotate(1.5deg)}}
@keyframes r74-ant{0%,100%{transform:none}28%{transform:rotate(20deg)}46%{transform:rotate(-8deg)}68%{transform:rotate(-14deg)}86%{transform:rotate(5deg)}}
@keyframes r74-needle{0%,100%{transform:none}30%,55%{transform:rotate(-60deg)}75%{transform:rotate(8deg)}}
@keyframes r74-nod{0%,100%{transform:none}20%,70%{transform:translateY(4px)}}
@keyframes r74-down{0%,100%{transform:none}15%,75%{transform:translateY(3px)}}
@keyframes r74-blink{0%,100%{transform:none}45%,55%{transform:scaleY(.1)}}
</style>
  <title id="cycle-title">Cycle — single wheel robot</title>
  <desc id="cycle-desc">A mustard tin-toy robot riding one big spoked wheel, with a rounded head, two eyes on a slate band and an antenna knob, a torso with a chest dial, ring jointed arms with three finger hands held out for balance, and a slate fork down to the wheel hub.</desc>
