    </g>
    <circle cx="138" cy="280" r="13" fill="#3d4853"/>
    <circle cx="138" cy="280" r="6" fill="#92a1b2"/>
    <circle cx="176" cy="232" r="18" fill="#3d4853"/>
    <circle cx="176" cy="232" r="8" fill="#92a1b2"/>
  </g>
  <g class="arm-r" style="transform-origin:336px 232px">
