<svg width="280" height="422" viewBox="116 56 280 422" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="meter-title meter-desc" class="r62" data-idle="tilt tilt shrug bob" data-work="bob bob peak shrug tilt"><style>
.r62[data-act=tilt] .head{animation:r62-tilt 1.8s ease-in-out}
.r62[data-act=tilt] .vu{animation:r62-glance 1.8s ease-in-out}
.r62[data-act=tilt] .ant{animation:r62-ant 1.8s ease-in-out}
.r62[data-act=shrug] .arm-l{animation:r62-shrug-l 1.6s ease-in-out}
.r62[data-act=shrug] .arm-r{animation:r62-shrug-r 1.6s ease-in-out}
.r62[data-act=shrug] .fore-l{animation:r62-palm-l 1.6s ease-in-out}
.r62[data-act=shrug] .fore-r{animation:r62-palm-r 1.6s ease-in-out}
.r62[data-act=shrug] .head{animation:r62-sink 1.6s ease-in-out}
.r62[data-act=shrug] .vu{animation:r62-zero 1.6s ease-in-out}
.r62[data-act=bob] .bot{animation:r62-dip 1.6s ease-in-out}
.r62[data-act=bob] .head{animation:r62-bop 1.6s ease-in-out}
.r62[data-act=bob] .vu{animation:r62-kick 1.6s ease-in-out}
.r62[data-act=bob] .arm-l{animation:r62-bounce-l 1.6s ease-in-out}
.r62[data-act=bob] .arm-r{animation:r62-bounce-r 1.6s ease-in-out}
.r62[data-act=peak] .vu{animation:r62-slam 1.8s ease-in-out}
.r62[data-act=peak] .pop{animation:r62-pop 1.8s ease-in-out}
.r62[data-act=peak] .neck{animation:r62-neck 1.8s ease-in-out}
.r62[data-act=peak] .ant{animation:r62-whip 1.8s ease-in-out}
.r62[data-act=peak] .arm-l{animation:r62-jerk-l 1.8s ease-in-out}
.r62[data-act=peak] .arm-r{animation:r62-jerk-r 1.8s ease-in-out}
.r62[data-act=peak] .fore-l{animation:r62-flinch-l 1.8s ease-in-out}
.r62[data-act=peak] .fore-r{animation:r62-flinch-r 1.8s ease-in-out}
/* the neck stretches by (20 + pop) / 20 so the popped head stays on it */
@keyframes r62-tilt{0%,100%{transform:none}28%,52%{transform:rotate(7deg)}74%{transform:rotate(-2deg)}88%{transform:rotate(.6deg)}}
@keyframes r62-glance{0%,100%{transform:none}22%,56%{transform:rotate(28deg)}76%{transform:rotate(-6deg)}90%{transform:rotate(2deg)}}
@keyframes r62-ant{0%,100%{transform:none}34%{transform:rotate(-9deg)}56%{transform:rotate(5deg)}76%{transform:rotate(-3deg)}90%{transform:rotate(1deg)}}
@keyframes r62-shrug-l{0%,100%{transform:none}30%,56%{transform:translateY(-9px) rotate(-5deg)}76%{transform:translateY(1.5px) rotate(1deg)}90%{transform:translateY(-.5px) rotate(0deg)}}
@keyframes r62-shrug-r{0%,100%{transform:none}30%,56%{transform:translateY(-9px) rotate(5deg)}76%{transform:translateY(1.5px) rotate(-1deg)}90%{transform:translateY(-.5px) rotate(0deg)}}
@keyframes r62-palm-l{0%,100%{transform:none}34%,56%{transform:rotate(12deg)}78%{transform:rotate(-3deg)}92%{transform:rotate(1deg)}}
@keyframes r62-palm-r{0%,100%{transform:none}34%,56%{transform:rotate(-12deg)}78%{transform:rotate(3deg)}92%{transform:rotate(-1deg)}}
@keyframes r62-sink{0%,100%{transform:none}30%,56%{transform:translateY(3px) rotate(-4deg)}78%{transform:translateY(-.8px) rotate(1deg)}}
@keyframes r62-zero{0%,100%{transform:none}30%,58%{transform:rotate(-30deg)}78%{transform:rotate(5deg)}90%{transform:rotate(-1.5deg)}}
@keyframes r62-dip{0%,34%,68%,100%{transform:none}17%,51%{transform:translateY(3.5px)}84%{transform:translateY(1px)}}
@keyframes r62-bop{0%,100%{transform:none}20%{transform:rotate(3deg)}37%{transform:rotate(0deg)}54%{transform:rotate(-3deg)}71%{transform:rotate(0deg)}86%{transform:rotate(1deg)}}
@keyframes r62-kick{0%,100%{transform:none}12%{transform:rotate(40deg)}30%{transform:rotate(4deg)}46%{transform:rotate(46deg)}64%{transform:rotate(4deg)}80%{transform:rotate(14deg)}}
@keyframes r62-bounce-l{0%,34%,68%,100%{transform:none}20%,54%{transform:rotate(5deg)}84%{transform:rotate(1.5deg)}}
@keyframes r62-bounce-r{0%,34%,68%,100%{transform:none}20%,54%{transform:rotate(-5deg)}84%{transform:rotate(-1.5deg)}}
@keyframes r62-slam{0%,100%{transform:none}6%{transform:rotate(-4deg)}14%{transform:rotate(64deg)}20%{transform:rotate(57deg)}26%,40%{transform:rotate(64deg)}64%{transform:rotate(-6deg)}80%{transform:rotate(2deg)}}
@keyframes r62-pop{0%,100%{transform:none}6%{transform:translateY(1px)}14%,22%{transform:translateY(-8px)}40%{transform:translateY(2px)}56%{transform:translateY(-1px)}72%{transform:translateY(.4px)}}
@keyframes r62-neck{0%,100%{transform:none}6%{transform:scaleY(.95)}14%,22%{transform:scaleY(1.4)}40%{transform:scaleY(.9)}56%{transform:scaleY(1.05)}72%{transform:scaleY(.98)}}
@keyframes r62-whip{0%,12%,100%{transform:none}22%{transform:rotate(12deg)}38%{transform:rotate(-8deg)}54%{transform:rotate(4deg)}70%{transform:rotate(-1.5deg)}}
@keyframes r62-jerk-l{0%,100%{transform:none}6%{transform:translateY(1px) rotate(-2deg)}14%{transform:translateY(-6px) rotate(22deg)}24%{transform:translateY(-5px) rotate(19deg)}44%{transform:translateY(1px) rotate(-4deg)}60%{transform:translateY(0) rotate(2deg)}76%{transform:translateY(0) rotate(-.8deg)}}
@keyframes r62-jerk-r{0%,100%{transform:none}6%{transform:translateY(1px) rotate(2deg)}14%{transform:translateY(-6px) rotate(-22deg)}24%{transform:translateY(-5px) rotate(-19deg)}44%{transform:translateY(1px) rotate(4deg)}60%{transform:translateY(0) rotate(-2deg)}76%{transform:translateY(0) rotate(.8deg)}}
@keyframes r62-flinch-l{0%,100%{transform:none}6%{transform:rotate(2deg)}16%{transform:rotate(-40deg)}26%{transform:rotate(-44deg)}48%{transform:rotate(8deg)}64%{transform:rotate(-4deg)}82%{transform:rotate(1.5deg)}}
@keyframes r62-flinch-r{0%,100%{transform:none}6%{transform:rotate(-2deg)}16%{transform:rotate(40deg)}26%{transform:rotate(44deg)}48%{transform:rotate(-8deg)}64%{transform:rotate(4deg)}82%{transform:rotate(-1.5deg)}}
</style>
  <title id="meter-title">Meter — gauge robot</title>
  <desc id="meter-desc">A sage boxy robot whose eyes are two analogue VU meters with matching needles, with ear knobs, a row of dials and a toggle switch on its chest, ring jointed arms with three finger hands, and legs with ring knees on flat feet.</desc>
