<svg width="340" height="452" viewBox="86 24 340 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hydrant-title hydrant-desc" class="r91" data-idle="blink blink blink blink peer peer shift flush" data-work="spray spray flush shift peer blink blink"><style>
.r91[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r91-blink .4s ease-in-out}
.r91[data-act=peer] .barrel{animation:r91-lean 1.8s ease-in-out}
.r91[data-act=peer] .bonnet{animation:r91-tilt 1.8s ease-in-out}
.r91[data-act=peer] .eyes{animation:r91-look 1.8s ease-in-out}
.r91[data-act=shift] .bot{animation:r91-shift 1.8s ease-in-out}
.r91[data-act=shift] .arm-l,.r91[data-act=shift] .arm-r{animation:r91-counter 1.8s ease-in-out}
.r91[data-act=flush] .nut{animation:r91-spin 1.9s ease-in-out}
.r91[data-act=flush] .barrel{animation:r91-surge 1.9s ease-in-out}
.r91[data-act=flush] .bonnet{animation:r91-clatter 1.9s ease-in-out}
.r91[data-act=flush] .eyes{animation:r91-up 1.9s ease-in-out}
.r91[data-act=flush] .arm-l{animation:r91-jolt-l 1.9s ease-in-out}
.r91[data-act=flush] .arm-r{animation:r91-jolt-r 1.9s ease-in-out .1s}
.r91[data-act=flush] .fore-l{animation:r91-flop-l 1.9s ease-in-out .08s}
.r91[data-act=flush] .fore-r{animation:r91-flop-r 1.9s ease-in-out .15s}
.r91[data-act=spray] .arm-r{animation:r91-raise 1.8s ease-in-out}
.r91[data-act=spray] .fore-r{animation:r91-aim 1.8s ease-in-out}
.r91[data-act=spray] .arm-l{animation:r91-brace 1.8s ease-in-out}
.r91[data-act=spray] .barrel{animation:r91-recoil 1.8s ease-in-out}
.r91[data-act=spray] .eyes{animation:r91-watch 1.8s ease-in-out}
/* the bonnet tips on one flange corner or the other and the hydrant rocks on one foot's outer edge: translate(±Npx) moves each pivot there */
@keyframes r91-blink{0%,100%{transform:none}45%,55%{transform:scaleY(.1)}}
@keyframes r91-lean{0%,100%{transform:none}18%,40%{transform:rotate(-1deg)}58%,78%{transform:rotate(.8deg)}91%{transform:rotate(-.2deg)}}
@keyframes r91-tilt{0%,100%{transform:translate(0) rotate(0) translate(0)}18%,40%{transform:translate(-96px) rotate(-3deg) translate(96px)}58%,78%{transform:translate(96px) rotate(2.6deg) translate(-96px)}91%{transform:translate(-96px) rotate(-.6deg) translate(96px)}}
@keyframes r91-look{0%,100%{transform:none}14%,40%{transform:translate(-7px,1px)}54%,78%{transform:translate(7px,1px)}}
@keyframes r91-shift{0%,100%{transform:translate(0) rotate(0) translate(0)}24%{transform:translate(-80px) rotate(-1.3deg) translate(80px)}54%{transform:translate(80px) rotate(1deg) translate(-80px)}80%{transform:translate(-80px) rotate(-.35deg) translate(80px)}}
@keyframes r91-counter{0%,100%{transform:none}30%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}85%{transform:rotate(1.2deg)}}
@keyframes r91-spin{0%{transform:none}12%{transform:rotate(-20deg)}62%{transform:rotate(380deg)}76%{transform:rotate(354deg)}88%{transform:rotate(362deg)}100%{transform:rotate(360deg)}}
@keyframes r91-surge{0%,100%{transform:none}18%{transform:rotate(0deg) scale(1.012,.99)}28%{transform:rotate(.9deg) scale(1.02,.982)}34%{transform:rotate(-.9deg) scale(1.02,.982)}40%{transform:rotate(.8deg) scale(1.022,.98)}46%{transform:rotate(-.7deg) scale(1.02,.982)}54%{transform:rotate(.4deg) scale(1.01,.99)}66%{transform:rotate(-.2deg) scale(.995,1.006)}80%{transform:rotate(0deg) scale(1.003,.998)}}
@keyframes r91-clatter{0%,24%,34%,46%,100%{transform:none}29%{transform:translateY(-6px)}40%{transform:translateY(-4px)}}
@keyframes r91-up{0%,100%{transform:none}12%,62%{transform:translateY(-3px)}}
@keyframes r91-jolt-l{0%,24%,100%{transform:none}32%{transform:rotate(8deg)}44%{transform:rotate(-4deg)}56%{transform:rotate(1.5deg)}66%{transform:none}}
@keyframes r91-jolt-r{0%,24%,100%{transform:none}32%{transform:rotate(-8deg)}44%{transform:rotate(4deg)}56%{transform:rotate(-1.5deg)}66%{transform:none}}
@keyframes r91-flop-l{0%,24%,100%{transform:none}34%{transform:rotate(-6deg)}46%{transform:rotate(5deg)}58%{transform:rotate(-2deg)}70%{transform:none}}
@keyframes r91-flop-r{0%,24%,100%{transform:none}34%{transform:rotate(6deg)}46%{transform:rotate(-5deg)}58%{transform:rotate(2deg)}70%{transform:none}}
@keyframes r91-raise{0%,100%{transform:none}20%{transform:rotate(-7deg)}30%,64%{transform:rotate(-9deg)}80%{transform:rotate(2deg)}92%{transform:rotate(-.5deg)}}
@keyframes r91-aim{0%,100%{transform:none}22%{transform:rotate(30deg)}30%{transform:rotate(40deg)}36%{transform:rotate(36deg)}42%{transform:rotate(40deg)}48%{transform:rotate(36deg)}54%{transform:rotate(40deg)}62%{transform:rotate(38deg)}80%{transform:rotate(-4deg)}92%{transform:rotate(1deg)}}
@keyframes r91-brace{0%,100%{transform:none}28%{transform:rotate(3deg)}64%{transform:rotate(2deg)}84%{transform:rotate(-1deg)}}
@keyframes r91-recoil{0%,100%{transform:none}30%{transform:rotate(-.9deg)}36%{transform:rotate(-.5deg)}42%{transform:rotate(-.9deg)}48%{transform:rotate(-.5deg)}54%{transform:rotate(-.9deg)}66%{transform:rotate(-.6deg)}82%{transform:rotate(.3deg)}}
@keyframes r91-watch{0%,100%{transform:none}16%,70%{transform:translate(6px,3px)}}
</style>
  <title id="hydrant-title">Hydrant — fire hydrant robot</title>
  <desc id="hydrant-desc">A chubby crimson fire hydrant robot with a pentagon operating nut on its domed bonnet, two eyes on a slate band under the bolted bonnet flange, a capped pumper outlet on its bulging barrel, side outlet caps as shoulders, jointed arms with brass couplings ending in a hydrant wrench and a brass hose nozzle, on a bolted base flange with stubby legs and round feet.</desc>
