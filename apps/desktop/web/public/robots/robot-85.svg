<svg width="296" height="452" viewBox="132 24 296 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="signal-title signal-desc">
  <title id="signal-title">Signal — level crossing robot</title>
  <desc id="signal-desc">A mustard robot built like a railway level crossing: a slate signal backplate for a head with two hooded round lamps holding its eyes, the left one lit, a mustard crossbuck and a small bell dome on a mast above, a relay cabinet body with a door, hinges and rivets, a striped barrier boom arm with a counterweight at the shoulder, a jointed claw arm and two legs.</desc>
