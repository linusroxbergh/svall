<svg width="296" height="452" viewBox="132 24 296 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="signal-title signal-desc" class="r85" data-idle="blink blink tilt tilt dip" data-work="barrier barrier fold fold dip tilt blink"><style>
.r85[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r85-blink .4s ease-in-out}
.r85[data-act=tilt] .head{animation:r85-tilt 1.6s ease-in-out}
.r85[data-act=tilt] .mast{animation:r85-lag 1.6s ease-in-out}
.r85[data-act=tilt] .bell{animation:r85-jiggle 1.6s ease-in-out}
.r85[data-act=tilt] .eyes{animation:r85-look-l 1.6s ease-in-out}
.r85[data-act=dip] .body{animation:r85-dip 1.6s ease-in-out}
.r85[data-act=dip] .head{animation:r85-bob 1.6s ease-in-out}
.r85[data-act=dip] .arm,.r85[data-act=dip] .boom{animation:r85-hang 1.6s ease-in-out}
.r85[data-act=dip] .fore{animation:r85-hang-fore 1.6s ease-in-out}
.r85[data-act=fold] .arm{animation:r85-fold 1.8s ease-in-out}
.r85[data-act=fold] .fore{animation:r85-fold-fore 1.8s ease-in-out}
.r85[data-act=fold] .claw-l{animation:r85-snap-l 1.8s ease-in-out}
.r85[data-act=fold] .claw-r{animation:r85-snap-r 1.8s ease-in-out}
.r85[data-act=fold] .eyes{animation:r85-watch 1.8s ease-in-out}
.r85[data-act=barrier] .boom{animation:r85-barrier 2s ease-in-out}
.r85[data-act=barrier] .body{animation:r85-brace 2s ease-in-out}
.r85[data-act=barrier] .mast{animation:r85-shake 2s ease-in-out}
.r85[data-act=barrier] .bell{animation:r85-ring 2s ease-in-out}
.r85[data-act=barrier] .head{animation:r85-heed 2s ease-in-out}
.r85[data-act=barrier] .eyes{animation:r85-look-r 2s ease-in-out}
.r85[data-act=barrier] .lamp-l{animation:r85-dim 2s ease-in-out}
.r85[data-act=barrier] .lamp-r{animation:r85-light 2s ease-in-out}
@keyframes r85-blink{0%,100%{transform:none}45%,55%{transform:scaleY(.1)}}
@keyframes r85-tilt{0%,100%{transform:none}24%,56%{transform:rotate(-4.5deg)}78%{transform:rotate(1.2deg)}91%{transform:rotate(-.3deg)}}
@keyframes r85-lag{0%,8%,100%{transform:none}30%{transform:rotate(2.5deg)}50%{transform:rotate(-1.5deg)}70%{transform:rotate(1deg)}86%{transform:rotate(-.4deg)}}
@keyframes r85-jiggle{0%,12%,100%{transform:none}34%{transform:rotate(6deg)}54%{transform:rotate(-4deg)}74%{transform:rotate(2deg)}88%{transform:rotate(-.6deg)}}
@keyframes r85-look-l{0%,10%,82%,100%{transform:none}24%,64%{transform:translateX(-3.5px)}}
@keyframes r85-dip{0%,100%{transform:none}30%,42%{transform:translateY(3px)}68%{transform:translateY(-.5px)}84%{transform:translateY(.2px)}}
@keyframes r85-bob{0%,100%{transform:none}24%{transform:translateY(-1px)}50%{transform:translateY(1px)}74%{transform:translateY(-.4px)}}
@keyframes r85-hang{0%,100%{transform:none}30%{transform:rotate(-3deg)}56%{transform:rotate(2.2deg)}80%{transform:rotate(-.8deg)}}
@keyframes r85-hang-fore{0%,8%,100%{transform:none}38%{transform:rotate(-7deg)}64%{transform:rotate(5deg)}86%{transform:rotate(-1.5deg)}}
@keyframes r85-fold{0%,100%{transform:none}26%,58%{transform:rotate(-12deg)}78%{transform:rotate(3deg)}91%{transform:rotate(-1deg)}}
@keyframes r85-fold-fore{0%,6%,100%{transform:none}32%{transform:rotate(-58deg)}40%,56%{transform:rotate(-54deg)}80%{transform:rotate(6deg)}93%{transform:rotate(-2deg)}}
@keyframes r85-snap-l{0%,22%,70%,100%{transform:none}34%{transform:rotate(18deg)}43%{transform:rotate(-7deg)}52%{transform:rotate(12deg)}61%{transform:rotate(-5deg)}}
@keyframes r85-snap-r{0%,22%,70%,100%{transform:none}34%{transform:rotate(-18deg)}43%{transform:rotate(7deg)}52%{transform:rotate(-12deg)}61%{transform:rotate(5deg)}}
@keyframes r85-watch{0%,12%,80%,100%{transform:none}30%,62%{transform:translate(-3px,2.5px)}}
@keyframes r85-barrier{0%,100%{transform:none}10%{transform:rotate(-4deg)}30%{transform:rotate(24deg)}37%{transform:rotate(17deg)}44%{transform:rotate(22.5deg)}51%{transform:rotate(20deg)}57%,64%{transform:rotate(21deg)}82%{transform:rotate(-4deg)}91%{transform:rotate(1.5deg)}}
@keyframes r85-brace{0%,18%,100%{transform:none}32%{transform:translateY(2.5px)}46%,62%{transform:translateY(1px)}80%{transform:translateY(-.4px)}}
@keyframes r85-shake{0%,26%,64%,100%{transform:none}33%{transform:rotate(2.5deg)}42%{transform:rotate(-1.8deg)}52%{transform:rotate(.8deg)}}
@keyframes r85-ring{0%,26%,76%,100%{transform:none}33%{transform:rotate(10deg)}41%{transform:rotate(-8deg)}49%{transform:rotate(6deg)}57%{transform:rotate(-4deg)}66%{transform:rotate(2deg)}}
@keyframes r85-heed{0%,12%,100%{transform:none}30%,62%{transform:rotate(4deg)}80%{transform:rotate(-1deg)}92%{transform:rotate(.3deg)}}
@keyframes r85-look-r{0%,10%,82%,100%{transform:none}26%,66%{transform:translateX(3.5px)}}
@keyframes r85-dim{0%,34%,72%,100%{fill:#8fe0f0}42%,64%{fill:#79d6eb}}
@keyframes r85-light{0%,34%,72%,100%{fill:#79d6eb}42%,64%{fill:#8fe0f0}}
</style>
  <title id="signal-title">Signal — level crossing robot</title>
  <desc id="signal-desc">A mustard robot built like a railway level crossing: a slate signal backplate for a head with two hooded round lamps holding its eyes, the left one lit, a mustard crossbuck and a small bell dome on a mast above, a relay cabinet body with a door, hinges and rivets, a striped barrier boom arm with a counterweight at the shoulder, a jointed claw arm and two legs.</desc>
