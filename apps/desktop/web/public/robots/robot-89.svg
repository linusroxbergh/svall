<svg width="338" height="452" viewBox="87 24 338 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hook-title hook-desc" class="r89" data-idle="blink blink peer shrug shift" data-work="hoist hoist shift peer blink"><style>
.r89[data-act=blink] .iris{transform-box:fill-box;transform-origin:center;animation:r89-blink .5s ease-in-out}
.r89[data-act=peer] .head{animation:r89-cock 1.8s ease-in-out}
.r89[data-act=peer] .iris{animation:r89-look 1.8s ease-in-out}
.r89[data-act=peer] .arm-l,.r89[data-act=peer] .arm-r{animation:r89-hang 1.8s ease-in-out}
.r89[data-act=peer] .fore-l,.r89[data-act=peer] .fore-r{animation:r89-hang-fore 1.8s ease-in-out}
.r89[data-act=shrug] .arm-l{animation:r89-shrug-l 1.6s ease-in-out}
.r89[data-act=shrug] .arm-r{animation:r89-shrug-r 1.6s ease-in-out}
.r89[data-act=shrug] .fore-l{animation:r89-flare-l 1.6s ease-in-out}
.r89[data-act=shrug] .fore-r{animation:r89-flare-r 1.6s ease-in-out}
.r89[data-act=shrug] .head{animation:r89-sink 1.6s ease-in-out}
.r89[data-act=shrug] .iris{animation:r89-up 1.6s ease-in-out}
.r89[data-act=shift] .tip-r{animation:r89-shift-r 2s ease-in-out}
.r89[data-act=shift] .tip-l{animation:r89-shift-l 2s ease-in-out}
.r89[data-act=shift] .ub{animation:r89-bob 2s ease-in-out}
.r89[data-act=shift] .arm-l,.r89[data-act=shift] .arm-r{animation:r89-counter 2s ease-in-out}
.r89[data-act=shift] .fore-l,.r89[data-act=shift] .fore-r{animation:r89-lag 2s ease-in-out}
.r89[data-act=shift] .hook-l,.r89[data-act=shift] .hook-r{animation:r89-lag2 2s ease-in-out}
.r89[data-act=shift] .head{animation:r89-lag-head 2s ease-in-out}
.r89[data-act=hoist] .ub{animation:r89-dip 2s ease-in-out}
.r89[data-act=hoist] .arm-l{animation:r89-hoist-l 2s ease-in-out}
.r89[data-act=hoist] .arm-r{animation:r89-hoist-r 2s ease-in-out}
.r89[data-act=hoist] .fore-l{animation:r89-heave-l 2s ease-in-out}
.r89[data-act=hoist] .fore-r{animation:r89-heave-r 2s ease-in-out}
.r89[data-act=hoist] .hook-l{animation:r89-catch-l 2s ease-in-out}
.r89[data-act=hoist] .hook-r{animation:r89-catch-r 2s ease-in-out}
.r89[data-act=hoist] .head{animation:r89-nod 2s ease-in-out}
.r89[data-act=hoist] .iris{animation:r89-down 2s ease-in-out}
.r89[data-act=hoist] .needle{animation:r89-load 2s ease-in-out}
.r89[data-act=hoist] .lamp{animation:r89-glow 2s ease-in-out}
