</style>
  <title id="hook-title">Hook — cyclops robot</title>
  <desc id="hook-desc">An orange cyclops robot with a tall dome head holding one large eye in a slate ring, side bolts and a slate collar, a wide rounded pill body with a chest dial and two lights, slate shoulder pads with jointed arms reaching down to hooks near the ground, and two straight legs on round slate feet.</desc>
