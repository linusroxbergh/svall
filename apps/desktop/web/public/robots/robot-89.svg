@keyframes r89-hoist-r{0%,100%{transform:none}14%{transform:rotate(-1.5deg)}34%{transform:rotate(3deg)}52%,62%{transform:translate(0,-4px) rotate(-3deg)}78%{transform:rotate(-2deg)}90%{transform:rotate(.6deg)}}
@keyframes r89-heave-l{0%,100%{transform:none}14%{transform:rotate(1.5deg)}34%{transform:rotate(-18deg)}52%,62%{transform:rotate(-76deg)}78%{transform:rotate(4deg)}90%{transform:rotate(-1.2deg)}}
