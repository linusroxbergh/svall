<svg width="358" height="410" viewBox="80 66 358 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="octo-title octo-desc" class="r51" data-idle="blink blink peer peer bob beckon" data-work="wave wave beckon bob peer blink"><style>.r51[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r51-blink .4s ease-in-out}
.r51[data-act=peer] .body{animation:r51-peer 1.6s ease-in-out}
.r51[data-act=peer] .eyes{animation:r51-look 1.6s ease-in-out}
.r51[data-act=peer] .ant{animation:r51-ant 1.6s ease-in-out}
.r51[data-act=bob] .body{animation:r51-bob 1.6s ease-in-out}
.r51[data-act=bob] .arm-l{animation:r51-trail-l 1.6s ease-in-out}
.r51[data-act=bob] .arm-r{animation:r51-trail-r 1.6s ease-in-out}
.r51[data-act=bob] .t1{animation:r51-push-l 1.6s ease-in-out}
.r51[data-act=bob] .t2{animation:r51-push-r 1.6s ease-in-out}
.r51[data-act=beckon] .arm-l{animation:r51-lift 1.8s ease-in-out}
.r51[data-act=beckon] .curl-l{animation:r51-beckon 1.8s ease-in-out}
.r51[data-act=beckon] .eyes{animation:r51-look 1.8s ease-in-out}
.r51[data-act=wave] .body{animation:r51-dip 2s ease-in-out}
.r51[data-act=wave] .arm-r{animation:r51-raise 2s ease-in-out}
.r51[data-act=wave] .fore-r{animation:r51-wave 2s ease-in-out}
.r51[data-act=wave] .hand-r{animation:r51-curl 2s ease-in-out}
.r51[data-act=wave] .t1{animation:r51-ripple 1.2s ease-in-out .2s}
.r51[data-act=wave] .t3{animation:r51-ripple 1.2s ease-in-out .3s}
.r51[data-act=wave] .t4{animation:r51-ripple 1.2s ease-in-out .4s}
.r51[data-act=wave] .t2{animation:r51-ripple 1.2s ease-in-out .5s}
@keyframes r51-blink{0%,100%{transform:none}40%,55%{transform:scaleY(.1)}}
@keyframes r51-peer{0%,100%{transform:none}25%,55%{transform:rotate(-3.5deg)}78%{transform:rotate(1deg)}}
@keyframes r51-look{0%,100%{transform:none}20%,70%{transform:translateX(-7px)}}
