@keyframes r51-bob{0%,100%{transform:none}15%{transform:translateY(1px)}45%{transform:translateY(-2.5px)}68%{transform:translateY(.7px)}85%{transform:translateY(-.3px)}}
@keyframes r51-trail-l{0%,100%{transform:none}15%{transform:rotate(1deg)}38%{transform:rotate(-3deg)}58%{transform:rotate(2.5deg)}78%{transform:rotate(-1.2deg)}92%{transform:rotate(.3deg)}}
@keyframes r51-trail-r{0%,100%{transform:none}15%{transform:rotate(-1deg)}38%{transform:rotate(3deg)}58%{transform:rotate(-2.5deg)}78%{transform:rotate(1.2deg)}92%{transform:rotate(-.3deg)}}
@keyframes r51-push-l{0%,100%{transform:none}15%{transform:rotate(1deg)}45%{transform:rotate(-2deg)}68%{transform:rotate(.8deg)}85%{transform:rotate(-.3deg)}}
@keyframes r51-push-r{0%,100%{transform:none}15%{transform:rotate(-1deg)}45%{transform:rotate(2deg)}68%{transform:rotate(-.8deg)}85%{transform:rotate(.3deg)}}
@keyframes r51-lift{0%,100%{transform:none}20%,70%{transform:rotate(4deg)}88%{transform:rotate(-1.2deg)}}
@keyframes r51-beckon{0%,10%,100%{transform:none}30%{transform:rotate(-24deg)}46%{transform:rotate(-4deg)}62%{transform:rotate(-21deg)}80%{transform:rotate(3deg)}92%{transform:rotate(-.5deg)}}
@keyframes r51-dip{0%,100%{transform:none}18%{transform:translateY(3px)}42%{transform:translateY(-3px)}64%{transform:translateY(1.5px)}84%{transform:translateY(-.5px)}}
@keyframes r51-raise{0%,100%{transform:none}16%{transform:rotate(-6deg)}40%{transform:rotate(-4deg)}64%{transform:rotate(-5deg)}84%{transform:rotate(1.5deg)}}
@keyframes r51-wave{0%,6%,100%{transform:none}24%{transform:rotate(-11deg)}44%{transform:rotate(13deg)}62%{transform:rotate(-8deg)}78%{transform:rotate(4deg)}90%{transform:rotate(-1.5deg)}}
@keyframes r51-curl{0%,12%,100%{transform:none}32%{transform:rotate(-11deg)}52%{transform:rotate(13deg)}70%{transform:rotate(-8deg)}86%{transform:rotate(4deg)}96%{transform:rotate(-1deg)}}
@keyframes r51-ripple{0%,100%{transform:none}25%{transform:rotate(3.5deg)}55%{transform:rotate(-2.5deg)}80%{transform:rotate(1deg)}}</style>
  <title id="octo-title">Octo — tentacle robot</title>
  <desc id="octo-desc">A sky blue robot with a domed head, big eyes behind a wide visor and a ring of lights, standing on four jointed tentacles with one more raised and curled and another curled down.</desc>
