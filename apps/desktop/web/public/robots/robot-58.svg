<svg width="216" height="430" viewBox="148 46 216 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="keeper-title keeper-desc" class="r58" data-idle="blink blink blink blink peer shift beacon" data-work="beacon beacon dial dial shift peer" data-rare="nap fix"><style>
.r58[data-act=beacon] .body{animation:r58-sway 2s ease-in-out}
