<svg width="216" height="430" viewBox="148 46 216 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="keeper-title keeper-desc" class="r58" data-idle="blink blink peer shift beacon" data-work="beacon beacon dial dial shift peer"><style>
.r58[data-act=beacon] .body{animation:r58-sway 2s ease-in-out}
.r58[data-act=beacon] .head{animation:r58-sweep 2s ease-in-out}
.r58[data-act=beacon] .look{animation:r58-turn 2s ease-in-out}
.r58[data-act=beacon] .lamp{animation:r58-swell 2s ease-in-out}
.r58[data-act=beacon] .glow{animation:r58-glow 2s ease-in-out}
.r58[data-act=beacon] .arm-l,.r58[data-act=beacon] .arm-r{animation:r58-counter 2s ease-in-out}
.r58[data-act=beacon] .vent{animation:r58-lag 2s ease-in-out}
.r58[data-act=shift] .rock-l{animation:r58-tip-l 1.8s ease-in-out}
.r58[data-act=shift] .rock-r{animation:r58-tip-r 1.8s ease-in-out}
.r58[data-act=shift] .head{animation:r58-bob 1.8s ease-in-out}
.r58[data-act=shift] .arm-l,.r58[data-act=shift] .arm-r{animation:r58-dangle 1.8s ease-in-out}
.r58[data-act=shift] .vent{animation:r58-lag 1.8s ease-in-out}
.r58[data-act=dial] .needle{animation:r58-needle 1.8s ease-in-out}
.r58[data-act=dial] .body{animation:r58-sink 1.8s ease-in-out}
.r58[data-act=dial] .head{animation:r58-nod 1.8s ease-in-out}
.r58[data-act=dial] .look{animation:r58-down 1.8s ease-in-out}
.r58[data-act=dial] .arm-l{animation:r58-in-l 1.8s ease-in-out}
.r58[data-act=dial] .arm-r{animation:r58-in-r 1.8s ease-in-out}
.r58[data-act=peer] .body{animation:r58-lean 1.8s ease-in-out}
.r58[data-act=peer] .head{animation:r58-cock 1.8s ease-in-out}
.r58[data-act=peer] .look{animation:r58-peek 1.8s ease-in-out}
.r58[data-act=peer] .arm-r{animation:r58-lift 1.8s ease-in-out}
.r58[data-act=peer] .arm-l{animation:r58-hang 1.8s ease-in-out}
.r58[data-act=peer] .vent{animation:r58-trail 1.8s ease-in-out}
.r58[data-act=blink] .eyes{animation:r58-blink .4s ease-in-out}
/* the head sinks 48 units x sin(angle) into the gallery rail so its raised corner never lifts off */
@keyframes r58-sway{0%,100%{transform:none}24%{transform:rotate(-1.8deg)}60%{transform:rotate(1.5deg)}84%{transform:rotate(-.5deg)}}
@keyframes r58-sweep{0%,100%{transform:none}30%{transform:translate(0,3.35px) rotate(-4deg)}66%{transform:translate(0,2.93px) rotate(3.5deg)}88%{transform:translate(0,.84px) rotate(-1deg)}}
@keyframes r58-turn{0%,100%{transform:none}22%,36%{transform:translateX(-8px)}60%,72%{transform:translateX(8px)}90%{transform:translateX(-1px)}}
@keyframes r58-swell{0%,100%{transform:none}35%,65%{transform:scale(1.3)}}
@keyframes r58-glow{0%,100%{fill:#f6c354}35%,65%{fill:#fde3a0}}
@keyframes r58-counter{0%,100%{transform:none}28%{transform:rotate(5deg)}64%{transform:rotate(-4deg)}86%{transform:rotate(1.5deg)}}
@keyframes r58-lag{0%,100%{transform:none}28%{transform:rotate(14deg)}56%{transform:rotate(-16deg)}76%{transform:rotate(7deg)}92%{transform:rotate(-2deg)}}
@keyframes r58-tip-l{0%,40%,76%,100%{transform:none}20%{transform:rotate(-1.6deg)}88%{transform:rotate(-.3deg)}}
@keyframes r58-tip-r{0%,40%,76%,100%{transform:none}58%{transform:rotate(1.3deg)}}
@keyframes r58-bob{0%,100%{transform:none}26%{transform:translate(0,1.68px) rotate(2deg)}62%{transform:translate(0,1.26px) rotate(-1.5deg)}}
@keyframes r58-dangle{0%,100%{transform:none}24%{transform:rotate(6deg)}60%{transform:rotate(-5deg)}88%{transform:rotate(1.5deg)}}
@keyframes r58-needle{0%,15%,100%{transform:none}40%,58%{transform:rotate(-95deg)}75%{transform:rotate(14deg)}88%{transform:rotate(-5deg)}}
@keyframes r58-sink{0%,100%{transform:none}20%,70%{transform:translateY(3px)}}
@keyframes r58-nod{0%,100%{transform:none}22%,70%{transform:translateY(4px)}}
@keyframes r58-down{0%,100%{transform:none}18%,74%{transform:translateY(2.5px)}}
@keyframes r58-in-l{0%,100%{transform:none}25%,68%{transform:rotate(-8deg)}86%{transform:rotate(2deg)}}
@keyframes r58-in-r{0%,100%{transform:none}25%,68%{transform:rotate(8deg)}86%{transform:rotate(-2deg)}}
@keyframes r58-lean{0%,100%{transform:none}28%,62%{transform:rotate(1.6deg)}82%{transform:rotate(-.4deg)}}
@keyframes r58-cock{0%,100%{transform:none}32%,60%{transform:translate(0,3.77px) rotate(4.5deg)}80%{transform:translate(0,.84px) rotate(-1deg)}}
@keyframes r58-peek{0%,100%{transform:none}24%,64%{transform:translateX(9px)}84%{transform:translateX(-2px)}}
@keyframes r58-lift{0%,100%{transform:none}30%,58%{transform:rotate(-12deg)}80%{transform:rotate(2deg)}}
@keyframes r58-hang{0%,100%{transform:none}30%{transform:rotate(-4deg)}62%{transform:rotate(2deg)}84%{transform:rotate(-1deg)}}
@keyframes r58-trail{0%,100%{transform:none}30%{transform:rotate(-14deg)}58%{transform:rotate(-10deg)}76%{transform:rotate(8deg)}90%{transform:rotate(-3deg)}}
@keyframes r58-blink{0%,100%{transform:none}45%,55%{transform:scaleY(.1)}}
</style>
  <title id="keeper-title">Keeper — lighthouse robot</title>
  <desc id="keeper-desc">A red lighthouse robot with a tapered tower body banded in pale grey, a porthole dial and a door, a glass lantern room for a head with a lit lamp and two eyes behind a gallery rail, a domed cap with a vent ball, short arms with pincers, and a wide round base on two feet.</desc>
