  <title id="reel-title">Reel — film projector robot</title>
  <desc id="reel-desc">A forest green robot whose head is a film projector with two spoked reels standing on top and two round lens eyes, a boxy body with a dial, a lever switch and vent slats, ring jointed arms with pincers, and legs with ring knees on flat feet.</desc>
