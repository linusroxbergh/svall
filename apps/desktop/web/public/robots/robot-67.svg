      <rect x="138" y="318" width="24" height="14" rx="4" fill="#3f8a55"/>
      <path d="M142 332q-8 16 3 28m14-28q8 16-3 28" fill="none" stroke="#3d4853" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle cx="150" cy="276" r="12" fill="#3d4853"/>
    <circle cx="150" cy="276" r="5" fill="#92a1b2"/>
  </g>
  <!-- Legs with ring knees and flat feet -->
  <path d="M226 344v108m60-108v108" stroke="#697785" stroke-width="13"/>
