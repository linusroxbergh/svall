<svg width="244" height="420" viewBox="134 58 244 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reel-title reel-desc" class="r67" data-idle="blink blink peer peer shift lever" data-work="crank crank crank lever shift peer"><style>
.r67[data-act=blink] .lens{transform-box:fill-box;transform-origin:center;animation:r67-blink .4s ease-in-out}
.r67[data-act=peer] .head{animation:r67-cock 1.6s ease-in-out}
.r67[data-act=peer] .look{animation:r67-side 1.6s ease-in-out}
.r67[data-act=peer] .reel{animation:r67-lag 1.6s ease-in-out}
.r67[data-act=lever] .head{animation:r67-bow 1.8s ease-in-out}
.r67[data-act=lever] .look{animation:r67-down 1.8s ease-in-out}
.r67[data-act=lever] .lever{animation:r67-flip 1.8s ease-in-out}
.r67[data-act=lever] .needle{animation:r67-needle 1.8s ease-in-out}
.r67[data-act=shift] .tip-l{animation:r67-tip-l 1.8s ease-in-out}
.r67[data-act=shift] .tip-r{animation:r67-tip-r 1.8s ease-in-out}
.r67[data-act=shift] .arm-l,.r67[data-act=shift] .arm-r{animation:r67-hang 1.8s ease-in-out}
.r67[data-act=shift] .fore-l,.r67[data-act=shift] .fore-r{animation:r67-hang-f 1.8s ease-in-out}
.r67[data-act=crank] .arm-r{animation:r67-crank 2s ease-in-out}
.r67[data-act=crank] .fore-r{animation:r67-crank-f 2s ease-in-out}
.r67[data-act=crank] .reel{animation:r67-wind 2s ease-in-out}
.r67[data-act=crank] .head{animation:r67-nod 2s ease-in-out}
.r67[data-act=crank] .look{animation:r67-watch 2s ease-in-out}
.r67[data-act=crank] .tip-r{animation:r67-heave 2s ease-in-out}
@keyframes r67-blink{0%,100%{transform:none}45%,55%{transform:scaleY(.1)}}
@keyframes r67-cock{0%,100%{transform:none}26%,54%{transform:rotate(6deg)}74%{transform:rotate(-1.5deg)}88%{transform:rotate(.5deg)}}
@keyframes r67-side{0%,100%{transform:none}20%,60%{transform:translate(3.5px,1px)}}
@keyframes r67-lag{0%,8%,100%{transform:none}30%{transform:rotate(-24deg)}52%{transform:rotate(10deg)}74%{transform:rotate(-4deg)}}
@keyframes r67-bow{0%,100%{transform:none}18%,70%{transform:translateY(5px)}84%{transform:translateY(-1px)}}
@keyframes r67-down{0%,100%{transform:none}14%,72%{transform:translateY(3px)}}
@keyframes r67-flip{0%,24%,68%,100%{transform:none}34%,58%{transform:rotate(-53deg)}}
@keyframes r67-needle{0%,30%,100%{transform:none}46%{transform:rotate(80deg)}58%{transform:rotate(62deg)}76%{transform:rotate(-8deg)}88%{transform:rotate(3deg)}}
@keyframes r67-tip-l{0%,46%,100%{transform:none}22%{transform:rotate(-1deg)}}
@keyframes r67-tip-r{0%,46%,76%,100%{transform:none}61%{transform:rotate(.6deg)}}
@keyframes r67-hang{0%,4%,100%{transform:none}24%{transform:rotate(4deg)}52%{transform:rotate(-3.5deg)}72%{transform:rotate(2deg)}88%{transform:rotate(-.8deg)}}
@keyframes r67-hang-f{0%,8%,100%{transform:none}30%{transform:rotate(5deg)}58%{transform:rotate(-4deg)}78%{transform:rotate(2deg)}92%{transform:rotate(-.6deg)}}
@keyframes r67-crank{0%,100%{transform:none}4%{transform:rotate(2deg)}16%{transform:rotate(-36deg)}40%{transform:rotate(17deg)}57%{transform:rotate(-40deg)}81%{transform:rotate(19deg)}88%{transform:rotate(-2.5deg)}95%{transform:rotate(.8deg)}}
@keyframes r67-crank-f{0%,4%,100%{transform:none}21%{transform:rotate(80deg)}41.6%{transform:rotate(-12deg)}62%{transform:rotate(88deg)}82.6%{transform:rotate(-14deg)}89%{transform:rotate(3deg)}95%{transform:rotate(-1deg)}}
@keyframes r67-wind{0%,4%{transform:rotate(0deg)}86%,100%{transform:rotate(-720deg)}}
@keyframes r67-nod{0%,4%,100%{transform:none}20%{transform:translateY(4.5px) rotate(3deg)}41%{transform:translateY(-.5px)}61%{transform:translateY(5px) rotate(3.5deg)}82%{transform:translateY(-.5px)}91%{transform:translateY(.6px)}}
@keyframes r67-heave{0%,4%,41%,82%,100%{transform:none}20%{transform:rotate(.6deg)}61%{transform:rotate(.7deg)}}
@keyframes r67-watch{0%,100%{transform:none}12%,80%{transform:translate(3px,1.5px)}}
</style>
  <title id="reel-title">Reel — film projector robot</title>
  <desc id="reel-desc">A forest green robot whose head is a film projector with two spoked reels standing on top and two round lens eyes, a boxy body with a dial, a lever switch and vent slats, ring jointed arms with pincers, and legs with ring knees on flat feet.</desc>
