  <circle cx="286" cy="398" r="6" fill="#92a1b2"/>
  <path d="M206 452h40q6 0 6 6v10h-52v-10q0-6 6-6Zm60 0h40q6 0 6 6v10h-52v-10q0-6 6-6Z" fill="#3f8a55"/>
  <path d="M238 452h8q6 0 6 6v10h-14Zm60 0h8q6 0 6 6v10h-14Z" fill="#2c6b40"/>
  <path d="M198 468h56v8h-56Zm60 0h56v8h-56Z" fill="#3d4853"/>
  <!-- Boxy body with a dial and a lever switch -->
  <rect x="238" y="194" width="36" height="20" fill="#3d4853"/>
  <rect x="180" y="210" width="152" height="136" rx="14" fill="#3f8a55"/>
  <path d="M194 210h124q14 0 14 14v4H180v-4q0-14 14-14Z" fill="#5aa06a"/>
  <path d="M314 210h4q14 0 14 14v108q0 14-14 14h-4Z" fill="#2c6b40"/>
