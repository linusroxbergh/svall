  <!-- Film reels -->
  <g class="head" style="transform-origin:274px 198px">
    <rect x="208" y="96" width="12" height="26" fill="#697785"/>
    <rect x="292" y="96" width="12" height="26" fill="#697785"/>
    <g class="reel" style="transform-origin:214px 90px">
      <circle cx="214" cy="90" r="30" fill="#3d4853"/>
      <path d="M214 90v-24m0 24 20.8 12M214 90l-20.8 12" stroke="#92a1b2" stroke-width="6" stroke-linecap="round"/>
      <circle cx="214" cy="90" r="7" fill="#92a1b2"/>
      <circle cx="214" cy="90" r="3" fill="#3d4853"/>
    </g>
    <g class="reel" style="transform-origin:298px 90px">
      <circle cx="298" cy="90" r="30" fill="#3d4853"/>
      <path d="M298 90v-24m0 24 20.8 12M298 90l-20.8 12" stroke="#92a1b2" stroke-width="6" stroke-linecap="round"/>
      <circle cx="298" cy="90" r="7" fill="#92a1b2"/>
      <circle cx="298" cy="90" r="3" fill="#3d4853"/>
    </g>
  </g>
  <!-- Ring jointed arms with pincers -->
