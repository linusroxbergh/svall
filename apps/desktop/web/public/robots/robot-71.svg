<svg width="340" height="418" viewBox="86 60 340 418" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="boombox-title boombox-desc" class="r71" data-idle="blink blink scan scan hush signal" data-work="strut strut signal signal hush blink"><style>
.r71[data-act=signal] .all{animation:r71-lean 2s ease-in-out}
.r71[data-act=signal] .arm-r{animation:r71-reach 2s ease-in-out}
.r71[data-act=signal] .fore-r{animation:r71-unfold 2s ease-in-out}
.r71[data-act=signal] .arm-l{animation:r71-plumb 2s ease-in-out}
.r71[data-act=signal] .aerial{animation:r71-aerial 2s ease-in-out}
.r71[data-act=signal] .head{animation:r71-cock 2s ease-in-out}
.r71[data-act=signal] .eyes{animation:r71-up 2s ease-in-out}
.r71[data-act=scan] .box{animation:r71-lean-lr 1.6s ease-in-out}
.r71[data-act=scan] .head{animation:r71-look 1.6s ease-in-out}
.r71[data-act=scan] .eyes{animation:r71-glance-lr 1.6s ease-in-out}
.r71[data-act=scan] .cursor{animation:r71-tune 1.6s ease-in-out}
.r71[data-act=scan] .aerial{animation:r71-lag 1.6s ease-in-out}
.r71[data-act=scan] .arm-l,.r71[data-act=scan] .arm-r{animation:r71-hang 1.6s ease-in-out}
.r71[data-act=strut] .box{animation:r71-step 1.8s ease-in-out}
.r71[data-act=strut] .leg-l{animation:r71-lift-l 1.8s ease-in-out}
.r71[data-act=strut] .leg-r{animation:r71-lift-r 1.8s ease-in-out}
.r71[data-act=strut] .arm-l,.r71[data-act=strut] .arm-r{animation:r71-swing-arm 1.8s ease-in-out}
.r71[data-act=strut] .fore-l,.r71[data-act=strut] .fore-r{animation:r71-swing-fore 1.8s ease-in-out}
.r71[data-act=strut] .head{animation:r71-nod-lag 1.8s ease-in-out}
.r71[data-act=strut] .aerial{animation:r71-whip 1.8s ease-in-out}
.r71[data-act=hush] .arm-l{animation:r71-elbow-l 1.8s ease-in-out}
.r71[data-act=hush] .arm-r{animation:r71-elbow-r 1.8s ease-in-out}
.r71[data-act=hush] .fore-l{animation:r71-cover-l 1.8s ease-in-out}
.r71[data-act=hush] .fore-r{animation:r71-cover-r 1.8s ease-in-out}
.r71[data-act=hush] .head{animation:r71-duck 1.8s ease-in-out}
.r71[data-act=hush] .eyes{transform-box:fill-box;transform-origin:center;animation:r71-squint 1.8s ease-in-out}
.r71[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r71-blink .4s ease-in-out}
/* the box sinks 44 units x angle so its hips stay on the legs */
@keyframes r71-lean{0%,8%,100%{transform:none}34%,58%{transform:rotate(-1deg)}80%{transform:none}90%{transform:rotate(-.3deg)}}
@keyframes r71-reach{0%,100%{transform:none}8%{transform:rotate(4deg)}36%,46%{transform:rotate(-118deg)}54%{transform:rotate(-114deg)}82%{transform:rotate(5deg)}92%{transform:rotate(-1.5deg)}}
@keyframes r71-unfold{0%,8%,100%{transform:none}36%{transform:rotate(290deg)}46%{transform:rotate(300deg)}54%{transform:rotate(292deg)}82%{transform:rotate(-7deg)}92%{transform:rotate(2deg)}}
@keyframes r71-plumb{0%,100%{transform:none}36%{transform:rotate(2.5deg)}60%{transform:rotate(1deg)}78%{transform:rotate(-1.2deg)}90%{transform:rotate(.4deg)}}
@keyframes r71-aerial{0%,100%{transform:none}22%{transform:rotate(6deg)}36%{transform:rotate(2deg)}48%{transform:rotate(-26deg)}60%{transform:rotate(14deg)}72%{transform:rotate(-7deg)}85%{transform:rotate(3deg)}}
@keyframes r71-cock{0%,24%,100%{transform:none}40%,62%{transform:rotate(9deg)}78%{transform:rotate(-2deg)}90%{transform:rotate(.6deg)}}
@keyframes r71-up{0%,22%,100%{transform:none}34%,64%{transform:translate(3px,-3px)}80%{transform:none}}
@keyframes r71-lean-lr{0%,100%{transform:none}24%,40%{transform:translateY(.8px) rotate(-1deg)}64%{transform:translateY(.8px) rotate(1deg)}82%{transform:translateY(.3px) rotate(-.3deg)}}
@keyframes r71-look{0%,100%{transform:none}26%,42%{transform:rotate(-6deg)}66%{transform:rotate(6deg)}84%{transform:rotate(-1.5deg)}}
@keyframes r71-glance-lr{0%,100%{transform:none}22%,44%{transform:translateX(-4px)}60%,70%{transform:translateX(4px)}88%{transform:none}}
@keyframes r71-tune{0%,100%{transform:none}26%,40%{transform:translateX(-22px)}66%{transform:translateX(12px)}84%{transform:translateX(-3px)}}
@keyframes r71-lag{0%,100%{transform:none}30%{transform:rotate(5deg)}50%{transform:rotate(-2deg)}72%{transform:rotate(-5deg)}88%{transform:rotate(2deg)}}
@keyframes r71-hang{0%,100%{transform:none}30%{transform:rotate(3deg)}72%{transform:rotate(-3deg)}90%{transform:rotate(1deg)}}
@keyframes r71-step{0%,100%{transform:none}20%{transform:translateY(1px) rotate(-1.2deg)}50%{transform:translateY(1px) rotate(1.2deg)}76%{transform:translateY(.4px) rotate(-.5deg)}}
@keyframes r71-lift-r{0%,36%,62%,90%,100%{transform:none}20%{transform:translateY(-6px)}76%{transform:translateY(-3px)}}
@keyframes r71-lift-l{0%,36%,64%,100%{transform:none}50%{transform:translateY(-6px)}}
@keyframes r71-swing-arm{0%,100%{transform:none}28%{transform:rotate(6deg)}58%{transform:rotate(-6deg)}84%{transform:rotate(2.5deg)}}
@keyframes r71-swing-fore{0%,100%{transform:none}34%{transform:rotate(6deg)}64%{transform:rotate(-6deg)}90%{transform:rotate(2deg)}}
@keyframes r71-nod-lag{0%,100%{transform:none}26%{transform:rotate(3deg)}56%{transform:rotate(-3deg)}82%{transform:rotate(1deg)}}
@keyframes r71-whip{0%,100%{transform:none}28%{transform:rotate(8deg)}58%{transform:rotate(-8deg)}84%{transform:rotate(3deg)}}
@keyframes r71-elbow-l{0%,100%{transform:none}12%{transform:rotate(12deg)}36%,62%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}92%{transform:rotate(1deg)}}
@keyframes r71-elbow-r{0%,100%{transform:none}12%{transform:rotate(-12deg)}36%,62%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}92%{transform:rotate(-1deg)}}
@keyframes r71-cover-l{0%,100%{transform:none}36%,62%{transform:rotate(-100deg)}80%{transform:rotate(6deg)}92%{transform:rotate(-2deg)}}
@keyframes r71-cover-r{0%,100%{transform:none}36%,62%{transform:rotate(100deg)}80%{transform:rotate(-6deg)}92%{transform:rotate(2deg)}}
@keyframes r71-duck{0%,100%{transform:none}38%,62%{transform:translateY(3px) rotate(-4deg)}80%{transform:rotate(1deg)}}
@keyframes r71-squint{0%,30%,68%,100%{transform:none}38%,60%{transform:scaleY(.35)}}
@keyframes r71-blink{0%,100%{transform:none}45%,55%{transform:scaleY(.1)}}
</style>
  <title id="boombox-title">Boombox — portable stereo robot</title>
  <desc id="boombox-desc">A mustard robot whose body is a wide 1980s boombox with two speaker cones either side of a cassette window, a tuner strip and a row of keys, a carry handle arching over the top holding a small square head with two round eyes, a telescopic aerial, ring jointed arms with pincers, and short legs on flat feet.</desc>
