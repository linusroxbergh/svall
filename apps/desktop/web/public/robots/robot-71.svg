<svg width="340" height="418" viewBox="86 60 340 418" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="boombox-title boombox-desc">
  <title id="boombox-title">Boombox — portable stereo robot</title>
  <desc id="boombox-desc">A mustard robot whose body is a wide 1980s boombox with two speaker cones either side of a cassette window, a tuner strip and a row of keys, a carry handle arching over the top holding a small square head with two round eyes, a telescopic aerial, ring jointed arms with pincers, and short legs on flat feet.</desc>
