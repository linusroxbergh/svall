  <title id="piston-title">Piston — hydraulic arm robot</title>
  <desc id="piston-desc">A teal tin-toy robot with a rounded head, two eyes on a slate band and an antenna knob, a barrel body with a chest dial, heavy hydraulic arms with big shoulder housings, thick cylinders, hose loops and chunky three finger hands held low, on a wide drum base riding two low rollers.</desc>
