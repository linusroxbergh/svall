<svg width="292" height="426" viewBox="110 52 292 426" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gearbox-title gearbox-desc" class="r60" data-idle="blink blink look look salute" data-work="windup windup tick tick salute blink"><style>
.r60[data-act=windup] .bot{animation:r60-waddle 2s ease-in-out}
.r60[data-act=windup] .arm-l,.r60[data-act=windup] .arm-r{animation:r60-swing 2s ease-in-out}
.r60[data-act=windup] .ant{animation:r60-ant-waddle 2s ease-in-out}
.r60[data-act=windup] .gear-a{animation:r60-run-a 2s cubic-bezier(.25,.55,.4,1)}
.r60[data-act=windup] .gear-b{animation:r60-run-b 2s cubic-bezier(.25,.55,.4,1)}
.r60[data-act=windup] .gear-c{animation:r60-run-c 2s cubic-bezier(.25,.55,.4,1)}
.r60[data-act=look] .head{animation:r60-turn 1.8s ease-in-out}
.r60[data-act=look] .eyes{animation:r60-glance 1.8s ease-in-out}
.r60[data-act=look] .ant{animation:r60-ant-turn 1.8s ease-in-out}
.r60[data-act=salute] .arm-l{animation:r60-raise 1.8s ease-in-out}
.r60[data-act=salute] .fore-l{animation:r60-fold 1.8s ease-in-out}
.r60[data-act=salute] .head{animation:r60-attend 1.8s ease-in-out}
.r60[data-act=salute] .ant{animation:r60-ant-salute 1.8s ease-in-out}
.r60[data-act=tick] .head{animation:r60-peer 1.6s ease-in-out}
.r60[data-act=tick] .eyes{animation:r60-down 1.6s ease-in-out}
.r60[data-act=tick] .ant{animation:r60-ant-peer 1.6s ease-in-out}
.r60[data-act=tick] .gear-a{animation:r60-tick-a 1.6s ease-in-out}
.r60[data-act=tick] .gear-b{animation:r60-tick-b 1.6s ease-in-out}
.r60[data-act=tick] .gear-c{animation:r60-tick-c 1.6s ease-in-out}
.r60[data-act=tick] .needle-a{animation:r60-needle-a 1.6s ease-in-out}
.r60[data-act=tick] .needle-b{animation:r60-needle-b 1.6s ease-in-out}
.r60[data-act=tick] .lamp{animation:r60-glow 1.6s ease-in-out}
.r60[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r60-blink .4s ease-in-out}
/* the body rocks on a sole's outer corner: translate (±84(1-cos a), -84|sin a|) about the mid-sole origin; gears turn by whole teeth (10:7:5) */
@keyframes r60-waddle{0%,100%{transform:none}
9%{transform:translate(-.16px,-5.13px) rotate(-3.5deg);animation-timing-function:ease-in}
17%{transform:none;animation-timing-function:ease-out}
26%{transform:translate(.16px,-5.13px) rotate(3.5deg);animation-timing-function:ease-in}
34%{transform:none;animation-timing-function:ease-out}
43%{transform:translate(-.13px,-4.69px) rotate(-3.2deg);animation-timing-function:ease-in}
51%{transform:none;animation-timing-function:ease-out}
60%{transform:translate(.09px,-3.81px) rotate(2.6deg);animation-timing-function:ease-in}
68%{transform:none;animation-timing-function:ease-out}
77%{transform:translate(-.03px,-2.35px) rotate(-1.6deg);animation-timing-function:ease-in}
85%{transform:none}}
@keyframes r60-swing{0%,100%{transform:none}13%{transform:rotate(8deg)}30%{transform:rotate(-8deg)}47%{transform:rotate(7.5deg)}64%{transform:rotate(-6deg)}81%{transform:rotate(3.5deg)}92%{transform:rotate(-1.2deg)}}
@keyframes r60-ant-waddle{0%,100%{transform:none}12%{transform:rotate(9deg)}29%{transform:rotate(-10deg)}46%{transform:rotate(9deg)}63%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-3deg)}96%{transform:rotate(1deg)}}
@keyframes r60-run-a{0%{transform:none}88%,100%{transform:rotate(360deg)}}
@keyframes r60-run-b{0%{transform:none}88%{transform:rotate(-514.286deg);animation-timing-function:steps(1,start)}100%{transform:none}}
@keyframes r60-run-c{0%{transform:none}88%,100%{transform:rotate(720deg)}}
@keyframes r60-turn{0%,100%{transform:none}10%{transform:rotate(-5deg)}14%{transform:rotate(-4deg)}18%,42%{transform:rotate(-4.4deg)}52%{transform:rotate(5deg)}56%{transform:rotate(4deg)}60%,78%{transform:rotate(4.4deg)}88%{transform:rotate(-1deg)}94%{transform:rotate(.4deg)}}
@keyframes r60-glance{0%,100%{transform:none}10%,42%{transform:translateX(-5px)}52%,78%{transform:translateX(5px)}88%{transform:none}}
@keyframes r60-ant-turn{0%,100%{transform:none}13%{transform:rotate(12deg)}22%{transform:rotate(-6deg)}31%{transform:rotate(3deg)}40%{transform:none}55%{transform:rotate(-12deg)}64%{transform:rotate(6deg)}73%{transform:rotate(-3deg)}81%{transform:none}91%{transform:rotate(5deg)}97%{transform:rotate(-2deg)}}
@keyframes r60-raise{0%,100%{transform:none}22%{transform:rotate(141deg)}28%,64%{transform:rotate(137deg)}88%{transform:rotate(-4deg)}94%{transform:rotate(1.5deg)}}
@keyframes r60-fold{0%,100%{transform:none}22%{transform:rotate(-262deg)}28%,64%{transform:rotate(-257deg)}88%{transform:rotate(5deg)}94%{transform:rotate(-2deg)}}
@keyframes r60-attend{0%,100%{transform:none}24%,66%{transform:rotate(-2.5deg)}}
@keyframes r60-ant-salute{0%,100%{transform:none}27%{transform:rotate(10deg)}36%{transform:rotate(-6deg)}45%{transform:rotate(3deg)}54%{transform:none}86%{transform:rotate(-6deg)}94%{transform:rotate(3deg)}}
@keyframes r60-peer{0%,100%{transform:none}20%,76%{transform:translateY(6px)}86%{transform:translateY(-1.5px)}}
@keyframes r60-down{0%,100%{transform:none}16%,78%{transform:translateY(4px)}}
@keyframes r60-ant-peer{0%,70%,100%{transform:none}80%{transform:rotate(-10deg)}88%{transform:rotate(6deg)}95%{transform:rotate(-2deg)}}
@keyframes r60-tick-a{0%,28%{transform:none}34%,50%{transform:rotate(36deg)}56%{transform:rotate(72deg);animation-timing-function:steps(1,start)}100%{transform:none}}
@keyframes r60-tick-b{0%,28%{transform:none}34%,50%{transform:rotate(-51.429deg)}56%{transform:rotate(-102.857deg);animation-timing-function:steps(1,start)}100%{transform:none}}
@keyframes r60-tick-c{0%,28%{transform:none}34%,50%{transform:rotate(72deg)}56%{transform:rotate(144deg);animation-timing-function:steps(1,start)}100%{transform:none}}
@keyframes r60-needle-a{0%,28%,100%{transform:none}34%{transform:rotate(50deg)}50%{transform:rotate(40deg)}56%,70%{transform:rotate(95deg)}}
@keyframes r60-needle-b{0%,30%,100%{transform:none}36%{transform:rotate(-40deg)}52%{transform:rotate(-30deg)}58%,72%{transform:rotate(-80deg)}}
@keyframes r60-glow{0%,30%,100%{fill:#79d6eb}40%,72%{fill:#c4f0f9}}
@keyframes r60-blink{0%,100%{transform:none}40%,55%{transform:scaleY(.1)}}
</style>
  <title id="gearbox-title">Gearbox — tin toy robot</title>
  <desc id="gearbox-desc">A coral 1950s tin toy robot with a square head, antenna knob and two round eyes, a big chest window of meshing yellow gears over a row of dials and lights, ring jointed arms with three finger hands, and sturdy legs on wide flat feet.</desc>
