  <title id="wireless-title">Wireless — radio cabinet robot</title>
  <desc id="wireless-desc">A walnut robot whose head is an arched tabletop radio cabinet with two tuning dial eyes over a slatted speaker grille and a short aerial, a slim boxy body with a dial window and knobs, ring jointed arms with three finger hands, and long legs with ring knees on flat feet.</desc>
