<svg width="258" height="452" viewBox="128 24 258 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tinker-title tinker-desc" class="r86" data-idle="blink blink tilt tilt roll visor" data-work="drive drive pinch pinch visor roll"><style>
.r86[data-act=visor] .visor{animation:r86-flip 2s ease-in-out}
.r86[data-act=visor] .head{animation:r86-lift 2s ease-in-out}
.r86[data-act=visor] .neck{animation:r86-stretch 2s ease-in-out}
.r86[data-act=visor] .ant{animation:r86-ant-lift 2s ease-in-out}
.r86[data-act=visor] .lens{animation:r86-peer 2s ease-in-out}
.r86[data-act=drive] .arm-l{animation:r86-drive-arm 1.8s ease-in-out}
.r86[data-act=drive] .fore-l{animation:r86-drive-fore 1.8s ease-in-out}
.r86[data-act=drive] .tip{animation:r86-twist 1.8s ease-in-out}
.r86[data-act=drive] .grip{animation:r86-turn 1.8s ease-in-out}
.r86[data-act=drive] .head{animation:r86-look-down 1.8s ease-in-out}
.r86[data-act=drive] .lens{animation:r86-glance-down 1.8s ease-in-out}
.r86[data-act=pinch] .arm-r{animation:r86-pinch-arm 1.6s ease-in-out}
.r86[data-act=pinch] .fore-r{animation:r86-pinch-fore 1.6s ease-in-out}
.r86[data-act=pinch] .jaw-l{animation:r86-jaw-l 1.6s ease-in-out}
.r86[data-act=pinch] .jaw-r{animation:r86-jaw-r 1.6s ease-in-out}
.r86[data-act=pinch] .chest{animation:r86-tug 1.6s ease-in-out}
.r86[data-act=roll] .bot{animation:r86-roll 1.8s ease-in-out}
.r86[data-act=roll] .chest{animation:r86-rock 1.8s ease-in-out}
.r86[data-act=roll] .arm-l,.r86[data-act=roll] .arm-r{animation:r86-lag 1.8s ease-in-out}
.r86[data-act=roll] .ant{animation:r86-ant-roll 1.8s ease-in-out}
.r86[data-act=tilt] .head{animation:r86-cock 1.6s ease-in-out}
.r86[data-act=tilt] .lens{animation:r86-glance 1.6s ease-in-out}
.r86[data-act=tilt] .ant{animation:r86-ant-tilt 1.6s ease-in-out}
.r86[data-act=blink] .lens{animation:r86-blink .4s ease-in-out}
/* the neck stretches 1/12 per unit the head lifts, so it stays tucked under the head */
@keyframes r86-flip{0%,8%,84%,100%{transform:none}28%{transform:scaleY(-.62)}36%,66%{transform:scaleY(-.54)}91%{transform:scaleY(.9)}}
@keyframes r86-lift{0%,12%,100%{transform:none}34%{transform:translateY(-8px) rotate(0deg)}48%{transform:translateY(-8px) rotate(-4deg)}62%{transform:translateY(-8px) rotate(3deg)}78%{transform:translateY(0) rotate(0deg)}}
@keyframes r86-stretch{0%,12%,100%{transform:none}34%,62%{transform:scaleY(1.667)}78%{transform:scaleY(1)}}
@keyframes r86-peer{0%,30%,76%,100%{transform:none}42%,50%{transform:translateX(-5px)}58%,66%{transform:translateX(5px)}}
@keyframes r86-ant-lift{0%,100%{transform:none}36%{transform:rotate(7deg)}50%{transform:rotate(-8deg)}64%{transform:rotate(9deg)}80%{transform:rotate(-5deg)}92%{transform:rotate(2deg)}}
@keyframes r86-drive-arm{0%,100%{transform:none}12%{transform:rotate(3deg)}32%,70%{transform:rotate(-5deg)}86%{transform:rotate(1.5deg)}}
@keyframes r86-drive-fore{0%,100%{transform:none}12%{transform:rotate(5deg)}32%{transform:rotate(-21.5deg)}42%{transform:rotate(-19.5deg)}52%{transform:rotate(-21.5deg)}62%{transform:rotate(-19.5deg)}70%{transform:rotate(-21.5deg)}88%{transform:rotate(3deg)}}
@keyframes r86-twist{0%,32%,46%,60%,100%{transform:none}39%,53%{transform:scaleX(.3)}}
@keyframes r86-turn{0%,32%,46%,60%,100%{transform:none}39%,53%{transform:translateX(-12px)}}
@keyframes r86-look-down{0%,100%{transform:none}28%,72%{transform:translateY(3px) rotate(-3deg)}}
@keyframes r86-glance-down{0%,100%{transform:none}26%,74%{transform:translate(-5px,3px)}}
@keyframes r86-pinch-arm{0%,100%{transform:none}24%,48%{transform:rotate(6deg)}62%{transform:rotate(-4deg)}82%{transform:rotate(1.5deg)}}
@keyframes r86-pinch-fore{0%,100%{transform:none}24%,48%{transform:rotate(16deg)}62%{transform:rotate(-6deg)}82%{transform:rotate(2deg)}}
@keyframes r86-jaw-l{0%,14%,46%,100%{transform:none}28%,36%{transform:rotate(14deg)}}
@keyframes r86-jaw-r{0%,14%,46%,100%{transform:none}28%,36%{transform:rotate(-14deg)}}
@keyframes r86-tug{0%,48%,100%{transform:none}62%{transform:rotate(1.2deg)}80%{transform:rotate(-.5deg)}}
@keyframes r86-roll{0%,100%{transform:none}26%{transform:translateX(-7px)}56%{transform:translateX(4px)}80%{transform:translateX(-1.5px)}}
@keyframes r86-rock{0%,100%{transform:none}20%{transform:rotate(1.2deg)}48%{transform:rotate(-1deg)}74%{transform:rotate(.4deg)}}
@keyframes r86-lag{0%,100%{transform:none}24%{transform:rotate(-4deg)}52%{transform:rotate(3deg)}78%{transform:rotate(-1deg)}}
@keyframes r86-ant-roll{0%,100%{transform:none}24%{transform:rotate(12deg)}52%{transform:rotate(-9deg)}78%{transform:rotate(3deg)}}
@keyframes r86-cock{0%,100%{transform:none}24%,52%{transform:rotate(-6deg)}78%{transform:rotate(1.5deg)}}
@keyframes r86-glance{0%,100%{transform:none}18%,56%{transform:translateX(-5px)}}
@keyframes r86-ant-tilt{0%,100%{transform:none}30%{transform:rotate(-10deg)}56%{transform:rotate(5deg)}80%{transform:rotate(-2deg)}}
@keyframes r86-blink{0%,100%{transform:none}45%,55%{transform:scaleY(.1)}}
</style>
  <title id="tinker-title">Tinker — repair robot</title>
  <desc id="tinker-desc">A seafoam repair robot with a magnifier visor flipped down over its eyes from a headband with hinge knobs at the temples, a tall rolling tool chest body with a lid and five drawers with slate handles, four caster wheels, and tool arms ending in a screwdriver and needle nose pliers.</desc>
