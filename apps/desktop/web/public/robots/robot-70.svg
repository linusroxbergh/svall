<svg width="260" height="422" viewBox="134 56 260 422" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pump-title pump-desc" class="r70" data-idle="blink blink slosh slosh tally" data-work="pour pour twist tally slosh blink"><style>
.r70[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r70-blink .4s ease-in-out}
.r70[data-act=pour] .body{animation:r70-lean 2s ease-in-out}
.r70[data-act=pour] .hose{animation:r70-lift 2s ease-in-out}
.r70[data-act=pour] .nozzle{animation:r70-tip 2s ease-in-out}
.r70[data-act=pour] .arm{animation:r70-brace 2s ease-in-out}
.r70[data-act=pour] .fore{animation:r70-brace-fore 2s ease-in-out}
.r70[data-act=pour] .head{animation:r70-watch 2s ease-in-out}
.r70[data-act=pour] .eyes{animation:r70-watch-eyes 2s ease-in-out}
.r70[data-act=slosh] .body{animation:r70-sway 1.6s ease-in-out}
.r70[data-act=slosh] .head{animation:r70-slosh 1.6s ease-in-out}
.r70[data-act=slosh] .face{animation:r70-slide 1.6s ease-in-out}
.r70[data-act=slosh] .hose,.r70[data-act=slosh] .arm{animation:r70-trail 1.6s ease-in-out}
.r70[data-act=tally] .head{animation:r70-dip 1.6s ease-in-out}
.r70[data-act=tally] .arm{animation:r70-reach 1.6s ease-in-out}
.r70[data-act=tally] .fore{animation:r70-tap 1.6s ease-in-out}
.r70[data-act=tally] .face{animation:r70-down 1.6s ease-in-out}
.r70[data-act=tally] .d1,.r70[data-act=tally] .d2,.r70[data-act=tally] .d3,.r70[data-act=tally] .d4{transform-box:fill-box;transform-origin:center}
.r70[data-act=tally] .d4{animation:r70-flip .3s ease-in-out .4s}
.r70[data-act=tally] .d3{animation:r70-flip .3s ease-in-out .52s}
.r70[data-act=tally] .d2{animation:r70-flip .3s ease-in-out .64s}
.r70[data-act=tally] .d1{animation:r70-flip .3s ease-in-out .76s}
.r70[data-act=twist] .body{animation:r70-counter 1.6s ease-in-out}
.r70[data-act=twist] .arm{animation:r70-raise 1.6s ease-in-out}
.r70[data-act=twist] .fore{animation:r70-curl 1.6s ease-in-out}
.r70[data-act=twist] .pincer{animation:r70-turn 1.6s ease-in-out}
.r70[data-act=twist] .head{animation:r70-heed 1.6s ease-in-out}
.r70[data-act=twist] .eyes{animation:r70-heed-eyes 1.6s ease-in-out}
/* body turns on the right foot's outer edge; a lean left adds translate(0, 120 × sin angle) to stand on the left foot's */
@keyframes r70-blink{0%,100%{transform:none}45%,55%{transform:scaleY(.1)}}
@keyframes r70-lean{0%,100%{transform:none}36%,64%{transform:translate(0,0) rotate(1deg)}82%{transform:translate(0,-.63px) rotate(-.3deg)}92%{transform:translate(0,0) rotate(.1deg)}}
@keyframes r70-lift{0%,100%{transform:none}10%{transform:rotate(4deg)}34%{transform:rotate(-24deg)}48%,64%{transform:rotate(-20deg)}80%{transform:rotate(5deg)}91%{transform:rotate(-1.8deg)}}
@keyframes r70-tip{0%,100%{transform:none}10%{transform:rotate(-3deg)}34%{transform:rotate(22deg)}50%,64%{transform:rotate(38deg)}80%{transform:rotate(-8deg)}91%{transform:rotate(3deg)}}
@keyframes r70-brace{0%,100%{transform:none}38%,64%{transform:rotate(6deg)}82%{transform:rotate(-2deg)}92%{transform:rotate(.6deg)}}
@keyframes r70-brace-fore{0%,100%{transform:none}44%,64%{transform:rotate(5deg)}86%{transform:rotate(-2.5deg)}}
@keyframes r70-watch{0%,100%{transform:none}30%,66%{transform:rotate(4deg)}84%{transform:rotate(-1.5deg)}}
@keyframes r70-watch-eyes{0%,100%{transform:none}26%,68%{transform:translate(6px,3px)}}
@keyframes r70-sway{0%,100%{transform:none}18%{transform:translate(0,0) rotate(.7deg)}44%{transform:translate(0,-1.26px) rotate(-.6deg)}66%{transform:translate(0,0) rotate(.3deg)}84%{transform:translate(0,-.21px) rotate(-.1deg)}}
@keyframes r70-slosh{0%,100%{transform:none}22%{transform:rotate(-5deg)}48%{transform:rotate(5deg)}70%{transform:rotate(-2.5deg)}88%{transform:rotate(1deg)}}
@keyframes r70-slide{0%,100%{transform:none}26%{transform:translateX(5px)}52%{transform:translateX(-5px)}74%{transform:translateX(2.5px)}90%{transform:translateX(-1px)}}
@keyframes r70-trail{0%,100%{transform:none}24%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}72%{transform:rotate(-1.5deg)}88%{transform:rotate(.5deg)}}
@keyframes r70-dip{0%,100%{transform:none}22%,74%{transform:translateY(4px)}}
@keyframes r70-down{0%,100%{transform:none}18%,78%{transform:translateY(7px)}}
@keyframes r70-reach{0%,100%{transform:none}22%,74%{transform:rotate(-3deg)}88%{transform:rotate(1deg)}}
@keyframes r70-tap{0%,100%{transform:none}26%{transform:rotate(-8deg)}34%{transform:rotate(-2deg)}42%{transform:rotate(-8deg)}50%{transform:rotate(-2deg)}58%,72%{transform:rotate(-8deg)}86%{transform:rotate(2deg)}}
@keyframes r70-flip{0%,100%{transform:none}50%{transform:scaleY(.1)}}
@keyframes r70-counter{0%,100%{transform:none}30%,70%{transform:translate(0,0) rotate(.25deg)}86%{transform:translate(0,-.13px) rotate(-.06deg)}}
@keyframes r70-raise{0%,100%{transform:none}24%,70%{transform:rotate(18deg)}86%{transform:rotate(-3deg)}94%{transform:rotate(1deg)}}
@keyframes r70-curl{0%,100%{transform:none}32%,70%{transform:rotate(-38deg)}88%{transform:rotate(6deg)}}
@keyframes r70-turn{0%,36%,100%{transform:none}44%{transform:rotate(18deg)}54%{transform:rotate(-14deg)}64%{transform:rotate(14deg)}74%{transform:rotate(-4deg)}84%{transform:rotate(0deg)}}
@keyframes r70-heed{0%,100%{transform:none}22%,72%{transform:rotate(-5deg)}}
@keyframes r70-heed-eyes{0%,100%{transform:none}20%,74%{transform:translate(-7px,3px)}}
</style>
  <title id="pump-title">Pump — petrol pump robot</title>
  <desc id="pump-desc">An emerald robot whose body is a vintage petrol pump cabinet with a number window, whose head is a round green glass globe with two eyes on a band inside, with a ribbed hose arm ending in a nozzle, a ring jointed arm with a pincer, and short legs on flat feet.</desc>
