  <title id="pump-title">Pump — petrol pump robot</title>
  <desc id="pump-desc">An emerald robot whose body is a vintage petrol pump cabinet with a number window, whose head is a round green glass globe with two eyes on a band inside, with a ribbed hose arm ending in a nozzle, a ring jointed arm with a pincer, and short legs on flat feet.</desc>
