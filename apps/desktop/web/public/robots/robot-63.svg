    <rect x="198" y="346" width="116" height="50" rx="10" fill="#3d4853"/>
    <path d="M212 358h88m-88 12h88m-88 12h88" stroke="#697785" stroke-width="5" stroke-linecap="round"/>
  </g>
  </g>
</svg>
