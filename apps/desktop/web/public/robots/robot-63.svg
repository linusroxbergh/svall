    <path class="gleam" d="M262.65 214.7A32 32 0 0 1 279.78 224.59L264.92 237.97A12 12 0 0 0 258.49 234.26ZM249.35 277.3A32 32 0 0 1 232.22 267.41L247.08 254.03A12 12 0 0 0 253.51 257.74Z" fill="#262d36"/>
    <circle cx="256" cy="246" r="26" fill="none" stroke="#3d4853" stroke-width="2"/>
    <circle cx="256" cy="246" r="18" fill="none" stroke="#3d4853" stroke-width="2"/>
    <circle cx="256" cy="246" r="10" fill="#f6c354"/>
    <circle cx="256" cy="246" r="3" fill="#3d4853"/>
