<svg width="292" height="412" viewBox="110 66 292 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jukebox-title jukebox-desc">
  <title id="jukebox-title">Jukebox — record player robot</title>
  <desc id="jukebox-desc">A cherry robot built as an arched jukebox, with two round eyes in a band under the arch, yellow and cyan light tubes around a window showing a record, a row of selector buttons, a speaker grille, short ring jointed arms with pincers and short legs on round feet.</desc>
