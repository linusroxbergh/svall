<svg width="322" height="452" viewBox="128 24 322 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crane-title crane-desc" class="r78" data-idle="blink blink tilt tilt pump" data-work="hoist hoist grab grab pump blink"><style>
