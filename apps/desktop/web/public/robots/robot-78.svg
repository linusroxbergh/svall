.r78[data-act=grab] .eyes{animation:r78-down 2s ease-in-out}
.r78[data-act=grab] .body{animation:r78-grab-body 2s ease-in-out}
.r78[data-act=grab] .boom{animation:r78-grab-boom 2s ease-in-out}
