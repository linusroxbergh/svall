<svg width="322" height="452" viewBox="128 24 322 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crane-title crane-desc">
  <title id="crane-title">Crane — crane arm robot</title>
  <desc id="crane-desc">An orange tin-toy robot with a square head, two eyes on a slate band and an antenna knob, a boxy body with a dial and three levers, a short piston arm with a pincer on one side and a lattice crane boom with a cable and a three prong grab claw on the other, standing on two legs with ring knees and orange shoes.</desc>
