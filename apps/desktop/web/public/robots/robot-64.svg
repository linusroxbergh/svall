<svg width="260" height="428" viewBox="126 52 260 428" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="atomic-title atomic-desc" class="r64" data-idle="blink blink tilt tilt orbit salute" data-work="fold fold orbit salute salute blink"><style>
.r64[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r64-blink .4s ease-in-out}
.r64[data-act=tilt] .head{animation:r64-tilt 1.5s ease-in-out}
.r64[data-act=tilt] .eyes{animation:r64-look 1.5s ease-in-out}
.r64[data-act=orbit] .orbit{animation:r64-orbit 1.8s cubic-bezier(.45,0,.25,1)}
.r64[data-act=orbit] .core{animation:r64-glow 1.8s ease-in-out}
.r64[data-act=orbit] .head{animation:r64-nod 1.8s ease-in-out}
.r64[data-act=orbit] .eyes{animation:r64-down 1.8s ease-in-out}
.r64[data-act=orbit] .arm-l{animation:r64-flare-l 1.8s ease-in-out}
.r64[data-act=orbit] .fore-l{animation:r64-flare-fl 1.8s ease-in-out}
.r64[data-act=orbit] .arm-r{animation:r64-flare-r 1.8s ease-in-out}
.r64[data-act=orbit] .fore-r{animation:r64-flare-fr 1.8s ease-in-out}
.r64[data-act=fold] .arm-l{animation:r64-fold-l 1.8s ease-in-out}
.r64[data-act=fold] .fore-l{animation:r64-fold-fl 1.8s ease-in-out}
.r64[data-act=fold] .arm-r{animation:r64-fold-r 1.8s ease-in-out}
.r64[data-act=fold] .fore-r{animation:r64-fold-fr 1.8s ease-in-out}
.r64[data-act=salute] .arm-l{animation:r64-salute 2s ease-in-out}
.r64[data-act=salute] .fore-l{animation:r64-salute-f 2s ease-in-out}
.r64[data-act=salute] .head{animation:r64-proud 2s ease-in-out}
.r64[data-act=salute] .eyes{animation:r64-up 2s ease-in-out}
.r64[data-act=salute] .arm-r{animation:r64-attention 2s ease-in-out}
.r64[data-act=salute] .fore-r{animation:r64-attention-f 2s ease-in-out}
@keyframes r64-blink{0%,100%{transform:none}40%,55%{transform:scaleY(.1)}}
@keyframes r64-tilt{0%,100%{transform:none}24%,58%{transform:rotate(-6deg)}80%{transform:rotate(1.5deg)}}
@keyframes r64-look{0%,100%{transform:none}18%,64%{transform:translateX(-5px)}}
@keyframes r64-orbit{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes r64-glow{0%,100%{fill:#f6c354}30%,70%{fill:#fbe3a0}}
@keyframes r64-nod{0%,100%{transform:none}22%,72%{transform:translateY(5px)}88%{transform:translateY(-1px)}}
@keyframes r64-down{0%,100%{transform:none}16%,76%{transform:translateY(3px)}}
@keyframes r64-flare-l{0%,100%{transform:none}28%,62%{transform:rotate(6deg)}80%{transform:rotate(-2deg)}92%{transform:rotate(.6deg)}}
@keyframes r64-flare-fl{0%,100%{transform:none}30%{transform:rotate(-5deg)}50%,64%{transform:rotate(-2deg)}84%{transform:rotate(3deg)}95%{transform:rotate(-1deg)}}
@keyframes r64-flare-r{0%,5%,100%{transform:none}33%,67%{transform:rotate(-6deg)}85%{transform:rotate(2deg)}96%{transform:rotate(-.6deg)}}
@keyframes r64-flare-fr{0%,5%,100%{transform:none}35%{transform:rotate(5deg)}55%,69%{transform:rotate(2deg)}88%{transform:rotate(-3deg)}97%{transform:rotate(1deg)}}
@keyframes r64-fold-l{0%,100%{transform:none}28%,60%{transform:rotate(-16deg)}76%{transform:rotate(3deg)}88%{transform:rotate(-1deg)}}
@keyframes r64-fold-fl{0%,6%,100%{transform:none}34%{transform:rotate(-52deg)}42%,62%{transform:rotate(-48deg)}80%{transform:rotate(5deg)}92%{transform:rotate(-2deg)}}
@keyframes r64-fold-r{0%,5%,100%{transform:none}33%,65%{transform:rotate(16deg)}80%{transform:rotate(-3deg)}92%{transform:rotate(1deg)}}
@keyframes r64-fold-fr{0%,11%,100%{transform:none}39%{transform:rotate(52deg)}47%,67%{transform:rotate(48deg)}84%{transform:rotate(-5deg)}95%{transform:rotate(2deg)}}
@keyframes r64-salute{0%,100%{transform:none}6%{transform:rotate(-4deg)}24%{transform:rotate(122deg)}33%,60%{transform:rotate(118deg)}78%{transform:rotate(-8deg)}89%{transform:rotate(3deg)}96%{transform:rotate(-1deg)}}
@keyframes r64-salute-f{0%,6%,100%{transform:none}24%{transform:rotate(-142deg)}37%{transform:rotate(-265deg)}46%,60%{transform:rotate(-255deg)}80%{transform:rotate(22deg)}91%{transform:rotate(-9deg)}97%{transform:rotate(3deg)}}
@keyframes r64-attention{0%,6%,100%{transform:none}24%{transform:rotate(10deg)}33%,60%{transform:rotate(8deg)}78%{transform:rotate(-2deg)}89%{transform:rotate(.5deg)}}
@keyframes r64-attention-f{0%,11%,100%{transform:none}31%{transform:rotate(5deg)}40%,63%{transform:rotate(3deg)}82%{transform:rotate(-2deg)}93%{transform:rotate(.5deg)}}
@keyframes r64-proud{0%,35%,100%{transform:none}48%,62%{transform:translateY(-3px)}}
@keyframes r64-up{0%,35%,100%{transform:none}48%,62%{transform:translateY(-2px)}}
</style>
  <title id="atomic-title">Atomic — space age robot</title>
  <desc id="atomic-desc">A turquoise 1950s space age robot with a finned bullet head, a chrome stripe and two round eyes on a slate band, an atom emblem on its rounded chest, ring jointed arms with pincers and legs on swept fin feet.</desc>
