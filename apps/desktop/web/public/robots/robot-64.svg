    <ellipse cx="256" cy="276" rx="27" ry="9"/>
    <ellipse cx="256" cy="276" rx="27" ry="9" transform="rotate(60 256 276)"/>
    <ellipse cx="256" cy="276" rx="27" ry="9" transform="rotate(-60 256 276)"/>
  </g>
  <circle class="core" cx="256" cy="276" r="7" fill="#f6c354"/>
