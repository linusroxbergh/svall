  <circle cx="278" cy="119" r="12" fill="#79d6eb"/>
  <path d="M241.6 109.8a12 12 0 0 1-9.8 21a12 12 0 0 0 9.8-21Zm44 0a12 12 0 0 1-9.8 21a12 12 0 0 0 9.8-21Z" fill="#4fb0c5"/>
  <circle cx="237.5" cy="114.5" r="3.8" fill="#fffae0"/>
  <circle cx="281.5" cy="114.5" r="3.8" fill="#fffae0"/>
  </g>
  </g>
</svg>
