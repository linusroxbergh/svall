<svg width="308" height="450" viewBox="102 26 308 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="capsule-title capsule-desc" class="r87" data-idle="blink blink bank bank tuck wave" data-work="boost boost wave bank tuck blink"><style>
.r87[data-act=boost] .pod{animation:r87-lift 2s ease-in-out}
.r87[data-act=boost] .flame{animation:r87-thrust 2s ease-in-out}
.r87[data-act=boost] .arm-l{animation:r87-trail-l 2s ease-in-out}
.r87[data-act=boost] .arm-r{animation:r87-trail-r 2s ease-in-out}
.r87[data-act=boost] .fore-l{animation:r87-lag-l 2s ease-in-out}
.r87[data-act=boost] .fore-r{animation:r87-lag-r 2s ease-in-out}
.r87[data-act=bank] .pod{animation:r87-bank 2s ease-in-out}
.r87[data-act=bank] .flame{animation:r87-lean 2s ease-in-out}
.r87[data-act=bank] .arm-l,.r87[data-act=bank] .arm-r{animation:r87-hang 2s ease-in-out}
.r87[data-act=bank] .fore-l,.r87[data-act=bank] .fore-r{animation:r87-hang-fore 2s ease-in-out}
.r87[data-act=bank] .eyes{animation:r87-look 2s ease-in-out}
.r87[data-act=wave] .pod{animation:r87-counter 2.2s ease-in-out}
.r87[data-act=wave] .arm-r{animation:r87-raise 2.2s ease-in-out}
.r87[data-act=wave] .fore-r{animation:r87-wave 2.2s ease-in-out}
.r87[data-act=wave] .eyes{animation:r87-glance 2.2s ease-in-out}
.r87[data-act=tuck] .arm-l{animation:r87-tuck-l 1.8s ease-in-out}
.r87[data-act=tuck] .arm-r{animation:r87-tuck-r 1.8s ease-in-out}
.r87[data-act=tuck] .fore-l{animation:r87-fold-l 1.8s ease-in-out}
.r87[data-act=tuck] .fore-r{animation:r87-fold-r 1.8s ease-in-out}
.r87[data-act=tuck] .eyes{animation:r87-down 1.8s ease-in-out}
.r87[data-act=tuck] .lamp{animation:r87-glow 1.8s ease-in-out}
.r87[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r87-blink .45s ease-in-out}
@keyframes r87-lift{0%,100%{transform:none}12%{transform:translateY(3px)}38%{transform:translateY(-9px)}50%{transform:translateY(-8px)}70%{transform:translateY(2px)}86%{transform:translateY(-.8px)}}
@keyframes r87-thrust{0%,100%{transform:none}12%{transform:scale(1,.82)}30%{transform:scale(.9,1.55)}42%{transform:scale(.94,1.32)}54%{transform:scale(1,.82)}68%{transform:scale(.97,1.2)}84%{transform:scale(1,.94)}}
@keyframes r87-trail-l{0%,100%{transform:none}12%{transform:rotate(5deg)}32%{transform:rotate(-7deg)}52%{transform:rotate(7deg)}72%{transform:rotate(-4deg)}88%{transform:rotate(1.5deg)}}
@keyframes r87-trail-r{0%,100%{transform:none}12%{transform:rotate(-5deg)}32%{transform:rotate(7deg)}52%{transform:rotate(-7deg)}72%{transform:rotate(4deg)}88%{transform:rotate(-1.5deg)}}
@keyframes r87-lag-l{0%,100%{transform:none}16%{transform:rotate(5deg)}36%{transform:rotate(-9deg)}56%{transform:rotate(8deg)}76%{transform:rotate(-5deg)}90%{transform:rotate(1.5deg)}}
@keyframes r87-lag-r{0%,100%{transform:none}16%{transform:rotate(-5deg)}36%{transform:rotate(9deg)}56%{transform:rotate(-8deg)}76%{transform:rotate(5deg)}90%{transform:rotate(-1.5deg)}}
@keyframes r87-bank{0%,100%{transform:none}26%{transform:translate(2.5px) rotate(2deg)}56%{transform:translate(-1.8px) rotate(-1.4deg)}80%{transform:translate(.6px) rotate(.5deg)}}
@keyframes r87-lean{0%,100%{transform:none}30%{transform:skewX(-10deg) scaleY(1.12)}60%{transform:skewX(7deg) scaleY(1.06)}84%{transform:skewX(-2.5deg) scaleY(1)}}
@keyframes r87-hang{0%,100%{transform:none}30%{transform:rotate(-5deg)}60%{transform:rotate(4deg)}84%{transform:rotate(-1.5deg)}}
@keyframes r87-hang-fore{0%,100%{transform:none}36%{transform:rotate(-6deg)}66%{transform:rotate(5deg)}88%{transform:rotate(-1.5deg)}}
@keyframes r87-look{0%,100%{transform:none}24%,40%{transform:translateX(6px)}62%{transform:translateX(-4px)}84%{transform:translateX(1px)}}
@keyframes r87-counter{0%,100%{transform:none}24%,70%{transform:rotate(-2deg)}88%{transform:rotate(.6deg)}}
@keyframes r87-raise{0%,100%{transform:none}22%{transform:rotate(-58deg)}46%{transform:rotate(-55deg)}70%{transform:rotate(-58deg)}88%{transform:rotate(4deg)}95%{transform:rotate(-1deg)}}
@keyframes r87-wave{0%,6%,100%{transform:none}26%{transform:rotate(-100deg)}38%{transform:rotate(-87deg)}50%{transform:rotate(-113deg)}62%{transform:rotate(-88deg)}72%{transform:rotate(-104deg)}90%{transform:rotate(6deg)}96%{transform:rotate(-1.5deg)}}
@keyframes r87-glance{0%,86%,100%{transform:none}20%,72%{transform:translate(6px,-3px)}}
@keyframes r87-tuck-l{0%,100%{transform:none}30%,62%{transform:rotate(-14deg)}80%{transform:rotate(3deg)}92%{transform:rotate(-1deg)}}
@keyframes r87-tuck-r{0%,6%,100%{transform:none}36%,66%{transform:rotate(14deg)}84%{transform:rotate(-3deg)}95%{transform:rotate(1deg)}}
@keyframes r87-fold-l{0%,8%,100%{transform:none}34%,60%{transform:rotate(-24deg)}82%{transform:rotate(4deg)}94%{transform:rotate(-1deg)}}
@keyframes r87-fold-r{0%,14%,100%{transform:none}40%,64%{transform:rotate(24deg)}86%{transform:rotate(-4deg)}96%{transform:rotate(1deg)}}
@keyframes r87-down{0%,84%,100%{transform:none}24%,66%{transform:translateY(5px)}}
@keyframes r87-glow{0%,100%{fill:#f6c354}34%,62%{fill:#fadb98}}
@keyframes r87-blink{0%,100%{transform:none}40%,55%{transform:scaleY(.1)}}
</style>
  <title id="capsule-title">Capsule — jet capsule robot</title>
  <desc id="capsule-desc">A plum capsule robot shaped like a tall rounded pod, with a teal visor across its upper body holding two eyes on a slate band, three vent lines and a panel of lights on its front, short jointed arms with plum cuffs and two finger grippers at its sides, and a flared collar over a jet nozzle that keeps it floating on three flat yellow flames.</desc>
  <g class="pod" style="transform-origin:256px 230px">
  <!-- Jointed arms with grippers -->
  <g class="arm-l" style="transform-origin:180px 222px">
    <path d="M180 222 136 248" fill="none" stroke="#697785" stroke-width="12" stroke-linejoin="round"/>
    <g class="fore-l" style="transform-origin:136px 248px">
      <path d="M136 248 122 306" fill="none" stroke="#697785" stroke-width="12" stroke-linejoin="round"/>
      <path d="M113 320q-11 20 3 36m15-36q11 20-3 36" fill="none" stroke="#3d4853" stroke-width="8" stroke-linecap="round"/>
      <rect x="108" y="304" width="28" height="18" rx="5" fill="#7e4a5f"/>
    </g>
    <circle cx="136" cy="248" r="13" fill="#3d4853"/>
    <circle cx="136" cy="248" r="5.5" fill="#92a1b2"/>
  </g>
  <g class="arm-r" style="transform-origin:332px 222px">
    <path d="M332 222 376 248" fill="none" stroke="#697785" stroke-width="12" stroke-linejoin="round"/>
    <g class="fore-r" style="transform-origin:376px 248px">
      <path d="M376 248 390 306" fill="none" stroke="#697785" stroke-width="12" stroke-linejoin="round"/>
      <path d="M381 320q-11 20 3 36m15-36q11 20-3 36" fill="none" stroke="#3d4853" stroke-width="8" stroke-linecap="round"/>
      <rect x="376" y="304" width="28" height="18" rx="5" fill="#7e4a5f"/>
    </g>
    <circle cx="376" cy="248" r="13" fill="#3d4853"/>
    <circle cx="376" cy="248" r="5.5" fill="#92a1b2"/>
  </g>
  <!-- Jet flames under the nozzle -->
  <g class="flame" style="transform-origin:256px 422px">
  <path d="M243 422h26q0 24-13 54-13-30-13-54Z" fill="#f6c354"/>
  <path d="M250 422h12q0 14-6 32-6-18-6-32Z" fill="#fff8de"/>
  <path d="M221 422h18q0 16-9 36-9-20-9-36Zm52 0h18q0 16-9 36-9-20-9-36Z" fill="#f6c354"/>
  </g>
  <!-- Capsule body -->
  <path d="M256 26q80 0 80 80v178c0 46-36 72-80 72s-80-26-80-72V106q0-80 80-80Z" fill="#7e4a5f"/>
  <path d="M311 50q25 24 25 56v178c0 46-36 72-80 72 34-8 57-32 57-72V106q0-29-2-56Z" fill="#623145"/>
  <path d="M191 60q22-34 65-34t65 34Z" fill="#b27a8f"/>
  <!-- Flared collar and nozzle -->
  <path d="M206 364h100l-12 44h-76Z" fill="#7e4a5f"/>
  <path d="M290 364h16l-12 44h-14Z" fill="#623145"/>
  <rect x="194" y="348" width="124" height="20" rx="10" fill="#b27a8f"/>
  <path d="M300 348h8q10 0 10 10t-10 10h-8Z" fill="#7e4a5f"/>
  <rect x="216" y="404" width="80" height="18" rx="5" fill="#3d4853"/>
  <path d="M226 413h60" stroke="#697785" stroke-width="4" stroke-linecap="round"/>
  <!-- Shoulder joints -->
  <circle cx="180" cy="222" r="15" fill="#3d4853"/>
  <circle cx="332" cy="222" r="15" fill="#3d4853"/>
  <circle cx="180" cy="222" r="6.5" fill="#92a1b2"/>
  <circle cx="332" cy="222" r="6.5" fill="#92a1b2"/>
  <!-- Vent lines -->
  <path d="M216 178h80m-80 16h80m-80 16h80" stroke="#b27a8f" stroke-width="7" stroke-linecap="round"/>
  <!-- Chest panel of lights -->
  <rect x="214" y="238" width="84" height="40" rx="8" fill="#3d4853"/>
  <circle class="lamp" cx="236" cy="258" r="7" fill="#f6c354"/>
  <circle cx="258" cy="258" r="7" fill="#697785"/>
  <circle cx="258" cy="258" r="3" fill="#92a1b2"/>
  <circle cx="279" cy="258" r="6" fill="#b27a8f"/>
  <!-- Teal visor with eyes on a slate band -->
  <rect x="184" y="90" width="144" height="58" rx="14" fill="#4fb0c5"/>
  <path d="M310 90h4q14 0 14 14v30q0 14-14 14h-4Z" fill="#2e7a8a"/>
  <rect x="198" y="101" width="116" height="36" rx="18" fill="#3d4853"/>
  <g class="eyes">
