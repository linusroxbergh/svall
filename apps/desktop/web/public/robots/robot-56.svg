<svg width="212" height="428" viewBox="150 50 212 428" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="valve-title valve-desc" class="r56" data-idle="blink blink shift shrug tap" data-work="twist twist jolt jolt shift tap"><style>
.r56[data-act=blink] .eyes{transform-box:fill-box;transform-origin:center;animation:r56-blink .4s ease-in-out}
.r56[data-act=shift] .bot{animation:r56-rock-r 1.9s ease-in-out}
.r56[data-act=shift] .bot2{animation:r56-rock-l 1.9s ease-in-out}
.r56[data-act=shift] .arm-l,.r56[data-act=shift] .arm-r{animation:r56-hang 1.9s ease-in-out}
.r56[data-act=shift] .fore-l,.r56[data-act=shift] .fore-r{animation:r56-hang2 1.9s ease-in-out}
.r56[data-act=shift] .head{animation:r56-lag-l 1.9s ease-in-out}
.r56[data-act=shift] .tube{animation:r56-lag-r 1.9s ease-in-out}
.r56[data-act=shrug] .arm-l{animation:r56-shrug-l 1.5s ease-in-out}
.r56[data-act=shrug] .arm-r{animation:r56-shrug-r 1.5s ease-in-out}
.r56[data-act=shrug] .fore-l{animation:r56-palm-l 1.5s ease-in-out}
.r56[data-act=shrug] .fore-r{animation:r56-palm-r 1.5s ease-in-out}
.r56[data-act=shrug] .pl1,.r56[data-act=shrug] .pr1{animation:r56-open1 1.5s ease-in-out}
.r56[data-act=shrug] .pl2,.r56[data-act=shrug] .pr2{animation:r56-open2 1.5s ease-in-out}
.r56[data-act=shrug] .head{animation:r56-duck 1.5s ease-in-out}
.r56[data-act=tap] .arm-l{animation:r56-raise 2s ease-in-out}
.r56[data-act=tap] .fore-l{animation:r56-tap 2s ease-in-out}
.r56[data-act=tap] .tube{animation:r56-tapped 2s ease-in-out}
.r56[data-act=tap] .eyes{animation:r56-glance 2s ease-in-out}
.r56[data-act=twist] .arm-r{animation:r56-reach 2s ease-in-out}
.r56[data-act=twist] .fore-r{animation:r56-cross 2s ease-in-out}
.r56[data-act=twist] .hand-r{animation:r56-turn 2s ease-in-out}
.r56[data-act=twist] .pr1{animation:r56-grip1 2s ease-in-out}
.r56[data-act=twist] .pr2{animation:r56-grip2 2s ease-in-out}
.r56[data-act=twist] .needle{animation:r56-needle 2s ease-in-out}
.r56[data-act=twist] .head{animation:r56-down 2s ease-in-out}
.r56[data-act=twist] .eyes{animation:r56-look 2s ease-in-out}
.r56[data-act=jolt] .bot{animation:r56-hop 1.8s ease-in-out}
.r56[data-act=jolt] .body{animation:r56-sink 1.8s ease-in-out}
.r56[data-act=jolt] .arm-l{animation:r56-fling-l 1.8s ease-in-out}
.r56[data-act=jolt] .arm-r{animation:r56-fling-r 1.8s ease-in-out}
.r56[data-act=jolt] .fore-l{animation:r56-flop-l 1.8s ease-in-out}
.r56[data-act=jolt] .fore-r{animation:r56-flop-r 1.8s ease-in-out}
.r56[data-act=jolt] .pl1,.r56[data-act=jolt] .pr1{animation:r56-gape1 1.8s ease-in-out}
.r56[data-act=jolt] .pl2,.r56[data-act=jolt] .pr2{animation:r56-gape2 1.8s ease-in-out}
.r56[data-act=jolt] .head{animation:r56-wob-l 1.8s ease-in-out}
.r56[data-act=jolt] .tube{animation:r56-wob-r 1.8s ease-in-out}
.r56[data-act=jolt] .eyes{transform-box:fill-box;transform-origin:center;animation:r56-wide 1.8s ease-in-out}
.r56[data-act=jolt] .fil{animation:r56-glow 1.8s ease-in-out}
.r56[data-act=shift] .jaws{animation:r56-hide 1.9s}
.r56[data-act=shift] .jaw{animation:r56-show 1.9s}
.r56[data-act=shrug] .jaws{animation:r56-hide 1.5s}
.r56[data-act=shrug] .jaw{animation:r56-show 1.5s}
.r56[data-act=jolt] .jaws{animation:r56-hide 1.8s}
.r56[data-act=jolt] .jaw{animation:r56-show 1.8s}
.r56[data-act=tap] .jaws,.r56[data-act=twist] .jaws{animation:r56-hide 2s}
.r56[data-act=tap] .jaw,.r56[data-act=twist] .jaw{animation:r56-show 2s}
/* the tube rocks on its pins: .head pivots on the base's left corner, .tube on its right; neither lifts past the base's 4-unit overlap of the pins */
/* .jaws keeps the still pincers as one path (Chromium antialiases them differently once split); each hand's .jaw stands in while an arm moves */
@keyframes r56-hide{0%,99.9%,100%{transform:none}.1%,99.8%{transform:scale(0)}}
@keyframes r56-show{0%,99.9%,100%{transform:scale(0)}.1%,99.8%{transform:none}}
