@keyframes r56-tap{0%,100%{transform:none}32%{transform:rotate(-230deg)}40%{transform:rotate(-222deg)}46%{transform:rotate(-230deg)}52%{transform:rotate(-222deg)}60%,66%{transform:rotate(-230deg)}86%{transform:rotate(6deg)}95%{transform:rotate(-2deg)}}
@keyframes r56-tapped{0%,38%,47%,60%,100%{transform:none}42%,54%{transform:rotate(1.4deg)}}
@keyframes r56-glance{0%,100%{transform:none}22%,70%{transform:translateX(-3px)}}
@keyframes r56-reach{0%,100%{transform:none}26%,68%{transform:rotate(11.6deg)}84%{transform:rotate(-2deg)}}
@keyframes r56-cross{0%,100%{transform:none}30%{transform:rotate(90deg)}38%,66%{transform:rotate(86deg)}86%{transform:rotate(-6deg)}94%{transform:rotate(2deg)}}
@keyframes r56-turn{0%,38%,66%,100%{transform:none}46%,56%{transform:rotate(-16deg)}}
@keyframes r56-grip1{0%,88%,100%{transform:none}18%,74%{transform:rotate(18deg)}32%,64%{transform:rotate(-3deg)}}
@keyframes r56-grip2{0%,88%,100%{transform:none}18%,74%{transform:rotate(-18deg)}32%,64%{transform:rotate(3deg)}}
@keyframes r56-needle{0%,40%,100%{transform:none}52%{transform:rotate(-78deg)}62%{transform:rotate(-64deg)}68%{transform:rotate(-68deg)}82%{transform:rotate(10deg)}92%{transform:rotate(-3deg)}}
@keyframes r56-down{0%,100%{transform:none}22%,72%{transform:translateY(3px)}86%{transform:translateY(-.8px)}}
@keyframes r56-look{0%,100%{transform:none}18%,74%{transform:translate(2px,3px)}}
@keyframes r56-hop{0%,5%{transform:none;animation-timing-function:ease-out}16%{transform:translateY(-5px);animation-timing-function:ease-in}28%,100%{transform:none}}
@keyframes r56-sink{0%,12%,28%,82%,100%{transform:none}5%{transform:translateY(2.5px)}38%{transform:translateY(6px)}54%{transform:translateY(-.5px)}68%{transform:translateY(1.6px)}}
@keyframes r56-fling-l{0%,88%,100%{transform:none}5%{transform:rotate(-4deg)}15%{transform:rotate(30deg)}26%{transform:rotate(25deg)}42%{transform:rotate(-7deg)}58%{transform:rotate(4deg)}74%{transform:rotate(-1.5deg)}}
@keyframes r56-fling-r{0%,88%,100%{transform:none}5%{transform:rotate(4deg)}15%{transform:rotate(-30deg)}26%{transform:rotate(-25deg)}42%{transform:rotate(7deg)}58%{transform:rotate(-4deg)}74%{transform:rotate(1.5deg)}}
