</style>
  <title id="valve-title">Valve — vacuum tube robot</title>
  <desc id="valve-desc">A slim burnt orange robot whose head is a tall glass vacuum tube on a pinned slate base, with a glowing filament grid and two small eyes inside the glass, a row of knobs and a meter on its chest, ring jointed arms with pincers and legs on round feet.</desc>
