@keyframes r56-wob-l{0%,90%,100%{transform:translateY(0) rotate(0)}10%,30%{transform:translateY(3px) rotate(0)}20%{transform:translateY(-1.5px) rotate(0)}40%{transform:translateY(1.5px) rotate(-3deg)}48%,62%{transform:translateY(1.5px) rotate(0)}72%{transform:translateY(1px) rotate(-1.2deg)}80%{transform:translateY(.6px) rotate(0)}}
@keyframes r56-wob-r{0%,48%,62%,80%,90%,100%{transform:none}55%{transform:rotate(2.4deg)}85%{transform:rotate(.6deg)}}
