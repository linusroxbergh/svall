@keyframes r56-palm-r{0%,100%{transform:none}30%,54%{transform:rotate(-18deg)}78%{transform:rotate(4deg)}92%{transform:rotate(-1deg)}}
@keyframes r56-open1{0%,80%,100%{transform:none}30%,56%{transform:rotate(20deg)}}
@keyframes r56-open2{0%,80%,100%{transform:none}30%,56%{transform:rotate(-20deg)}}
@keyframes r56-duck{0%,100%{transform:translateY(0) rotate(0)}26%,54%{transform:translateY(2px) rotate(-2.5deg)}76%{transform:translateY(-.5px) rotate(0)}}
