@keyframes r56-rock-r{0%,46%,74%,100%{transform:none}22%{transform:rotate(.7deg)}88%{transform:rotate(.2deg)}}
@keyframes r56-rock-l{0%,46%,74%,100%{transform:none}60%{transform:rotate(-.5deg)}}
@keyframes r56-hang{0%,100%{transform:none}28%{transform:rotate(-6deg)}64%{transform:rotate(4deg)}88%{transform:rotate(-1.5deg)}}
@keyframes r56-hang2{0%,100%{transform:none}34%{transform:rotate(-7deg)}70%{transform:rotate(5deg)}92%{transform:rotate(-2deg)}}
