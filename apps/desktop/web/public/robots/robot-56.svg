@keyframes r56-flop-r{0%,5%,92%,100%{transform:none}12%{transform:rotate(14deg)}22%{transform:rotate(-20deg)}34%{transform:rotate(-10deg)}48%{transform:rotate(12deg)}64%{transform:rotate(-6deg)}80%{transform:rotate(2deg)}}
@keyframes r56-gape1{0%,6%,54%,100%{transform:none}14%,30%{transform:rotate(24deg)}42%{transform:rotate(-5deg)}}
