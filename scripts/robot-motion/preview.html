<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot motion</title>
<style>
  :root{--grass:#71876C;--ink-land:#2C3B31;--working:#FFC95C;--idle:#7C8F9F;--band:#B4A175;--cream:#FFFDF4;--card-tint:#786844;
    --card-0:#F0E9D8;--card-1:#E6DCC5;--card-2:#D9CCAF;--shade-1:rgba(10,18,24,.25)}
  body{margin:0;background:#2A3A4C;color:#E9E4D6;font:14px/1.4 -apple-system,system-ui,sans-serif}
  main{max-width:1340px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:18px;margin:0 0 4px} p{margin:0 0 16px;color:#B9C2CC}
  h2{font-size:15px;margin:32px 0 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  label{font-size:13px;color:#B9C2CC}
  button{font:12px/1 -apple-system,system-ui,sans-serif;padding:5px 9px;border-radius:6px;border:1px solid #4a5d72;background:#33475c;color:#E9E4D6;cursor:pointer}
  button.w{border-color:#8a7440;background:#4d4430}
  .island{background:var(--grass);border-radius:28px;padding:20px 24px;display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end;justify-content:center}
  .lbl{font-size:12px;text-align:center;color:var(--ink-land);margin-top:6px;font-weight:600}
  .big{height:300px} .big svg{height:100%;width:auto;display:block}
  #robots svg{overflow:visible}
  .act{font:11px ui-monospace,monospace;color:var(--ink-land);text-align:center;height:14px}

  /* the app's robot card (map.css .tok.bot), one token unit at the map's usual scale */
  .tk{position:relative}
  .card{--tok:29.3px;--st:var(--idle);position:relative;width:calc(var(--tok)*2.56);height:calc(var(--tok)*3.66);border-radius:calc(var(--tok)*.21);
    display:flex;flex-direction:column;overflow:hidden;
    background:url('card-grain.png') 37px 61px/96px 96px,linear-gradient(var(--card-0) 0%,var(--card-1) 62%,var(--card-2) 100%);
    box-shadow:0 1px 0 color-mix(in srgb,var(--card-tint) 16%,transparent),0 1px 2px var(--shade-1)}
  .card::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:8;border-radius:inherit;
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cream) 46%,transparent),inset 0 calc(var(--tok)*.2) calc(var(--tok)*.24) calc(var(--tok)*-.12) var(--shade-1)}
  .card.x2{--tok:58.6px}
  .card.working{--st:var(--working)}
  .card .edge{flex:none;position:relative;z-index:7;height:calc(var(--tok)*.17);background:color-mix(in srgb,var(--st) 26%,var(--band))}
  .card .edge i{position:absolute;inset:0 auto 0 0;background:var(--st);box-shadow:1px 0 0 color-mix(in srgb,var(--cream) 70%,transparent)}
  .card .nm{flex:none;height:calc(var(--tok)*.7);padding:calc(var(--tok)*.14) calc(var(--tok)*.15) calc(var(--tok)*.04);box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:calc(var(--tok)*.295);font-weight:600;line-height:1.16;letter-spacing:-.02em;color:var(--ink-land)}
  .card .stage{position:relative;flex:1;min-height:0}
  .card .stage::after{content:'';position:absolute;left:50%;bottom:calc(var(--tok)*.04);transform:translateX(-50%);
    width:calc(var(--tok)*1.3);height:calc(var(--tok)*.14);border-radius:50%;
    background:radial-gradient(closest-side,color-mix(in srgb,var(--ink-land) 24%,transparent),transparent)}
  .card .stage svg,.card .stage img{position:absolute;z-index:1;left:50%;bottom:calc(var(--tok)*.08);transform:translateX(-50%);height:92%;width:auto;max-width:88%}
  .card .foot{flex:none;height:calc(var(--tok)*.46);display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--tok)*.2);
    background:linear-gradient(color-mix(in srgb,var(--card-tint) 10%,transparent),color-mix(in srgb,var(--card-tint) 17%,transparent));
    box-shadow:inset 0 1px 0 color-mix(in srgb,var(--card-tint) 24%,transparent)}
  .card .foot .dots{display:inline-flex;align-items:center;gap:calc(var(--tok)*.07);height:calc(var(--tok)*.24)}
  .card .foot .dots i{position:relative;width:calc(var(--tok)*.11);height:calc(var(--tok)*.11);border-radius:50%;background:var(--working);animation:typing 1.8s ease-in-out infinite}
  .card .foot .dots i:nth-child(2){animation-delay:.225s} .card .foot .dots i:nth-child(3){animation-delay:.45s}
  @keyframes typing{0%,60%,100%{top:0;background-color:color-mix(in srgb,var(--working) 35%,transparent)}30%{top:calc(var(--tok)*-.033);background-color:var(--working)}}
  .card .foot svg{flex:none;margin-left:auto;width:calc(var(--tok)*.3);height:calc(var(--tok)*.27);color:color-mix(in srgb,var(--ink-land) 55%,transparent)}
  .gem{position:absolute;z-index:10;top:calc(var(--tok)*-.06);right:calc(var(--tok)*-.06);width:calc(var(--tok)*.28);height:calc(var(--tok)*.28);
    border-radius:50%;background:var(--working);box-shadow:0 0 0 calc(var(--tok)*.055) var(--cream)}
</style>
</head>
<body>
<main>
  <h1>Robot motion</h1>
  <p>Each action is short and returns to the still pose. Buttons play one action now on all copies of that robot (grey: idle list, yellow: working list). The <code>today</code> card is the static image. <code>?r=01,02</code> shows only those robots; without it, every robot with motion.</p>
  <label>How often <input type="range" id="often" min="0.5" max="3" step="0.25" value="1" style="vertical-align:middle;width:200px"> <b id="oftenTxt"></b></label>
  <div id="robots"></div>
</main>
<script src="motion.js"></script>
<script>
  const asked = new URLSearchParams(location.search).get('r');
  const TG = '<svg viewBox="0 0 10 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.4 1.6 4 4.4 1.4 7.2"/><path d="M5.8 7.2h2.8"/></svg>';
  const card = (state, x2) => {
    const work = state === 'working';
    return `<div class="tk"><div class="card ${state}${x2 ? ' x2' : ''}"><div class="edge"><i style="width:${work ? 64 : 38}%"></i></div>
      <div class="nm">${state}</div><div class="stage"></div>
      <div class="foot">${work ? '<span class="dots"><i></i><i></i><i></i></span>' : ''}${TG}</div></div>${work ? '<span class="gem"></span>' : ''}</div>`;
  };
  const BASE = { idle: [...motion.REST.idle], working: [...motion.REST.working] };
  const often = document.getElementById('often');
  const s = (ms) => (ms / 1000).toFixed(1).replace(/\.0$/, '');
  const setOften = () => {
    for (const k in BASE) motion.REST[k] = BASE[k].map((v) => v / often.value);
    document.getElementById('oftenTxt').textContent =
      `×${often.value}: idle rests ${s(motion.REST.idle[0])}–${s(motion.REST.idle[1])}s, working ${s(motion.REST.working[0])}–${s(motion.REST.working[1])}s`;
    motion.retime();
  };
  often.oninput = setOften;
  setOften();

  (async () => {
    const ids = asked ? asked.split(',') : await (await fetch('robots.json')).json();
    for (const n of ids) {
      const text = await (await fetch(`robots/robot-${n}.svg`, { cache: 'no-store' })).text();
      const svg = () => document.importNode(new DOMParser().parseFromString(text, 'image/svg+xml').documentElement, true);
      const sec = document.createElement('section');
      const probe = svg();
      const list = (s) => [...new Set((s || '').split(' ').filter(Boolean))];
      const btns = list(probe.dataset.idle).map((a) => `<button data-a="${a}">${a}</button>`).join('')
        + list(probe.dataset.work).filter((a) => !list(probe.dataset.idle).includes(a)).map((a) => `<button class="w" data-a="${a}">${a}</button>`).join('');
      sec.innerHTML = `<h2>robot-${n} ${btns || '<span style="color:#B9C2CC;font-weight:400">no actions yet</span>'}</h2>
        <div class="island">
          <div><div class="big idle"></div><div class="act"></div><div class="lbl">idle</div></div>
          <div><div class="big working"></div><div class="act"></div><div class="lbl">working</div></div>
          <div>${card('today')}<div class="act"></div><div class="lbl">today</div></div>
          <div>${card('idle')}<div class="act"></div><div class="lbl">card idle</div></div>
          <div>${card('working')}<div class="act"></div><div class="lbl">card working</div></div>
          <div>${card('idle', true)}<div class="act"></div><div class="lbl">card 2× idle</div></div>
          <div>${card('working', true)}<div class="act"></div><div class="lbl">card 2× working</div></div>
        </div>`;
      document.getElementById('robots').append(sec);
      sec.querySelector('.card.today .stage').innerHTML = `<img src="robots/robot-${n}.svg" alt="">`;
      const bots = [];
      for (const host of sec.querySelectorAll('.big, .card:not(.today) .stage')) {
        const b = svg();
        host.append(b);
        bots.push(b);
        const tag = host.closest('.island > div').querySelector(':scope > .act');
        new MutationObserver(() => { tag.textContent = b.dataset.act || ''; }).observe(b, { attributes: true, attributeFilter: ['data-act'] });
        motion.start(b);
      }
      sec.querySelectorAll('button').forEach((btn) => { btn.onclick = () => bots.forEach((b) => motion.play(b, btn.dataset.a)); });
    }
  })();
</script>
</body>
</html>
