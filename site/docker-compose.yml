name: svall-site

# svall.dev on linus-vault: Cloudflare Tunnel -> cloudflared -> Caddy serving /srv/svall.dev, which scripts/release.sh
# and scripts/site-deploy.sh fill; no host port is published. The server keeps its own copy of this file and the
# Caddyfile, so copy a change there by hand.
services:
  web:
    image: caddy:2-alpine
    container_name: svall-web
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/svall.dev:/srv/svall.dev:ro
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: svall-cloudflared
    command: tunnel --no-autoupdate run
    env_file:
      - ./deploy/cloudflared.env
    depends_on:
      - web
    restart: unless-stopped
