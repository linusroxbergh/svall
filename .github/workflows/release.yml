name: release

# A tag builds the Mac controller and both Linux companions, hands a fleet between two Linux machines and installs,
# upgrades and rolls back a clean machine of each architecture with them, and publishes them only once all of that
# passed. Without the SVALL_RELEASE_KEY secret the tag is a dry run: everything is built and tested, nothing is
# signed or uploaded. A tag with a `-` in it, such as v1.0.0-test1, is a dry run too, signed when the secret is there.
# The key never reaches the build: the build packs every archive unsigned, and a job of its own signs them.
# See docs/integration.md.
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # every install refuses a signature the committed signers do not pin, so this is settled before anything is built
  key:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: key
        env:
          KEY: ${{ secrets.SVALL_RELEASE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            trap 'rm -f "$RUNNER_TEMP/release-key"' EXIT
            (umask 077 && printf '%s\n' "$KEY" > "$RUNNER_TEMP/release-key")
            pub=$(ssh-keygen -y -P '' -f "$RUNNER_TEMP/release-key") || {
              echo "::error::SVALL_RELEASE_KEY is not an OpenSSH private key without a passphrase"; exit 1; }
            read -r type blob _ <<< "$pub"
            awk -v k="$type $blob" '!/^#/ && index($0, k) { f = 1 } END { exit !f }' scripts/release/allowed_signers || {
              echo "::error::the public half of SVALL_RELEASE_KEY is not in scripts/release/allowed_signers; add it as that file's header says"; exit 1; }
            echo signed=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no SVALL_RELEASE_KEY secret: a dry run, which builds and tests everything and uploads nothing"
            echo signed=false >> "$GITHUB_OUTPUT"
          fi

  # the key never reaches this job, so nothing the install or the bundlers run can read it
  build:
    needs: key
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # a signed release builds its own rsync from the pinned source, whatever a cache holds
      - if: needs.key.outputs.signed != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            vendor/rsync
            vendor/node
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/release/pins.json') }}
      - name: Build and scan the release
        run: >-
          scripts/release-build.sh --out "$RUNNER_TEMP/release" --version "$GITHUB_REF_NAME"
          --url-base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
      # the release a fresh install upgrades to; never published, but served on the fresh-install runner's loopback so
      # that the upgrade downloads its companion as the app does
      - name: Build and scan the upgrade
        run: >-
          scripts/release-build.sh --out "$RUNNER_TEMP/upgrade" --version "$GITHUB_REF_NAME-next"
          --url-base http://127.0.0.1:8765/upgrade
      # kept only as long as this run needs them; with the key, the sign job signs them before any other job takes them
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release
          path: ${{ runner.temp }}/release/*.tar.gz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upgrade
          path: ${{ runner.temp }}/upgrade/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # signs the manifest inside every archive the build packed, running nothing but this checkout's scripts, tar and
  # ssh-keygen, so the archives the other jobs test are the ones published
  sign:
    needs: [key, build]
    if: needs.key.outputs.signed == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: upgrade
          path: ${{ runner.temp }}/upgrade
      - env:
          KEY: ${{ secrets.SVALL_RELEASE_KEY }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/release-key"' EXIT
          (umask 077 && printf '%s\n' "$KEY" > "$RUNNER_TEMP/release-key")
          scripts/release-build.sh --sign "$RUNNER_TEMP/release-key" --out "$RUNNER_TEMP/release"
          scripts/release-build.sh --sign "$RUNNER_TEMP/release-key" --out "$RUNNER_TEMP/upgrade"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release
          path: ${{ runner.temp }}/release/*.tar.gz
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upgrade
          path: ${{ runner.temp }}/upgrade/*.tar.gz
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # the release's own companion, handed between two Linux containers; see scripts/integration/fleet-handover.sh
  integration:
    needs: [build, sign]
    # a dry run skips sign, and its archives are tested unsigned
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release
          path: ${{ runner.temp }}/release
      - run: >-
          scripts/integration/fleet-handover.sh --out "$RUNNER_TEMP/logs"
          --archive "$RUNNER_TEMP/release/svall-companion-$GITHUB_REF_NAME-linux-${{ matrix.arch }}.tar.gz"
      - id: logs
        if: failure()
        run: node scripts/release-scan.mjs --secrets-only "$RUNNER_TEMP/logs"
      - if: failure() && steps.logs.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fleet-handover-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/logs

  # a clean machine added by the Mac controller's svall, upgraded and rolled back; see scripts/integration/fresh-install.sh
  fresh-install:
    needs: [build, sign]
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: upgrade
          path: ${{ runner.temp }}/upgrade
      - run: >-
          scripts/integration/fresh-install.sh --out "$RUNNER_TEMP/logs"
          --release "$RUNNER_TEMP/release" --upgrade "$RUNNER_TEMP/upgrade"
      - id: logs
        if: failure()
        run: node scripts/release-scan.mjs --secrets-only "$RUNNER_TEMP/logs"
      - if: failure() && steps.logs.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fresh-install-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/logs

  publish:
    needs: [key, integration, fresh-install]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release
          path: ${{ runner.temp }}/release
      - if: needs.key.outputs.signed != 'true' || contains(github.ref_name, '-')
        working-directory: ${{ runner.temp }}/release
        run: |
          echo "::notice::dry run: every job passed; nothing is uploaded"
          sha256sum -- *.tar.gz
      # one signed list of every asset, checked against the signers the release itself pins before anything goes up
      - if: needs.key.outputs.signed == 'true' && !contains(github.ref_name, '-')
        working-directory: ${{ runner.temp }}/release
        env:
          KEY: ${{ secrets.SVALL_RELEASE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/release-key"' EXIT
          (umask 077 && printf '%s\n' "$KEY" > "$RUNNER_TEMP/release-key")
          sha256sum -- *.tar.gz > SHA256SUMS
          ssh-keygen -Y sign -f "$RUNNER_TEMP/release-key" -n svall-release SHA256SUMS
          ssh-keygen -Y verify -f "$GITHUB_WORKSPACE/scripts/release/allowed_signers" -I svall-release \
            -n svall-release -s SHA256SUMS.sig < SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            -- *.tar.gz SHA256SUMS SHA256SUMS.sig
