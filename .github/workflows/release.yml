name: release

# A tag builds the Mac controller and both Linux companions, hands a fleet between two Linux machines and installs,
# upgrades and rolls back a clean machine of each architecture with them, and publishes them only once all of that
# passed. Without the ARCHI_RELEASE_KEY secret the tag is a dry run: everything is built and tested, nothing is
# signed or uploaded. See docs/integration.md.
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: |
            vendor/rsync
            vendor/node
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/release/pins.json') }}
      - id: key
        env:
          KEY: ${{ secrets.ARCHI_RELEASE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            (umask 077 && printf '%s\n' "$KEY" > "$RUNNER_TEMP/release-key")
            echo "ARCHI_RELEASE_KEY=$RUNNER_TEMP/release-key" >> "$GITHUB_ENV"
            echo signed=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no ARCHI_RELEASE_KEY secret: a dry run, which builds and tests everything and uploads nothing"
            echo signed=false >> "$GITHUB_OUTPUT"
          fi
      - name: Build and scan the release
        run: >-
          scripts/release-build.sh --out "$RUNNER_TEMP/release" --version "$GITHUB_REF_NAME"
          --url-base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
      # the release a fresh install upgrades to; never published
      - name: Build and scan the upgrade
        run: >-
          scripts/release-build.sh --out "$RUNNER_TEMP/upgrade" --version "$GITHUB_REF_NAME-next"
          --url-base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME-next"
      - if: always()
        run: rm -f "$RUNNER_TEMP/release-key"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ runner.temp }}/release/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: upgrade
          path: ${{ runner.temp }}/upgrade/*.tar.gz
          if-no-files-found: error

  # the release's own companion, handed between two Linux containers; see scripts/integration/fleet-handover.sh
  integration:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release
      - run: >-
          scripts/integration/fleet-handover.sh --out "$RUNNER_TEMP/logs"
          --archive "$RUNNER_TEMP/release/archipelago-companion-$GITHUB_REF_NAME-linux-${{ matrix.arch }}.tar.gz"
      - id: logs
        if: failure()
        run: node scripts/release-scan.mjs --secrets-only "$RUNNER_TEMP/logs"
      - if: failure() && steps.logs.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: fleet-handover-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/logs

  # a clean machine added by the Mac controller's archi, upgraded and rolled back; see scripts/integration/fresh-install.sh
  fresh-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@v8
        with:
          name: upgrade
          path: ${{ runner.temp }}/upgrade
      - run: >-
          scripts/integration/fresh-install.sh --out "$RUNNER_TEMP/logs"
          --release "$RUNNER_TEMP/release" --upgrade "$RUNNER_TEMP/upgrade"
      - id: logs
        if: failure()
        run: node scripts/release-scan.mjs --secrets-only "$RUNNER_TEMP/logs"
      - if: failure() && steps.logs.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: fresh-install-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/logs

  publish:
    needs: [build, integration, fresh-install]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release
      - if: needs.build.outputs.signed != 'true'
        working-directory: ${{ runner.temp }}/release
        run: |
          echo "::notice::dry run: every job passed; nothing is signed or uploaded"
          sha256sum -- *.tar.gz
      # one signed list of every asset, checked against the signers the release itself pins before anything goes up
      - if: needs.build.outputs.signed == 'true'
        working-directory: ${{ runner.temp }}/release
        env:
          KEY: ${{ secrets.ARCHI_RELEASE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/release-key"' EXIT
          (umask 077 && printf '%s\n' "$KEY" > "$RUNNER_TEMP/release-key")
          sha256sum -- *.tar.gz > SHA256SUMS
          ssh-keygen -Y sign -f "$RUNNER_TEMP/release-key" -n archipelago-release SHA256SUMS
          ssh-keygen -Y verify -f "$GITHUB_WORKSPACE/scripts/release/allowed_signers" -I archipelago-release \
            -n archipelago-release -s SHA256SUMS.sig < SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            -- *.tar.gz SHA256SUMS SHA256SUMS.sig
